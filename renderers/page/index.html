  for (const b of document.querySelectorAll('[data-side-view]')) (b.classList.toggle('on', b.dataset.sideView === sideView), b.setAttribute('aria-pressed', b.dataset.sideView === sideView))
  if (sideView !== 'stats') return
  const floor = board.floors.find((f) => f.id === floorInView())
  const tabs = [...(floor ? [{ id: floor.id, label: floor.name }] : []), { id: STATS_ALL, label: 'All floors' }]
  const projects = board.floors.map((f) => ({ id: f.id, label: f.name, color: f.color }))
  drawPanel($('stats'), statsHtml({ ...statsView, projects, tabs, scope: statsView.all || !floor ? STATS_ALL : floor.id }), {})
}

async function readStats() {
  const reading = ++statsView.reading
  const stats = await tower.stats(statsQuery(statsView.range, Date.now()))
  if (reading !== statsView.reading) return
  Object.assign(statsView, { stats, at: Date.now() })
  drawSideView()
}

function showSideView(view) {
  sideView = view
  tower.store.set('side.view', view)
  clearInterval(statsPoll)
  if (view === 'stats') (readStats(), (statsPoll = setInterval(readStats, STATS_POLL_MS)))
  drawSideView()
}

/** The `[data-hold]` row at a scrolled list's top edge, the last to start at or above it, and its offset from the edge. */
const topAnchorOf = (list) => {
  const top = list.getBoundingClientRect().top
  const row = [...list.querySelectorAll('[data-hold]')].findLast((el) => el.getBoundingClientRect().top <= top) ?? list.querySelector('[data-hold]')
  return row && { key: row.dataset.hold, offset: row.getBoundingClientRect().top - top }
}

/**
 * Replaces a scrolled list's content with what stays at its top kept where it was: a browser's scroll anchoring holds
 * a list still while rows above change height, and loses its anchor when the rows are replaced.
 */
function redrawHeld(list, html) {
  const anchor = topAnchorOf(list)
  list.innerHTML = html
  const row = anchor && list.querySelector(`[data-hold="${CSS.escape(anchor.key)}"]`)
  if (row) list.scrollTop += row.getBoundingClientRect().top - list.getBoundingClientRect().top - anchor.offset
}

/** Writes `html` into `el` only when it changed, so a focused or hovered control in it survives a render. */
const painted = new WeakMap()
const paintOnce = (el, html) => painted.get(el) === html || (painted.set(el, html), (el.innerHTML = html))
/** `paintOnce`, the control that had focus in `el` keeping it. */
const repaint = (el, html) => keepingFocus(el, () => paintOnce(el, html))

function render() {
  const all = cards()
  const duty = all.filter(onDuty)
  const count = (a) => duty.filter((c) => c.attention === a).length
  const waiting = heededWaits(board, heed).length
  document.title = waiting ? `(${waiting}) The Tower` : 'The Tower'
  paintOnce($('tally'), `<span class="chip ${loudest(waitsOnYou()) ?? 'quiet'} ${waiting ? 'some' : ''}" tabindex="0" data-tip="${esc(`${WAITING_NAME}: ${WAITING_MEANS}`)}"><span class="lamp"></span><b>${waiting}</b> ${WAITING_NAME}</span>` +
    ['ready', 'working', 'quiet', 'broken']
      .map((a) => `<span class="chip ${a}" tabindex="0" data-tip="${esc(`${ATTENTION_NAME[a]}: ${ATTENTION_MEANS[a]}\n\n${ON_DUTY_MEANS}`)}"><span class="lamp"></span><b>${count(a)}</b> ${ATTENTION_NAME[a]}</span>`).join(''))
  const host = hostState(board)
  paintOnce($('host'), `<span class="host-state ${HOST_ATTENTION[host]}" tabindex="0" data-tip="${esc(HOST_MEANS[host])}"><span class="lamp"></span>${HOST_NAME[host]}</span>`)
  $('notes').innerHTML = claudeUntestedHtml(board) ?? ''
  paintLimits()
  keepingFocus($('floors'), () => redrawHeld($('floors'), floorsTopDown().map(floorHtml).join('')))
  drawSideView()
  repaint($('rail'), railHtml(waiting))
  $('side-foot').innerHTML = `<span>config</span><code title="${esc(board.config)}"><bdi>${esc(board.config)}</bdi></code>${fileButtonsHtml(board.config)}`
  const c = selected && findCard(selected)
  if (c) barHtml(c)
  if (draftOpen) draftHeadHtml()
  if (archiveOpen) drawArchive()
  if (!selected) repaint($('sky'), skylineHtml())
  paintSky()
  renderDock()
  drawSettings()
  tick()
}

/** The collapsed sidebar: a way back, the waiting count, and a lamp per session on duty. */
const railHtml = (waiting) =>
  `<button class="side-toggle" data-side aria-label="show the sidebar" title="show the sidebar (⌘B)">»</button>
  ${waiting ? `<span class="count ${loudest(waitsOnYou())}" title="waiting on you">${waiting}</span>` : ''}
  ${dutyOrder(board).map((c) => {
    const title = esc(callsign(c.id) + ' · ' + statusName(c) + (gistLine(c) ? ' · ' + gistLine(c) : ''))
    return `<a class="lamp ${lampOf(c)} ${c.id === selected ? 'sel' : ''}" href="#${c.id}"${c.id === selected ? ' aria-current="true"' : ''} aria-label="${title}" title="${title}"></a>`
  }).join('')}`

function toggleSide() {
  document.body.classList.toggle('collapsed')
  tower.store.set('side.collapsed', document.body.classList.contains('collapsed'))
}
document.body.classList.toggle('collapsed', (await tower.store.get('side.collapsed')) === true)

function tick() {
  if (!selected && !shelfOpen) paintSky()
  paintLimits()
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = ago(Date.now() - Number(el.dataset.since))
  if (ring === 'remind' && Date.now() - rungAt >= REMIND_MS) ringFor(heededWaits(board, heed))
}

/**
 * What this viewer did about the waits (`Heed` in cards.ts): dismissed, kept in `tower.store` for every renderer of
 * theirs, and visited by N this round. `ring`: how often a wait rings, kept there too; `rungAt`: when one last rang.
 */
let heed = { dismissed: new Set(), visited: new Set() }
let ring = 'once'
let rungAt = Date.now()
/** The board the last transitions were read against: none until the first, which is silent. */
let attended

/** The worker you are looking at: its waits notify and ring for nobody. */
const watching = (id) => document.hasFocus() && selected === id

/**
 * One notification per wait that begins, none for the waits already on the board when the page opened, for those
 * dismissed or for the worker being watched; each closes once its wait is over. The first of them rings.
 */
const alerts = new Map()
function attend(next) {
  const { began, ended } = transitions(attended, next)
  attended = next
  for (const w of ended) (alerts.get(w.key)?.close(), alerts.delete(w.key))
  const said = waitsBeganLine(began.filter((w) => !heed.dismissed.has(w.key)), callsign)
  if (said) announce(said)
  const fresh = began.filter((w) => !heed.dismissed.has(w.key) && !watching(w.id))
  if (Notification.permission === 'granted') for (const w of fresh) alerts.set(w.key, showAlert(findCard(w.id), w))
  ringFor(fresh)
}

/** Rings the first of `waits` not of the worker being watched, unless rings are off. */
function ringFor(waits) {
  const wait = ring === 'off' ? undefined : ringing(waits, document.hasFocus() ? selected : undefined)
  if (!wait) return
  rungAt = Date.now()
  playSound(SOUNDS[soundOf(wait)])
}

let audio
function playSound({ notes, wave, step }) {
  audio ??= new AudioContext()
  const now = audio.currentTime
  notes.forEach((freq, i) => {
    const osc = audio.createOscillator()
    const gain = audio.createGain()
    osc.type = wave
    osc.frequency.value = freq
    gain.gain.setValueAtTime(0, now + i * step)
    gain.gain.linearRampToValueAtTime(0.12, now + i * step + 0.02)
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * step + 0.9)
    osc.connect(gain).connect(audio.destination)
    osc.start(now + i * step)
    osc.stop(now + i * step + 1)
  })
}

/** The viewer's dismissals and ring setting as `tower.store` keeps them: another renderer of theirs may have changed them. */
async function readHeed() {
  const [dismissed, stored] = await Promise.all([tower.store.get(DISMISSED_KEY), tower.store.get(RING_KEY)])
  heed = { ...heed, dismissed: new Set(dismissed ?? []) }
  ring = stored ?? 'once'
}

function dismissWait(key) {
  const dismissed = dismissing(board, heed.dismissed, key)
  heed = { ...heed, dismissed: new Set(dismissed) }
  tower.store.set(DISMISSED_KEY, dismissed)
  alerts.get(key)?.close()
  render()
}

function chooseRing(next) {
  ring = next
  tower.store.set(RING_KEY, ring)
  drawSettings()
}

/** Every showing the page has seen: a new one opens its tab on the selected session, and alerts when you aren't looking at it. */
const seenShown = new Set()
let shownPrimed = false

function noticeShown(all) {
  for (const c of all) for (const s of visibleShown(c)) {
    const key = shownKey(s)
    if (seenShown.has(key)) continue
    seenShown.add(key)
    if (!shownPrimed) continue
    if (selected === c.id) showPane(shownPane(s))
    if (!(document.hasFocus() && selected === c.id) && Notification.permission === 'granted') showShownAlert(c, s)
  }
  shownPrimed = true
}

function showShownAlert(c, s) {
  const n = new Notification(`${callsign(c.id)} ${s.kind === 'link' ? 'asks you to open' : 'shows you'} ${shownTitle(s)}`, { body: `${c.project}: ${s.target}`, tag: shownKey(s) })
  n.onclick = () => (window.focus(), select(c.id), showPane(shownPane(s)), n.close())
}

function showAlert(c, w) {
  const n = new Notification(`${callsign(c.id)} · ${statusName(c)}`, {
    body: `${c.project}: ${gistLine(c)}`, tag: c.id, requireInteraction: w.reason === 'blocked' || w.reason === 'asks',
  })
  n.onclick = () => (window.focus(), select(c.id), n.close())
  return n
}

/** The settings popover, drawn again whenever what it shows may have changed: only while open. */
let settingsDrawn
const drawSettings = () => $('settings').matches(':popover-open') && paintSettings()
function paintSettings() {
  const html = settingsHtml([alertsSection(Notification.permission), soundSection(ring), themeSection(tower.schemeChoice())])
  if (html === settingsDrawn) return
  const focused = document.activeElement?.closest('#settings [data-ring-choice], #settings [data-scheme-choice], #settings [data-sound-play]')
  const again = focused && [...focused.attributes].find((a) => a.name.startsWith('data-') && a.name !== 'data-tip')
  $('settings').innerHTML = settingsDrawn = html
  if (again) $('settings').querySelector(`[${again.name}="${CSS.escape(again.value)}"]`)?.focus()
}
$('settings-open').innerHTML = ICON.settings
placeOnOpen($('settings'), () => $('settings-open'))
$('settings').addEventListener('beforetoggle', (e) => e.newState === 'open' && paintSettings())
$('settings').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-alerts-ask], [data-ring-choice], [data-sound-play], [data-scheme-choice]')
  if (!el) return
  if (el.matches('[data-alerts-ask]')) return (await Notification.requestPermission(), drawSettings())
  if (el.dataset.ringChoice) return chooseRing(el.dataset.ringChoice)

  tower.chooseScheme(el.dataset.schemeChoice)
})

/** The worker a key moved to, its sidebar row scrolled into view when it is out of sight. */
function moveTo(id) {
  select(id)
  $('floors').querySelector(`.sess[data-id="${id}"]`)?.scrollIntoView({ block: 'nearest' })
}

/** To the worker a move key names, in the order every renderer moves in (src/shared/cards.ts). */
function go(move) {
  if (move !== 'waiting') {
    const to = neighbours(board, selected, heed)[move]
    return to ? moveTo(to.id) : toast('Nobody is on duty')
  }
  const waits = heededWaits(board, heed)
  const step = nextWait(waits, heed.visited, selected)
  heed = { ...heed, visited: step.visited }
  if (step.to) return moveTo(step.to.id)
  toast(waits.length ? 'Nobody else is waiting on you' : 'Nobody is waiting on you')
}

/** Those `send-home` ends: the worker and everyone under it that runs, each a card. */
const sentHome = (c) => [c, ...crewOf(cards(), c)].filter((h) => c.calls['send-home'].some(([, { id }]) => id === h.id))

const sendHomeTitle = (c) => `end ${sentHome(c).map((h) => h.callsign).join(', ')}: ${callsign(c.id)} and everyone under it that runs; each can be resumed`

async function sendHome(c) {
  const sent = sentHome(c)
  const busy = sent.filter((h) => h.status === 'working')
  const ask = `Send ${callsign(c.id)} home with everyone under it that runs?\n\n${sent.map((h) => `${h.callsign} · ${statusName(h)}`).join('\n')}${busy.length ? `\n\n${busy.map((h) => h.callsign).join(', ')} ${busy.length === 1 ? 'is' : 'are'} working right now.` : ''}\n\nEach can be resumed.`
  if (!confirm(ask)) return
  for (const call of c.calls['send-home']) await tower.run(call).catch((err) => toast(err.message))
}

/** Says `msg` to a screen reader, through the polite live region: a new node each time, so the same words are said again. */
const announce = (msg) => $('announce').replaceChildren(Object.assign(document.createElement('p'), { textContent: msg }))

const toast = (msg) => {
  announce(msg)
  $('toast').textContent = msg
  $('toast').style.display = 'block'
  clearTimeout(toast.t)
  toast.t = setTimeout(() => ($('toast').style.display = 'none'), 4000)
}

/** A request whose failure is told in a toast, answering `undefined`. */
const told = (request) => request.catch((err) => (toast(err.message), undefined))

const floorOf = (project) => board.floors.find((f) => f.id === project)

let term, fit, stopScreen
const DRIVE_FONT = 13
/** A monospace cell is about 0.6 of the font size wide and 1.2 tall. */
const CELL_WIDTH = 0.6
const CELL_HEIGHT = 1.2
const REFIT_DEBOUNCE_MS = 120

/**
 * The PTY has one size: whoever types owns it. Opening the terminal claims it when no other terminal is open on the
 * session, fitting the PTY to this pane; a resize from anyone else hands it back, and the view follows the PTY at a
 * font scaled to fit.
 */
let claimed

const fitFont = (cols, rows) => {
  const { clientWidth, clientHeight } = $('c-screen')
  return Math.max(6, Math.min(DRIVE_FONT, Math.floor(Math.min((clientWidth - 4) / (cols * CELL_WIDTH), (clientHeight - 4) / (rows * CELL_HEIGHT)))))
}

function showMode(text = isOwner() ? `in control · ${term.cols}×${term.rows}` : 'watching · type to take control') {
  $('c-mode').className = isOwner() ? 'owner' : ''
  $('c-mode').textContent = text
}

function claim() {
  term.options.fontSize = DRIVE_FONT
  fit.fit()
  claimed = { cols: term.cols, rows: term.rows }
  told(tower.call('resize', { id: selected, ...claimed }))
  showMode()
}

const isOwner = () => Boolean(claimed && term && claimed.cols === term.cols && claimed.rows === term.rows)

const sendKeys = tower.keys
const sendShellKeys = tower.shellKeys

function followPty(cols, rows) {
  if (term.cols === cols && term.rows === rows) return
  term.resize(cols, rows)
  if (!isOwner()) term.options.fontSize = fitFont(cols, rows)
  showMode()
}

const typed = (data) => {
  if (document.activeElement !== term.textarea) return
  if (!isOwner()) claim()
  sendKeys(selected, data)
}

function openTerminal({ cols, rows, data, exited, terminals }) {
  term?.dispose()
  term = new Terminal({ cols, rows, fontSize: fitFont(cols, rows), fontFamily: type.mono, cursorBlink: false, scrollback: 0, theme: terminalTheme(scheme()) })
  fit = new FitAddon.FitAddon()
  term.loadAddon(fit)
  term.open($('c-screen'))
  term.write(data)
  if (exited) return showMode('past session · read-only')
  term.attachCustomKeyEventHandler(terminalKeys(shortcut, typed))
  term.onData(typed)
  if (terminals === 0) claim()
  else showMode()
  term.focus()
}

function closeTerminal() {
  claimed = undefined
  stopScreen?.()
  term?.dispose()
  term = undefined
  $('c-screen').innerHTML = ''
  $('c-mode').textContent = ''
}

/** The selected session is kept in the URL hash, so a reload reopens it. */
function select(id) {
  leaveShelf()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  arriving = undefined
  selected = id
  paneChoice = undefined
  dropPick()
  noteRe = undefined
  history.replaceState(null, '', `#${id}`)
  $('main').classList.remove('home')
  render()
  stopScreen = tower.watch(`terminal/${id}`, (msg) => {
    if (msg.t === 'snapshot') openTerminal(msg)
    if (msg.t === 'o') term.write(msg.data)
    if (msg.t === 'r') followPty(...msg.size.split('x').map(Number))
    if (msg.t === 'x') select(id)
  })
}

function goHome() {
  followChanges(undefined)
  leaveShelf()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  arriving = undefined
  selected = undefined
  history.replaceState(null, '', location.pathname)
  $('main').classList.add('home')
  render()
}

let refitTimer
new ResizeObserver(() => {
  clearTimeout(refitTimer)
  refitTimer = setTimeout(() => {
    if (!term) return
    if (isOwner()) claim()
    else term.options.fontSize = fitFont(term.cols, term.rows)
  }, REFIT_DEBOUNCE_MS)
}).observe($('screen'))

/** The shelf entry open in the main pane; for a collection, its files and the one shown. */
let shelfOpen

const shelfPath = (project, n, file) => `shelf/${project}/${n}${file ? '/' + file.split('/').map(encodeURIComponent).join('/') : ''}`
const shelfUrl = (project, n, file) => `/${shelfPath(project, n, file)}`
const shelfHash = ({ project, n, file }) => `#shelf/${project}/${n}${file ? '/' + encodeURIComponent(file) : ''}`


function openShelf(project, n, file) {
  const f = board.floors.find((f) => f.id === project)
  const entry = f?.shelf?.[n]
  if (!entry) return goHome()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  arriving = undefined
  closePageWatches()
  Object.assign(pageRelay, { token: undefined, paired: false })
  selected = undefined
  shelfOpen = { project, n, file }
  history.replaceState(null, '', shelfHash(shelfOpen))
  $('main').classList.remove('home')
  $('main').classList.add('shelf')
  $('shelf-view').style.cssText = paint(project)
  const own = { html: `/run/${project}/${n}`, url: entry.url, renderer: entry.renderer && rendererUrl(entry.renderer) }[shelfKind(entry)]
  const tab = own ? `<a href="${esc(own)}" target="_blank" rel="noreferrer">↗ new tab</a>` : ''
  $('shelf-head').innerHTML = `<span class="label">${esc(entry.label)}</span><span class="dim">${esc(f.name)} · ${esc(shelfSource(entry))}</span>
    <span class="actions">${tab}<button data-act="home" aria-label="back to the skyline" title="back to the skyline">✕</button></span>`
  $('shelf-body').innerHTML = ''
  render()
  if (shelfKind(entry) === 'html') showPage(shelfUrl(project, n, shelfPage(entry)))
  if (shelfKind(entry) === 'renderer') showPage(rendererUrl(entry.renderer))
  if (shelfKind(entry) === 'url') showUrl(entry.url)
  if (shelfKind(entry) === 'md') showCollection(entry, file)
}

/** A page framed with the relay, at an opaque origin: an `html` entry's, or a declared renderer's. */
function showPage(url) {
  const { token } = pairPage()
  $('shelf-body').innerHTML = `<iframe id="shelf-page" class="page" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-pointer-lock" src="${esc(url)}?tower=${token}"></iframe>`
  $('shelf-page').addEventListener('load', onPageLoad)
}

function leaveShelf() {
  closePageWatches()
  Object.assign(pageRelay, { token: undefined, paired: false })
  shelfOpen = undefined
  $('main').classList.remove('shelf')
  $('shelf-body').innerHTML = ''
}

/** The open `html` or `renderer` entry's page, spoken to as in src/shared/shelf-page.ts: its requests go to the routes they name. */
/**
 * The open page's relay. Its frame URL carries a token each load, and the page sends it with every message: a
 * document the frame navigates to never has it. Nothing is sent until the page says hello; a frame that loads
 * without saying hello holds another document, and the relay ends.
 */
const pageRelay = { token: undefined, paired: false, helloSinceLoad: false }
const pairPage = () => Object.assign(pageRelay, { token: crypto.randomUUID(), paired: false, helloSinceLoad: false })
const onPageLoad = () => {
  if (!pageRelay.helloSinceLoad) (pageRelay.paired = false, closePageWatches())
  pageRelay.helloSinceLoad = false
}
const toShelfPage = (msg) => pageRelay.paired && $('shelf-page')?.contentWindow.postMessage(msg, '*')
const sendBoard = () => {
  if (!shelfOpen) return
  const msg = { t: 'board', v: tower.version, self: { project: shelfOpen.project, n: shelfOpen.n } }
  toShelfPage(boardError ? { ...msg, error: { code: boardError.code, message: boardError.message } } : { ...msg, board })
}
/** The scheme goes to a `url` page too: it is the only message such a page gets, and it carries nothing private. */
const sendScheme = () => {
  const msg = { t: 'scheme', scheme: document.documentElement.dataset.scheme }
  toShelfPage(msg)
  $('shelf-url')?.contentWindow.postMessage(msg, '*')
}

/** The streams the open page watches, by its id. Closed when the page goes away. */
const pageWatches = new Map()
const closePageWatches = () => {
  for (const unwatch of pageWatches.values()) unwatch()
  pageWatches.clear()
}

const pageRequests = {
  call: ({ verb, body }) => tower.call(verb, body),
  get: ({ path }) => tower.get(path),
  text: ({ path }) => tower.text(path),
  blob: ({ path }) => tower.blob(path),
  recall: () => JSON.parse(remembered(pageKey(shelfOpen)) ?? 'null'),
  stored: ({ key }) => tower.store.get(key),
}

/** Where the open page's remembered value is kept: one per shelf entry. */
const pageKey = ({ project, n }) => `shelf-page:${project}/${n}`

const towerVerbs = {
  select: ({ id }) => select(id),
  home: () => goHome(),
  shelf: ({ project, n }) => openShelf(project, n),
  scheme: ({ scheme }) => tower.chooseScheme(scheme),
}

addEventListener('message', async (e) => {
  if (!e.source || e.source !== $('shelf-page')?.contentWindow) return
  const msg = e.data
  const token = pageRelay.token
  if (!token || msg.token !== token) return
  if (msg.t === 'hello') return (Object.assign(pageRelay, { paired: true, helloSinceLoad: true }), closePageWatches(), sendScheme(), sendBoard())
  if (!pageRelay.paired) return
  if (msg.t === 'tower') return towerVerbs[msg.verb](msg)
  if (msg.t === 'remember') return shelfOpen && remember(pageKey(shelfOpen), JSON.stringify(msg.value))
  if (msg.t === 'store') return (tower.store.set(msg.key, msg.value), Promise.all([readHeed(), readCrewFolds()]).then(render))
  if (msg.t === 'watch') return pageWatches.set(msg.id, tower.watch(msg.path, (data) => toShelfPage({ t: 'event', id: msg.id, data })))
  if (msg.t === 'unwatch') return (pageWatches.get(msg.id)?.(), pageWatches.delete(msg.id))
  const answer = (reply) => pageRelay.token === token && toShelfPage({ t: 'answer', id: msg.id, ...reply })
  try {
    answer({ data: await pageRequests[msg.t](msg) })
  } catch (err) {
    answer({ error: err.message, code: err.code })
  }
})

/** A frame of a page nobody serves would show the browser's error: say so instead, with a way to look again. */
async function showUrl(url) {
  const opened = shelfOpen
  const up = await fetch(url, { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false)
  if (shelfOpen !== opened) return
  $('shelf-body').innerHTML = up
    ? `<iframe id="shelf-url" class="page" src="${esc(url)}" allow="clipboard-read; clipboard-write"></iframe>`
    : `<div class="shelf-empty">nothing answers at ${esc(url)}<br><br><button data-shelf-retry>look again</button></div>`
  $('shelf-url')?.addEventListener('load', sendScheme)
}

/** A kept item by its tag, as every renderer calls it; any other file by its name. */
const shelfFileName = (entry, file) => ('item' in entry ? tagOf(file) : base(file).replace(/\.md$/, ''))

async function showCollection(entry, file) {
  const opened = shelfOpen
  const files = await told(tower.get(shelfPath(opened.project, opened.n)))
  if (!files) return
  if (shelfOpen !== opened) return
  if (!files.length) return ($('shelf-body').innerHTML = `<div class="shelf-empty">no file matches ${esc(shelfSource(entry))}</div>`)
  opened.files = files
  $('shelf-body').innerHTML = `<div class="shelf-files">${files.map((f) => `<div data-doc="${esc(f)}" title="${esc(f)}">${esc(shelfFileName(entry, f))}</div>`).join('')}</div>
    <iframe id="shelf-doc" sandbox="allow-same-origin"></iframe>`
  showDoc(files.includes(file) ? file : files[0])
}

/** The document renders in a frame where its scripts can't run; the tower still reads its clicks. */
async function showDoc(file) {
  const opened = shelfOpen
  opened.file = file
  history.replaceState(null, '', shelfHash(opened))
  for (const el of document.querySelectorAll('[data-doc]')) el.classList.toggle('sel', el.dataset.doc === file)
  const md = await told(tower.text(shelfPath(opened.project, opened.n, file)))
  if (md === undefined) return
  if (shelfOpen !== opened || opened.file !== file) return
  const doc = $('shelf-doc')
  doc.onload = () => doc.contentDocument.addEventListener('click', followLink)
  doc.srcdoc = `<!doctype html><html data-scheme="${scheme()}"><meta charset="utf-8"><link rel="stylesheet" href="/design.css"><style>${documentCss}</style><article>${documentHtml(md, `/${shelfPath(opened.project, opened.n, file)}`)}</article>`
}

/** A link to another file of the collection opens it here; a web or mail link opens in a new tab, any other is refused. */
function followLink(e) {
  const a = e.target.closest('a[href]')
  const href = a?.getAttribute('href')
  if (!href || href.startsWith('#')) return
  e.preventDefault()
  const target = new URL(href, `http://shelf/${shelfOpen.file}`)
  if (target.host !== 'shelf') return safeHref(href) ? window.open(target.href, '_blank', 'noreferrer') : toast(`${href} is not a link the tower opens`)
  const file = decodeURIComponent(target.pathname.slice(1))
  if (shelfOpen.files.includes(file)) return showDoc(file)
  toast(`${file} is not in this collection`)
}

/** The floor whose past workers fill the main pane, and the words they are filtered by. */
let archiveOpen

function openArchive(project) {
  const f = floorOf(project)
  if (!f) return goHome()
  followChanges(undefined)
  leaveShelf()
  leaveDraft()
  closeTerminal()
  arriving = undefined
  selected = undefined
  archiveOpen = { project, words: [] }
  history.replaceState(null, '', `#archive/${project}`)
  $('main').classList.remove('home')
  $('main').classList.add('archived')
  $('archive-view').style.cssText = paint(project)
  $('archive-head').innerHTML = `<span class="label">Archive</span><span class="dim">${esc(f.name)}</span>
    <input id="archive-filter" type="search" placeholder="filter by callsign, prompt or answer" autocomplete="off">
    <span class="actions"><small class="dim" id="archive-count"></small><button data-act="home" aria-label="back to the skyline" title="back to the skyline">✕</button></span>`
  render()
  $('archive-filter').focus()
}

function leaveArchive() {
  archiveOpen = undefined
  $('main').classList.remove('archived')
}

let archiveDrawn = ''
/** Newest first, each worker with every conversation it held and the way to resume or reach it. */
function drawArchive() {
  const f = floorOf(archiveOpen.project)
  if (!archives.has(f.id)) readArchive(f.id)
  const archive = archives.get(f.id).cards
  if (!archive) {
    $('archive-count').textContent = plural(pastCount(f), 'worker')
    return void ($('archive-list').innerHTML = archiveDrawn = '<div class="empty">reading the archive…</div>')
  }
  const past = pastOf(f, archive)
  const shown = past.filter((c) => matchesWords(c, archiveOpen.words))
  $('archive-count').textContent = shown.length === past.length ? plural(past.length, 'worker') : `${shown.length} of ${past.length}`
  const html = shown.map(pastHtml).join('') || '<div class="empty">no past worker matches</div>'
  if (html !== archiveDrawn) $('archive-list').innerHTML = archiveDrawn = html
}

$('archive-view').addEventListener('input', (e) => {
  if (e.target.id !== 'archive-filter') return
  archiveOpen.words = wordsOf(e.target.value)
  drawArchive()
})

/** The draft open in the main pane (src/shared/drafts.ts), its textarea holding `text`. */
let draftOpen
let saveTimer
const AUTOSAVE_MS = 800

const draftHash = ({ project, id }) => `#draft/${project}${id ? '/' + encodeURIComponent(id) : ''}`
const targets = () => cards().filter((c) => can(c, 'submit'))
const DRAFT_STATE = { conflict: 'changed on disk', new: 'new · saved once it has words', editing: 'editing', saved: 'saved' }

function draftHeadHtml() {
  const d = draftOpen
  const f = board.floors.find((f) => f.id === d.project)
  const item = draftItem(board.floors, d.project, d.id)
  const keptBy = item?.keptBy
  const by = keptBy ? ` · kept by <a href="#${keptBy.session}" title="go to the worker that kept it">${keptBy.callsign}</a>` : ''
  const tag = item ? `<button class="tag" data-copy="${esc(item.tag)}" title="${esc(`${draftsOf(f).dir}/${item.id}`)} · click to copy the tag">${esc(item.tag)}</button>` : ''
  const file = item && fileButtonsHtml(`${draftsOf(f).dir}/${item.id}`)
  $('draft-head').innerHTML = `<span class="label">Draft</span>${tag}${file ?? ''}<span class="dim">${esc(f.name)} · ${DRAFT_STATE[draftState(d)]}${by}</span>
    <span class="actions"><small class="dim">⌘⏎ new session</small>
      ${can(f, 'spawn') ? '<button class="primary" data-draft-act="send" title="start a new session on this prompt">Start session</button>' : ''}
      ${targets().length ? '<button data-draft-act="transfer" title="type this prompt into a running worker">Send to worker…</button>' : ''}
      <button class="danger" data-draft-act="delete">Delete</button>
      <button data-act="home" aria-label="back to the skyline" title="back to the skyline">✕</button></span>`
  $('draft-note').innerHTML = d.conflict !== undefined
    ? `<span>Someone else changed this draft while you were editing it.</span>
      <button data-draft-act="reload">Take theirs</button><button data-draft-act="keep">Keep mine</button>`
    : ''
}

/** A new draft, or an existing one once its text has arrived: the textarea stays read-only until then. */
async function openDraft(project, id) {
  leaveShelf()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  selected = undefined
  arriving = undefined
  const d = newDraft(project)
  draftOpen = d
  history.replaceState(null, '', draftHash({ project, id }))
  $('main').classList.remove('home')
  $('main').classList.add('drafting')
  $('draft-view').style.cssText = paint(project)
  $('draft-text').value = ''
  $('draft-text').readOnly = Boolean(id)
  render()
  if (id) {
    const item = draftItem(board.floors, project, id)
    const loaded = item && (await loadDraft(draftIo, project, item).catch((err) => (toast(err.message), null)))
    if (draftOpen !== d) return
    if (loaded === null) return goHome()
    if (!loaded) return (goHome(), toast('That draft is gone'))
    draftOpen = loaded
    $('draft-text').value = loaded.text
    $('draft-text').readOnly = false
    render()
  }
  $('draft-text').focus()
}

/** Leaving keeps what was typed: its save is queued like any other. */
function leaveDraft() {
  if (!draftOpen) return
  clearTimeout(saveTimer)
  if (keepsApart(draftOpen)) toast('Your edits were kept as a new draft')
  leave(draftIo, draftOpen)
  closeDraft()
}

function closeDraft() {
  clearTimeout(saveTimer)
  draftOpen = undefined
  $('main').classList.remove('drafting')
}

/** Resolves to whether the draft's text is on disk; a first save gives it an id, which the URL then names. */
function saveNow() {
  clearTimeout(saveTimer)
  const d = draftOpen
  return save(draftIo, d).then((ok) => (draftOpen === d && (history.replaceState(null, '', draftHash(d)), render()), ok))
}

$('draft-text').addEventListener('input', () => {
  edit(draftOpen, $('draft-text').value)
  clearTimeout(saveTimer)
  saveTimer = setTimeout(saveNow, AUTOSAVE_MS)
  draftHeadHtml()
})
$('draft-text').addEventListener('keydown', (e) => {
  if (!e.metaKey && !e.ctrlKey) return
  if (e.key === 's') (e.preventDefault(), saveNow())
  if (e.key === 'Enter') (e.preventDefault(), sendDraft())
})

/** The board shows the open draft as it is now: deleted elsewhere closes it, a change elsewhere replaces or conflicts. */
async function followDraft() {
  const d = draftOpen
  if (!d?.id) return
  const outcome = await follow(draftIo, d, draftItem(board.floors, d.project, d.id))
  if (draftOpen !== d) return
  if (outcome === 'gone') return (closeDraft(), goHome(), toast('The draft was deleted elsewhere'))
  if (outcome === 'replaced') $('draft-text').value = d.text
  draftHeadHtml()
}

function settleConflict(take) {
  const d = draftOpen
  settle(draftIo, d, take).then(() => draftOpen === d && render())
  if (take) $('draft-text').value = d.text
  draftHeadHtml()
}

/** Send and transfer save the draft first, then delete it once its words have reached a session. */
async function savedDraft() {
  const d = draftOpen
  if (!d.text.trim()) return toast('The draft is empty')
  clearTimeout(saveTimer)
  const text = await sendable(draftIo, d)
  if (text === undefined) return d.conflict !== undefined && toast('Settle the change made on disk first')
  return { d, text }
}

const deleteSent = (d) => {
  if (draftOpen === d) closeDraft()
  return discard(draftIo, d)
}

async function sendDraft() {
  const f = board.floors.find((f) => f.id === draftOpen.project)
  if (!can(f, 'spawn')) return
  const sent = await savedDraft()
  if (sent) openSpawn(f.id, sent)
}

/** This floor's workers first, then the rest top down. */
function openTransfer() {
  const project = draftOpen.project
  const order = floorsTopDown().map((f) => f.id)
  const rank = (c) => (c.project === project ? -1 : order.indexOf(c.project))
  $('transfer-targets').innerHTML = targets().sort((a, b) => rank(a) - rank(b) || byStart(a, b)).map((c) => `<button value="${c.id}" style="${paint(c.project)}">
      <span class="call">${callsign(c.id)}</span><span class="where">${esc(board.floors.find((f) => f.id === c.project).name)} · ${statusName(c)}</span>
      <span class="line">${lineOf(c)}</span></button>`).join('')
  $('transfer').returnValue = ''
  $('transfer').showModal()
}

$('transfer').addEventListener('close', async () => {
  const id = $('transfer').returnValue
  if (!id || !draftOpen) return
  const sent = await savedDraft()
  if (!sent) return
  const reply = await told(tower.run(findCard(id).calls.submit, { text: sent.text }))
  if (!reply) return
  await deleteSent(sent.d)
  select(id)
})

async function deleteDraft() {
  const d = draftOpen
  if (!confirm('Delete this draft?')) return
  closeDraft()
  goHome()
  discard(draftIo, d)
}

/**
 * A session the page started, to open once the board carries it: the host answers before the tower has read the
 * new log, and until then there is no card to draw and no screen to stream. Any other way the viewer goes cancels it.
 */
let arriving

function selectArriving(id) {
  if (findCard(id)) return select(id)
  goHome()
  arriving = id
}

/** The shell open in the dock: its id and stream, and its terminal once the snapshot has arrived. */
let shell
const SHELL_SCROLLBACK = 2000

const shellWhere = (sh) => {
  const f = board.floors.find((f) => f.id === sh.project)
  return `${f?.name ?? sh.project}${sh.cwd === f?.hub ? '' : '/' + base(sh.cwd)}`
}

function renderDock() {
  if (!board.termsUp) return ($('tabs').innerHTML = '<span>shells: the terms daemon is down · npm run terms</span>')
  if (!board.shells.length) return ($('tabs').innerHTML = "<span>no shells · start one from a project dir's shell button</span>")
  $('tabs').innerHTML = [...board.shells].sort(byStart).map((sh) =>
    `<button class="tab ${sh.id === shell?.id ? 'open' : ''}" style="${paint(sh.project)}" data-shell="${sh.id}" title="${esc(sh.cwd)}">
      <span class="where">${esc(shellWhere(sh))}</span><span class="what">${esc(sh.activity)}</span>
      <span class="x" data-kill-shell="${sh.id}" aria-hidden="true" title="kill this shell">×</span></button>`).join('')
}

function openShell(id) {
  closeShell()
  shell = { id }
  $('shell-pane').style.cssText = paint(board.shells.find((sh) => sh.id === id)?.project)
  $('main').classList.add('shell-open')
  shell.stop = tower.watch(`shell/${id}`, (msg) => {
    if (msg.t === 'snapshot') mountShell(msg)
    if (msg.t === 'o') shell.term.write(msg.data)
    if (msg.t === 'error') (toast(msg.message), closeShell())
    if (msg.t === 'x') closeShell()
  })
  renderDock()
}

/** The stream sends a snapshot again each time it reconnects, as after a tower restart: it replaces the terminal. */
function mountShell({ data, cols, rows }) {
  shell.term?.dispose()
  const id = shell.id
  const term = new Terminal({ cols, rows, fontSize: DRIVE_FONT, fontFamily: type.mono, cursorBlink: false, scrollback: SHELL_SCROLLBACK, theme: terminalTheme(scheme()) })
  const fit = new FitAddon.FitAddon()
  term.loadAddon(fit)
  term.open($('s-screen'))
  term.write(data)
  const typed = (d) => document.activeElement === term.textarea && sendShellKeys(id, d)
  term.attachCustomKeyEventHandler(terminalKeys(shortcut, typed))
  term.onData(typed)
  Object.assign(shell, { term, fit, size: { cols, rows } })
  fitShell()
  term.focus()
}

/** The open shell takes the size of its pane. */
function fitShell() {
  if (!shell?.term) return
  shell.fit.fit()
  const { cols, rows } = shell.term
  if (cols === shell.size.cols && rows === shell.size.rows) return
  shell.size = { cols, rows }
  told(tower.call('shell/resize', { id: shell.id, cols, rows }))
}

/** Closes the view only: the shell keeps running until it is killed. */
function closeShell() {
  shell?.stop()
  shell?.term?.dispose()
  shell = undefined
  $('s-screen').innerHTML = ''
  $('main').classList.remove('shell-open')
  renderDock()
}

async function spawnShell(project, cwd) {
  const reply = await told(tower.run(floorOf(project).calls.shell, { cwd }))
  if (reply) openShell(reply.id)
}

let shellRefitTimer
new ResizeObserver(() => {
  clearTimeout(shellRefitTimer)
  shellRefitTimer = setTimeout(fitShell, REFIT_DEBOUNCE_MS)
}).observe($('s-screen'))

$('grip').addEventListener('pointerdown', (e) => {
  $('grip').setPointerCapture(e.pointerId)
  const bottom = $('shell-pane').getBoundingClientRect().bottom
  const tabs = $('tabs').offsetHeight
  $('grip').onpointermove = (ev) => $('main').style.setProperty('--shell-h', `${Math.max(120, Math.min(innerHeight - 160, bottom - tabs - ev.clientY))}px`)
  $('grip').onpointerup = () => ($('grip').onpointermove = null)
})

/** The draft the spawn dialog was opened with, deleted once its session starts. */
let spawnDraft

function openSpawn(projectId, sent) {
  const f = board.floors.find((f) => f.id === projectId)
  const top = floorsTopDown()
  spawnDraft = sent?.d
  $('spawn').dataset.project = projectId
  $('spawn').innerHTML = spawnFormHtml(f, { sign: signHtml(top.length - top.indexOf(f), f.name), draft: sent && titleOf(sent.text) })
  $('spawn').querySelector('[name=prompt]').value = sent?.text ?? ''
  syncSpawn()
  $('spawn').returnValue = ''
  $('spawn').showModal()
  $('spawn').querySelector('[name=prompt]').focus()
}

/** The form's values as they stand, its branch placeholder and summary redrawn from them. */
function syncSpawn() {
  const f = floorOf($('spawn').dataset.project)
  const form = $('spawn').querySelector('form')
  const v = spawnForm(f, new FormData(form))
  form.querySelector('[name=branch]').placeholder = branchPlaceholder(f, v.name)
  form.querySelector('[data-summary]').innerHTML = spawnSummaryHtml(f, v)
  return v
}
$('spawn').addEventListener('input', syncSpawn)
$('spawn').addEventListener('click', (e) => {
  const close = e.target.closest('[data-close]')?.dataset.close
  if (close === 'start' && !$('spawn').querySelector('form').reportValidity()) return
  if (close) $('spawn').close(close)
})
$('spawn').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('spawn').querySelector('[data-close=start]').click()
})

$('spawn').addEventListener('close', async () => {
  if ($('spawn').returnValue !== 'start') return
  const f = floorOf($('spawn').dataset.project)
  const reply = await told(tower.run(...spawnCall(f, syncSpawn())))
  if (!reply) return
  if (reply.cut) toast(`worktree ${reply.cut.name} on ${reply.cut.branch}, from ${[...new Set(reply.cut.bases.map((b) => b.base))].join(', ')}`)
  if (spawnDraft) await deleteSent(spawnDraft)
  selectArriving(reply.id)
})

/** What is being asked, while it is in flight: a second press waits for the first's reply. */
const inFlight = new Set()
async function pressOnce(key, button, request) {
  if (inFlight.has(key)) return
  inFlight.add(key)
  button.disabled = true
  try {
    return await request()
  } finally {
    inFlight.delete(key)
    button.disabled = false
  }
}

async function resume(button, call) {
  const reply = await pressOnce(JSON.stringify(call), button, () => tower.run(call)).catch((err) => toast(err.message))
  if (reply?.t === 'spawned') selectArriving(reply.id)
}

/** A file's Finder and editor buttons, wherever they are drawn, before any other click handling sees the click. */
document.addEventListener(
  'click',
  (e) => {
    const file = fileCall(e.target)
    if (!file) return
    e.stopPropagation()
    told(tower.run(file))
  },
  true,
)

/** A link goes where its href says: a worker's `#<id>` reaches `route` as the hash changes. */
document.addEventListener('click', (e) => {
  if (e.target.closest('a[href]')) return
  const spawn = e.target.closest('[data-spawn]')
  if (spawn) return openSpawn(spawn.dataset.spawn)
  const newDraft = e.target.closest('[data-new-draft]')
  if (newDraft) return openDraft(newDraft.dataset.newDraft)
  const draft = e.target.closest('[data-draft]')
  if (draft) return openDraft(draft.dataset.draft, draft.dataset.item)
  const copy = e.target.closest('[data-copy]')?.dataset.copy
  if (copy) return navigator.clipboard.writeText(copy).then(() => toast(`Copied ${copy}`), (err) => toast(err.message))
  const draftAct = e.target.closest('[data-draft-act]')?.dataset.draftAct
  if (draftAct === 'send') return sendDraft()
  if (draftAct === 'transfer') return openTransfer()
  if (draftAct === 'delete') return deleteDraft()
  if (draftAct === 'reload' || draftAct === 'keep') return settleConflict(draftAct === 'reload')
  const wtCall = e.target.closest('[data-wt-call]')
  if (wtCall) {
    const { wtVerb: verb, wtName: name } = wtCall.dataset
    if (WORKTREE_ASK[verb] && !confirm(WORKTREE_ASK[verb](name))) return
    return told(tower.run(JSON.parse(wtCall.dataset.wtCall))).then((r) => r && toast(`${WORKTREE_DONE[verb]} ${name}`))
  }
  const tidyCall = e.target.closest('[data-tidy-call]')
  if (tidyCall) return confirm(tidyCall.dataset.tidyAsk) && told(tower.run(JSON.parse(tidyCall.dataset.tidyCall))).then((r) => r && toast(tidiedLine(r)))
  const tidy = e.target.closest('[data-tidy]')
  if (tidy) {
    const f = floorOf(tidy.dataset.tidy)
    const rows = tidyRows(f, Date.now()).map((r) => `${r.what}: ${r.does}`).join('\n')
    return confirm(`${tidyLine(f.tidy)}\n\n${rows}\n\nDo all of it?`) && told(tower.run(f.calls.tidy)).then((r) => r && toast(tidiedLine(r)))
  }
  const picked = e.target.closest('[data-pick]')?.dataset.pick
  if (picked) return pickLine(picked, e.shiftKey)
  if (e.target.closest('[data-pick-add]')) return addPicked()
  if (e.target.closest('[data-pick-cancel]')) return (dropPick(), drawChanges())
  if (e.target.closest('[data-note-add]')) return addWritten()
  const reply = e.target.closest('[data-reply]')?.dataset.reply
  if (reply) return replyTo(Number(reply))
  if (e.target.closest('[data-reply-clear]')) return ((noteRe = undefined), render())
  const toNote = e.target.closest('[data-to-note]')?.dataset.toNote
  if (toNote) return $('reviews').querySelector(`[data-note="${toNote}"]`)?.scrollIntoView({ block: 'center' })
  const anchored = e.target.closest('[data-anchor]')?.dataset.anchor
  if (anchored) return showAnchor(anchored)
  if (e.target.closest('[data-send]')) return sendNotes(findCard(selected))
  const thread = e.target.closest('[data-thread]')?.dataset.thread
  if (thread) return openThread(...thread.split('|'))
  const resumeButton = e.target.closest('[data-resume]')
  if (resumeButton) return resume(resumeButton, JSON.parse(resumeButton.dataset.resume))
  if (e.target.closest('[data-side]')) return toggleSide()
  const sideTo = e.target.closest('[data-side-view]')?.dataset.sideView
  if (sideTo) return showSideView(sideTo)
  const scope = e.target.closest('[data-stats-scope]')?.dataset.statsScope
  if (scope) return ((statsView.all = scope === STATS_ALL), drawSideView())
  const range = e.target.closest('[data-stats-range]')?.dataset.statsRange
  if (range) return (Object.assign(statsView, { range, stats: undefined }), tower.store.set('stats.range', range), drawSideView(), readStats())
  if (e.target.closest('[data-stats-read]')) return readStats()
  if (e.target.closest('[data-keys]')) return showKeys()
  const move = e.target.closest('[data-move]')?.dataset.move
  if (move) return go(move)
  const dismissed = e.target.closest('[data-dismiss]')?.dataset.dismiss
  if (dismissed) return dismissWait(dismissed)
  const unshowKey = e.target.closest('[data-unshow]')?.dataset.unshow
  if (unshowKey) return unshow(unshowKey)
  const out = e.target.closest('[data-out]')?.dataset.out
  if (out) return window.open(out, '_blank', 'noreferrer')
  const pane = e.target.closest('[data-pane]')?.dataset.pane
  if (pane) return showPane(pane)
  const viewed = e.target.closest('[data-viewed]')?.dataset.viewed
  if (viewed) return toggleViewed(viewed)
  const fold = e.target.closest('[data-fold]')?.dataset.fold
  if (fold) return toggleFold(fold)
  if (e.target.closest('[data-changes-read]')) return readChanges(selected)
  const open = e.target.closest('[data-open]')
  if (open) return told(tower.run(floorOf(open.dataset.openProject).calls.editor, { dir: open.dataset.open }))
  const shelved = e.target.closest('[data-shelf]')
  if (shelved) return openShelf(shelved.dataset.shelf, Number(shelved.dataset.n))
  const doc = e.target.closest('[data-doc]')
  if (doc) return showDoc(doc.dataset.doc)
  if (e.target.closest('[data-shelf-retry]')) return openShelf(shelfOpen.project, shelfOpen.n)
  const newShell = e.target.closest('[data-shell-dir]')
  if (newShell) return spawnShell(newShell.dataset.shellProject, newShell.dataset.shellDir)
  const killShell = e.target.closest('[data-kill-shell]')?.dataset.killShell
  if (killShell) {
    const sh = board.shells.find((sh) => sh.id === killShell)
    return confirm(`Kill the shell in ${shellWhere(sh)} (${sh.activity})?`) && told(tower.call('shell/kill', { id: killShell }))
  }
  const tab = e.target.closest('[data-shell]')?.dataset.shell
  if (tab) return tab === shell?.id ? closeShell() : openShell(tab)
  const archive = e.target.closest('[data-archive]')?.dataset.archive
  if (archive) return archiveOpen?.project === archive ? goHome() : openArchive(archive)
  const section = e.target.closest('[data-section]')?.dataset.section
  if (section) return toggleSection(section)
  const reapOne = e.target.closest('[data-reap-process]')?.dataset.reapProcess
  if (reapOne) return tower.run(JSON.parse(reapOne)).catch((err) => toast(err.message))
  const reapable = e.target.closest('[data-reap]')
  if (reapable) {
    const c = findCard(reapable.dataset.reap)
    const list = c.resources.map((r) => `${r.pid}  ${r.command}`).join('\n')
    if (confirm(`End what ${callsign(c.id)} left running?\n\n${list}`)) tower.run(c.calls.reap).catch((err) => toast(err.message))
    return
  }
  const act = e.target.closest('[data-act]')?.dataset.act
  if (act === 'send-home') return sendHome(findCard(selected))
  if (act === 'kill') return confirm(`Kill ${callsign(selected)}?\n\nIt stays ${KILL_COST}.`) && tower.run(findCard(selected).calls.kill).catch((err) => toast(err.message))
  if (act === 'review') {
    const author = findCard(selected)
    return pressOnce(`review ${author.id}`, e.target.closest('[data-act]'), () => tower.run(author.calls.review)).then((r) => r && toast(`A reviewer of ${callsign(author.id)} starts in ${r.cut.name}, a fork of ${author.checkout}`)).catch((err) => toast(err.message))
  }
  if (act === 'home') return goHome()
  if (act === 'drive') {
    showPane('screen')
    return term?.focus()
  }
  const crewFolded = e.target.closest('[data-crew-fold]')?.dataset.crewFold
  if (crewFolded) return toggleCrewFold(crewFolded)
  const card = e.target.closest('[data-id]')
  if (card) select(card.dataset.id)
})
$('home').onclick = goHome

document.addEventListener('change', (e) => {
  const picker = e.target.closest('[data-send-pick]')
  if (!picker) return
  const c = findCard(selected)
  sendPicks.set(`${c.project}/${threadCheckoutOf(c)}`, picker.value)
  render()
})

$('screen').addEventListener('input', (e) => {
  if (e.target.matches('[data-note-text]')) noteDrafts.set(draftKey(findCard(selected)), e.target.value)
  if (e.target.matches('[data-pick-text]')) pickText = e.target.value
})

/** The pane tabs move as the ARIA tabs pattern has it: ← → Home End go along the row and show the pane they reach. */
$('bar-line').addEventListener('keydown', (e) => {
  const tab = e.target.closest('[role=tab]')
  if (!tab || e.altKey || e.metaKey || e.ctrlKey || e.shiftKey) return
  const tabs = [...tab.closest('[role=tablist]').querySelectorAll('[role=tab]')]
  const at = tabs.indexOf(tab)
  const to = tabs[{ ArrowLeft: (at - 1 + tabs.length) % tabs.length, ArrowRight: (at + 1) % tabs.length, Home: 0, End: tabs.length - 1 }[e.key]]
  if (!to) return
  e.preventDefault()
  to.focus()
  showPane(to.dataset.pane)
})

$('screen').addEventListener('keydown', (e) => {
  const submit = (e.metaKey || e.ctrlKey) && e.key === 'Enter'
  if (e.target.matches('[data-note-text]') && submit) return (e.preventDefault(), addWritten())
  if (e.target.matches('[data-pick-text]') && submit) return (e.preventDefault(), addPicked())
  if (e.target.matches('[data-pick-text]') && e.key === 'Escape') return (e.preventDefault(), dropPick(), drawChanges())
})

/**
 * The viewer's scheme, kept by tower.js in this browser for every page of theirs, on the root's `data-scheme` that the
 * stylesheet reads; terminals, the framed documents and the open shelf page are told again whenever it changes.
 */
const scheme = tower.scheme

function applyScheme() {
  for (const t of [term, shell?.term]) if (t) t.options.theme = terminalTheme(scheme())
  briefKey = undefined
  shownDrawn = undefined
  if (shelfOpen?.file) showDoc(shelfOpen.file)
  sendScheme()
  render()
}

tower.onScheme(applyScheme)

const isTyping = () => ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName) || $('spawn').open || $('transfer').open || $('keys').open

/** Every shortcut of this page in one place, the move keys as the header names them. */
const KEYS = [
  [`<kbd>${MOVE_KEYS.prev.label}</kbd> <kbd>${MOVE_KEYS.next.label}</kbd>`, "previous or next worker on duty, in the sidebar's order: the top floor first, each floor's crews in order. Works in a terminal too"],
  [`<kbd>${MOVE_KEYS.waiting.label}</kbd> · <kbd>N</kbd>`, 'next worker waiting on you: a question first, then whoever has waited longest. N outside a terminal or a field'],
  ['<kbd>⌘B</kbd>', 'hide or show the sidebar'],
  ['<kbd>Esc</kbd>', 'back to the skyline, outside a terminal or a field'],
  ['<kbd>?</kbd>', 'this sheet, outside a terminal or a field'],
  ...NATURAL_KEYS.map((k) => [`<kbd>${k.label}</kbd>`, k.does]),
  ['<kbd>⌘S</kbd>', 'save the open draft'],
  ['<kbd>⌘⏎</kbd>', 'start a session: from the open draft, or in the new session dialog'],
]

function showKeys() {
  $('keys-list').innerHTML = KEYS.map(([keys, what]) => `<span>${keys}</span><span>${what}</span>`).join('')
  $('keys-legend').innerHTML = statusLegendHtml()
  $('keys').showModal()
  $('keys').scrollTop = 0
}

/** Keys that work everywhere, the terminal included. Returns whether `e` was one. */
function shortcut(e) {
  if (e.type !== 'keydown') return false
  const plain = !e.metaKey && !e.ctrlKey && !e.altKey
  const move = moveOfKey(e)
  if (move) e.repeat || go(move)
  else if (e.metaKey && e.key === 'b') toggleSide()
  else if (plain && e.key === 'n' && !isTyping()) go('waiting')
  else if (plain && e.key === '?' && !isTyping()) showKeys()
  else if (plain && e.key === 'Escape' && (selected || shelfOpen || draftOpen || archiveOpen) && !isTyping()) goHome()
  else return false
  e.preventDefault()
  return true
}

/** The terminal's own key handler already ran `shortcut` on keys typed into it. */
document.addEventListener('keydown', (e) => {
  if (!e.defaultPrevented) shortcut(e)
})

/** xterm measures its cells when it opens: the terminal face must be loaded by then. */
await Promise.all([`${DRIVE_FONT}px ${type.mono}`, `700 ${DRIVE_FONT}px ${type.mono}`].map((font) => document.fonts.load(font)))

told(tower.get('origins')).then((o) => o && ((origins = o), render()))

/** Every renderer of the same system: this one, the others to open, and those not built yet. */
told(tower.get('renderers')).then((r) => r && ($('renderers').innerHTML = renderersHtml(r.renderers, location.pathname.split('/')[2], tower.framed)))

let opened = false
/** The board's failure stays on screen over the last board drawn, until the tower sends a board again. */
const showBoardError = () =>
  ($('board-error').innerHTML = boardError ? `<b>The tower can't build the board</b>${esc(boardError.message)}` : '')

tower.onBoardError((err) => {
  boardError = err
  showBoardError()
  sendBoard()
})

tower.subscribe(async (next) => {
  await Promise.all([readHeed(), readCrewFolds()])
  board = next
  boardError = undefined
  showBoardError()
  attend(next)
  noticeShown(cards())
  freshArchives()
  pruneDraftTitles(board.floors)
  sendBoard()
  void followDraft()
  if (arriving && findCard(arriving)) return select(arriving)
  const wanted = !opened && location.hash.slice(1)
  opened = true
  if (!wanted || !(await route(wanted))) render()
})

/** Opens what a hash names: a shelf entry, a draft, a floor's archive or a worker. Resolves to whether it named one. */
async function route(wanted) {
  if (wanted.startsWith('shelf/')) {
    const [, project, n, file] = wanted.split('/')
    return (openShelf(project, Number(n), file && decodeURIComponent(file)), true)
  }
  if (wanted.startsWith('draft/')) {
    const [, project, id] = wanted.split('/')
    const drafts = board.floors.find((f) => f.id === project)?.collections.find((c) => c.id === DRAFTS)
    if (drafts && (!id || drafts.items.some((i) => i.id === decodeURIComponent(id)))) return (openDraft(project, id && decodeURIComponent(id)), true)
  }
  if (wanted.startsWith('archive/')) return (openArchive(wanted.slice('archive/'.length)), true)
  if (await lookUp(wanted)) return (select(wanted), true)
  return false
}

/** Every view writes its own hash in place, so the hash changes only by a link, the history or the address bar. */
addEventListener('hashchange', async () => {
  const wanted = location.hash.slice(1)
  if (!opened || wanted === selected) return
  if (!wanted || !(await route(wanted))) goHome()
})
setInterval(tick, 1000)
showSideView(sideView)
</script>
