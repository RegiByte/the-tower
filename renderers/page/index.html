<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/design.css">
<script>
try { document.documentElement.dataset.scheme = localStorage.getItem('tower.scheme') ?? '' } catch {}
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body { display: grid; grid-template-columns: 320px 1fr; background: var(--wall); color: var(--ink); font: 14px/1.45 var(--ui);
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; font-weight: 700; font-size: 13px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 4px 11px; cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; }
button:hover { border-color: var(--deco); }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.danger:hover { border-color: var(--broken); color: var(--broken-text); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); }
.display { font-family: var(--display); font-weight: 800; }
@keyframes beacon { 0%, 60%, 100% { opacity: .2; } 70%, 85% { opacity: 1; } }
kbd { font: 700 10px/1 var(--mono); padding: 2px 4px; border-radius: 3px; background: var(--ink); color: var(--panel); }

.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 4px; padding: 16px 12px 10px 16px; white-space: nowrap; }
.brand h1 { margin: 0; font: 900 19px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.brand .host { margin: 0 2px 0 auto; display: flex; }
.host-state { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--c); }
.host-state.quiet { padding: 1px 2px; font-weight: 400; color: var(--faint); }
.host-state.working, .host-state.broken { background: var(--c); color: var(--on); }
.host-state.working .lamp, .host-state.broken .lamp { background: var(--on); }
.head-btn { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; background: none; border: none; color: var(--faint); }
.head-btn svg { width: 15px; height: 15px; }
.head-btn:hover, .head-btn:has(+ :popover-open) { color: var(--ink); }
.side-notes { margin-top: -4px; padding: 0 16px 10px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.side-notes:empty { display: none; }
.side-notes .untested { white-space: normal; }
.tally { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.limits { display: grid; gap: 8px; padding: 2px 16px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.limits .row { display: flex; gap: 6px; align-items: baseline; margin-bottom: 4px; }
.limits .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.limits .row small { margin-left: auto; color: var(--faint); font-size: 12px; }
.limits .asof { color: var(--faint); }
.limits:has(.asof.stale) > div { opacity: .5; }
.limits .asof.stale { color: var(--ink); }
.side-views { display: flex; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
.side-views button { padding: 4px 10px 6px; border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); font: 800 11px/1 var(--display);
  letter-spacing: .06em; text-transform: uppercase; }
.side-views button.on { color: var(--ink); border-bottom-color: var(--ink); }
.stats-side { display: none; flex: 1; overflow-y: auto; padding: 0 12px 16px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.side.on-stats .stats-side { display: block; } .side.on-stats .floors { display: none; }
.floors { flex: 1; overflow-y: auto; padding: 10px 10px 16px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 14px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.floor { --pt: color-mix(in oklab, var(--p, var(--ink)) var(--p-text-mix), var(--ink)); --pw: color-mix(in oklab, var(--p, var(--deco)) var(--p-wash-mix), var(--panel)); }
.sign button { margin-left: auto; width: 26px; height: 24px; padding: 0; display: grid; place-items: center; font-size: 15px; }
.dirs { padding: 6px 2px 0; }
.dir { display: flex; align-items: center; gap: 4px; padding: 1px 6px; font-size: 12px; color: var(--muted); border-radius: var(--radius); }
.dir:hover { background: var(--panel-2); }
.dir .dname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir a, .dir button { display: grid; place-items: center; width: 24px; height: 22px; padding: 0; background: none; border: 1px solid transparent; color: var(--faint); }
.dir svg { width: 13px; height: 13px; }
.dir:hover a, .dir:hover button { color: var(--muted); }
.dir a:hover, .dir button:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
.shelf { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 6px 0; }
.shelf button, .shelf a { padding: 2px 9px; font-size: 11px; font-weight: 700; border-radius: 999px; background: var(--pw); color: var(--pt); border: 1px solid transparent;
  text-decoration: none; line-height: 1.45; }
.shelf button:hover, .shelf a:hover { border-color: color-mix(in oklab, var(--pt) 40%, transparent); }
.shelf button.sel { background: var(--pt); color: var(--panel); }
.drafts { padding: 8px 2px 0; }
.drafts-head { display: flex; align-items: center; padding: 0 2px 0 8px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.drafts-head button { margin-left: auto; background: none; border: none; padding: 0 6px; color: var(--faint); font-size: 15px; font-weight: 400; }
.drafts-head button:hover { color: var(--ink); }
.drafts-head button.tidy-all { height: 20px; padding: 0 7px; font-size: 11px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); }
.drafts-head button.tidy-all:hover { border-color: var(--faint); }
.drafts-about { padding: 2px 8px 4px; color: var(--faint); font-size: 11px; line-height: 1.35; }
.draft { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; padding: 3px 8px; border-radius: var(--radius); font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.draft::before { content: "✎"; color: var(--faint); }
.draft .t { overflow: hidden; text-overflow: ellipsis; }
.draft .meta { grid-column: 2; overflow: hidden; text-overflow: ellipsis; color: var(--faint); font: 10px/1.4 var(--mono); letter-spacing: .02em; }
.draft:hover, .draft.sel { background: var(--panel-2); color: var(--ink); }
.draft.sel { box-shadow: inset 3px 0 0 var(--p, var(--ink)); }
.draft.thread::before { content: "◇"; }
.worktrees { padding: 8px 2px 0; }
.wt { display: flex; align-items: center; gap: 6px; padding: 2px 4px 2px 8px; border-radius: var(--radius); font-size: 12px; color: var(--muted); }
.wt:hover { background: var(--panel-2); }
.wt .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt .n b { color: var(--ink); font-weight: 700; }
.wt .st { flex: none; font-size: 10px; letter-spacing: .04em; color: var(--faint); }
.wt.at-risk .st, .wt.lost .st { color: var(--needs-text); }
.wt button { flex: none; padding: 0 7px; height: 20px; font-size: 11px; }
.wt .ic { width: 22px; display: grid; place-items: center; padding: 0; background: none; border-color: transparent; color: var(--faint); }
.wt .ic svg { width: 12px; height: 12px; }
.wt .ic:hover { color: var(--ink); border-color: var(--line); background: var(--panel); }
.sess .branch { color: var(--faint); font: 11px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sessions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 8px 2px 0; }
.sess { position: relative; padding: 7px 10px 8px 10px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--c); cursor: pointer; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.sess:hover { box-shadow: var(--shadow); }
.sess.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.sess.waits { border-color: var(--c); background: color-mix(in oklab, var(--c) 8%, var(--panel)); }
.sess .top { display: flex; align-items: center; gap: 8px; }
.sess .call, .past .call { color: inherit; text-decoration: none; }
.sess .call { font: 800 13px/1 var(--display); letter-spacing: .04em; padding-top: 2px; white-space: nowrap; }
.sess .st { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sess:is(.needs, .broken, .working, .ready) .st { color: var(--c-text); }
.sess .st.stuck, .pill.stuck { color: var(--needs-text); }
.sess .line { margin-top: 4px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.tool { color: var(--ink); } .tool b { font-weight: 700; }
.sess .act { margin-top: 6px; }
.crew { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-left: 10px; padding-left: 8px; border-left: 2px solid var(--line); }
.sess.gone { opacity: .55; }
.gone-home { justify-self: start; padding: 1px 8px; font-size: 11px; font-weight: 400; color: var(--muted); background: none; border-color: transparent; }
.gone-home:hover { color: var(--ink); }
.sess.gone:hover, .sess.gone.sel { opacity: 1; }
.sess .act button { padding: 1px 9px; font-size: 12px; }
.unresumable { color: var(--faint); font-size: 12px; white-space: nowrap; }
.empty { color: var(--faint); font-style: italic; font-size: 12px; padding: 2px 8px; }
.trays { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 2px 0; }
.tray { padding: 1px 8px; font-size: 11px; font-weight: 400; color: var(--muted); background: none; border-color: transparent; white-space: nowrap; }
.tray b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tray i { font-style: normal; font-weight: 700; color: var(--needs-text); }
.tray:hover { border-color: var(--line); color: var(--ink); }
.tray.on { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
.archive { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; gap: 2px; }
.archive-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.main:not(.archived) .archive-view, .main.archived .bar, .main.archived .screen { display: none; }
.archive-view .archive { flex: 1; min-height: 0; overflow-y: auto; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.archive-view .past { padding: 6px 10px; font-size: 13px; }
.archive-view .past .call { font-size: 13px; }
#archive-filter { flex: 1; min-width: 120px; max-width: 420px; padding: 4px 10px; font: 13px var(--ui); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: var(--radius); }
#archive-filter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.past { overflow: hidden; padding: 4px 8px; border-radius: var(--radius); font-size: 12px; color: var(--muted); cursor: pointer; }
.past:hover, .past.sel { background: var(--panel-2); color: var(--ink); }
.past .head { display: flex; align-items: center; gap: 7px; }
.past .call { font: 800 12px/1 var(--display); letter-spacing: .04em; padding-top: 2px; color: var(--ink); }
.past .when { color: var(--faint); white-space: nowrap; }
.past .head .when { margin-left: auto; }
.past .conv { display: flex; align-items: center; gap: 6px; padding-left: 16px; }
.past .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.past button { padding: 0 7px; font-size: 12px; }
.said { color: var(--faint); }
.side-toggle, .help { background: none; border: none; padding: 0 4px; color: var(--faint); font-size: 15px; font-weight: 400; white-space: nowrap; }
.side-toggle small { font: 10px var(--mono); }
.side-toggle:hover, .help:hover { color: var(--ink); }
.help { font-weight: 700; }
.rail { display: none; }
.side-foot { display: flex; align-items: center; gap: 6px; margin-top: auto; padding: 6px 10px 6px 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; }
.side-renderers { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 0 10px 8px 16px; color: var(--faint); font-size: 11px; }
.side-renderers b { color: var(--ink); }
.side-renderers a { color: var(--muted); text-decoration: none; }
.side-renderers a:hover { color: var(--ink); }
.side-foot code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11px var(--mono); direction: rtl; text-align: left; }
body.collapsed { grid-template-columns: 44px 1fr; }
body.collapsed .side > :not(.rail) { display: none; }
body.collapsed .rail { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px 0; overflow-y: auto; scrollbar-width: none; }
.rail .count { display: grid; place-items: center; min-width: 20px; height: 20px; border-radius: 999px; background: var(--c); color: var(--on); font-weight: 700; font-size: 11px; }
.rail .lamp { width: 11px; height: 11px; cursor: pointer; }
.rail .lamp.sel { outline: 2px solid var(--ink); outline-offset: 3px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: baseline; color: var(--muted); font-size: 13px; }
.keys > span:nth-child(odd) { white-space: nowrap; color: var(--faint); font-size: 12px; }
dialog h2.legend-head { margin-top: 20px; }
.keys.legend > .chip { justify-self: start; color: var(--ink); }
dialog#keys { width: min(620px, 92vw); }

.main { position: relative; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 10px 10px 0; }
.bar { flex: none; padding: 9px 14px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.bar-top { display: flex; align-items: center; gap: 12px; }
#bar-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; color: var(--muted); font-size: 12px; }
#bar-info .call { flex: none; font: 800 18px/1 var(--display); letter-spacing: .04em; color: var(--ink); padding-top: 3px; }
#bar-info .pill { flex: none; }
#bar-info .where { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#bar-info .stats { flex: none; margin-left: auto; display: flex; align-items: center; gap: 10px; }
.untested { color: var(--muted); font-size: 12px; text-decoration: underline dotted; cursor: help; white-space: nowrap; }
#bar-info b { color: var(--ink); font-variant-numeric: tabular-nums; }
#bar-info .meter { width: 56px; --fill: var(--working); }
#bar-info .ports { color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 0; border-radius: var(--radius); background: var(--panel-2); }
#bar-info .ports.orphan { color: var(--on-broken); background: var(--broken); }
#bar-actions { flex: none; display: flex; gap: 6px; }
#bar-actions .info { padding: 4px 9px; color: var(--muted); font-weight: 400; }
#c-mode { position: absolute; top: 8px; right: 12px; z-index: 1; padding: 2px 9px; border-radius: 999px; background: var(--panel); color: var(--muted); font-size: 12px;
  box-shadow: var(--shadow); pointer-events: none; }
#c-mode:empty, #c-mode.owner, .main.on-brief #c-mode, .main.on-shown #c-mode, .main.on-changes #c-mode, .main.on-reviews #c-mode { display: none; }
#bar-line { gap: 6px; margin-top: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.move.dismiss { color: var(--needs-text); border-color: var(--needs); }
#bar-line .moves { gap: 6px; }
#bar-line .activity { overflow: hidden; text-overflow: ellipsis; text-align: left; padding: 1px 8px; margin-left: 6px; background: none; border-color: transparent;
  color: var(--muted); font: 12px/1.6 var(--mono); }
#bar-line .activity:hover { border-color: var(--line); }
#bar-line .activity .tool b { font-family: var(--ui); }
.move { flex: none; display: flex; align-items: center; gap: 6px; padding: 1px 8px; font-size: 11px; font-weight: 400; color: var(--muted); background: none; }
.move .call { font: 800 11px/1 var(--display); letter-spacing: .04em; color: var(--ink); padding-top: 1px; }
.move small { font: 10px var(--mono); color: var(--faint); }
.move.waiting { border-color: var(--c); }
#bar-details, #bar-left { margin: 0; inset: 100px 20px auto auto; width: min(620px, 90vw); max-height: 70vh; overflow: auto; padding: 12px 16px 14px; background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-pop); }
#bar-details h3, #bar-left h3 { margin: 0 0 10px; font: 800 14px/1 var(--display); letter-spacing: .04em; }
#bar-left .proc { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 12px; }
#bar-left .proc code { font-family: var(--mono); }
#bar-left .proc .on { color: var(--muted); font-family: var(--mono); }
#bar-left .proc .on.orphan { color: var(--broken-text); }
#bar-left .proc .cmd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
#bar-left .all { display: flex; justify-content: flex-end; padding-top: 10px; border-top: 1px solid var(--line); }
#bar-details dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; font-size: 12px; }
#bar-details dt { color: var(--faint); }
#bar-details dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); }
.pane-tab { padding: 0 8px; font-size: 12px; color: var(--muted); background: none; }
.pane-tab.on { color: var(--ink); border-color: var(--ink); }
.ask { display: none; align-items: center; gap: 10px; flex: none; padding: 8px 10px 8px 14px; border-radius: var(--radius); font-size: 14px;
  background: color-mix(in oklab, var(--needs) 11%, var(--panel)); border: 1px solid var(--needs); }
.main.asking:not(.home):not(.shelf):not(.drafting):not(.archived) .ask { display: flex; }
.ask .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask .what b { color: var(--needs-text); }
.ask .call { font: 800 14px/1 var(--display); letter-spacing: .04em; }
.ask button { margin-left: auto; flex: none; }
.brief { display: none; position: absolute; inset: 0; z-index: 1; }
.main.on-brief .brief { display: flex; }
.brief iframe { flex: 1; min-width: 0; border: 0; background: var(--panel); }
.shown { display: none; position: absolute; inset: 0; z-index: 1; }
.main.on-shown .shown { display: flex; }
.shown iframe { flex: 1; min-width: 0; border: 0; background: #fff; }
.shown iframe.doc { background: var(--panel); }
.shown img, .shown video { flex: 1; min-width: 0; min-height: 0; width: 100%; height: 100%; object-fit: contain; background: var(--enamel); }
.pane-tab .unshow, .pane-tab .out { margin-left: 6px; color: var(--faint); text-decoration: none; }
.pane-tab .unshow:hover, .pane-tab .out:hover { color: var(--ink); }
.pane-tab small { margin-left: 4px; color: var(--faint); font-variant-numeric: tabular-nums; }
.pane-tab small.unseen { color: var(--needs-text); font-weight: 700; }
.changes { display: none; position: absolute; inset: 0; z-index: 1; overflow: auto; padding: 0 16px 48px; background: var(--panel); color: var(--ink); }
.main.on-changes .changes { display: block; }
.reviews { display: none; position: absolute; inset: 0; z-index: 1; overflow: auto; padding: 0 16px 48px; background: var(--panel); color: var(--ink); }
.main.on-reviews .reviews { display: block; }
.screen { position: relative; flex: 1; min-height: 0; overflow: hidden; padding: 10px 12px; background: var(--enamel); border-radius: var(--radius); }
.screen .term { width: 100%; height: 100%; }
.screen .xterm-viewport { overflow-y: hidden !important; }
.screen .xterm-scrollable-element > .scrollbar { display: none; }
.main.home .bar, .main.home .screen { display: none; }
.main:not(.home) .sky { display: none; }

.shelf-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.main:not(.shelf) .shelf-view, .main.shelf .bar, .main.shelf .screen { display: none; }
.shelf-head { display: flex; align-items: center; gap: 12px; padding: 9px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); white-space: nowrap; }
.shelf-head .label { font: 800 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; padding-top: 3px;
  color: color-mix(in oklab, var(--p, var(--ink)) var(--p-text-mix), var(--ink)); }
.shelf-head .dim { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
.shelf-head .tag { flex: none; padding: 2px 7px; border: none; border-radius: var(--radius); background: var(--panel-2); color: var(--ink); font: 12px/1.3 var(--mono); cursor: copy; }
.shelf-head .actions { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.shelf-body { flex: 1; min-height: 0; display: flex; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
.shelf-body iframe { flex: 1; min-width: 0; border: 0; }
.shelf-body iframe.page { background: #fff; }
.shelf-files { flex: none; width: 260px; overflow-y: auto; padding: 8px 0; border-right: 1px solid var(--line); background: var(--panel-2); font-size: 13px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.shelf-files div { padding: 4px 14px; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-files div:hover { color: var(--ink); }
.shelf-files div.sel { color: var(--ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--p, var(--ink)); background: var(--panel); }
.draft-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.main:not(.drafting) .draft-view, .main.drafting .bar, .main.drafting .screen { display: none; }
.draft-note { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-radius: var(--radius); background: color-mix(in oklab, var(--needs) 11%, var(--panel));
  border: 1px solid var(--needs); }
.draft-note:empty { display: none; }
#draft-head a { color: inherit; }
.draft-note span { margin-right: auto; }
.draft-view textarea { flex: 1; min-height: 0; resize: none; padding: 14px 18px; font: 14px/1.55 var(--mono); font-variant-ligatures: none; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line-strong); border-radius: var(--radius); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.draft-view textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.targets { display: grid; gap: 6px; max-height: 60vh; overflow-y: auto; }
.targets button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; text-align: left; font-weight: 400; border-left: 4px solid var(--p, var(--deco)); }
.targets .call { font: 800 13px/1 var(--display); letter-spacing: .04em; padding-top: 2px; }
.targets .where { color: var(--muted); font-size: 12px; white-space: nowrap; }
.targets .line { flex: 1; min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shelf-empty { margin: auto; text-align: center; color: var(--muted); }

.dock { position: relative; flex: none; margin: 0 -10px; background: var(--panel); border-top: 1px solid var(--line); }
.shell-pane { display: none; height: var(--shell-h, 38vh); padding: 8px 12px; margin: 0 10px 10px; background: var(--enamel); border-radius: var(--radius);
  box-shadow: inset 0 3px 0 var(--p, var(--deco)); }
.main.shell-open .shell-pane { display: block; }
.shell-pane .term { width: 100%; height: 100%; }
.grip { display: none; position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: row-resize; z-index: 2; }
.main.shell-open .grip { display: block; }
.tabs { display: flex; align-items: center; gap: 6px; padding: 6px 10px; overflow-x: auto; scrollbar-width: none; font-size: 12px; color: var(--faint); }
.tab { display: flex; align-items: center; gap: 7px; flex: none; padding: 3px 4px 3px 10px; font-weight: 400; font-size: 12px; background: var(--panel); color: var(--muted); }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--p, var(--deco)); }
.tab.open { border-color: var(--ink); color: var(--ink); }
.tab .what { color: var(--ink); font-weight: 700; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab .x { padding: 0 5px; border-radius: 3px; color: var(--faint); }
.tab .x:hover { color: var(--on-broken); background: var(--broken); }

.sky { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: var(--radius);
  background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 60%, var(--sky-horizon)); }
.stars { position: absolute; inset: 0; pointer-events: none; opacity: var(--stars);
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 72% 9%, #fffc, transparent),
    radial-gradient(1px 1px at 38% 32%, #fffa, transparent), radial-gradient(1.5px 1.5px at 88% 26%, #fff, transparent),
    radial-gradient(1px 1px at 55% 14%, #fff9, transparent), radial-gradient(1px 1px at 23% 41%, #fff8, transparent),
    radial-gradient(1px 1px at 64% 37%, #fff9, transparent), radial-gradient(1px 1px at 6% 52%, #fff8, transparent); }
.orb { position: absolute; width: 54px; height: 54px; border-radius: 50%; left: var(--orb-x); top: var(--orb-y); transform: translate(-50%, -50%); }
.orb.moon { background: #eef0f6; box-shadow: 0 0 40px 6px #e9eefb33, inset -12px -6px 0 #cfd5e3; }
.orb.sun { background: #fff6dc; box-shadow: 0 0 60px 18px #ffe9a866; }
.hello { position: relative; align-self: flex-start; margin: 28px 0 0 28px; padding: 16px 26px 14px; background: var(--panel); border-radius: var(--radius);
  box-shadow: var(--shadow); }
.hello .big { font: 900 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; }
.hello .big b { color: var(--c-text); }
.hello .sub { color: var(--muted); margin-top: 6px; }
.hello .clock { color: var(--faint); font-size: 12px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.city { position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: center; gap: 34px; padding: 0 24px; flex-wrap: wrap; }
.building { display: flex; flex-direction: column; align-items: center; }
.building .sign { margin-bottom: 8px; padding: 5px 10px 5px 12px; gap: 7px; background: var(--enamel); border-color: var(--enamel); color: #fff;
  box-shadow: inset 5px 0 0 var(--pp), var(--shadow); }
.building .sign .num { min-width: 22px; height: 19px; font-size: 12px; }
.building .sign .name { font-size: 12px; }
.building .mast { width: 2px; height: 22px; background: var(--ink); position: relative; }
.building .mast.alarm::after { content: ""; position: absolute; left: -4px; top: -8px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 14px var(--c); animation: beacon 1.6s infinite; }
.building .body { display: flex; flex-wrap: wrap-reverse; gap: 8px; width: 196px; padding: 14px 13px; background: var(--enamel);
  border-top: 6px solid var(--p, var(--deco)); border-radius: 3px 3px 0 0; }
.w { width: 36px; height: 24px; border-radius: 2px; background: var(--enamel-2); }
.w.lit { background: var(--c); cursor: pointer; }
.w.lit.needs { animation: blink 1.1s steps(2, jump-none) infinite; }
.w.past { background: color-mix(in oklab, var(--c) 30%, var(--enamel-2)); cursor: pointer; }
.w.past:hover, .w.lit:hover { outline: 2px solid var(--panel); }
.street { height: 26px; background: var(--enamel); border-top: 3px solid var(--enamel-2); }

dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; width: min(760px, 92vw);
  box-shadow: var(--shadow-pop); }
dialog::backdrop { background: var(--backdrop); }
dialog.spawn { padding: 0; width: fit-content; max-width: none; max-height: none; }
dialog h2 { margin: 0 0 12px; font: 800 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; }
dialog .actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 16px; color: var(--faint); font-size: 12px; }
dialog .actions small { margin-right: auto; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--ink);
  color: var(--ink); box-shadow: var(--shadow); padding: 9px 14px; border-radius: var(--radius); z-index: 20; display: none; max-width: 90vw; }
.board-error { position: fixed; left: 50%; top: 20px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--broken);
  color: var(--ink); box-shadow: var(--shadow); padding: 9px 14px; border-radius: var(--radius); z-index: 20; max-width: min(720px, 90vw); }
.board-error b { display: block; margin-bottom: 2px; }
.board-error:empty { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<aside class="side" aria-label="sidebar">
  <div class="brand"><h1 id="home" data-tip="back to the skyline">The Tower</h1><span class="host" id="host"></span>
    <button class="head-btn" id="settings-open" popovertarget="settings" aria-label="settings" data-tip="settings: alerts, sound and theme"></button><div id="settings" class="settings-pop" popover></div>
    <button class="help" data-keys aria-label="shortcuts" data-tip="shortcuts and what the statuses mean (?)">?</button><button class="side-toggle" data-side aria-label="hide the sidebar" data-tip="hide the sidebar (⌘B)">« <small>⌘B</small></button></div>
  <div class="side-notes" id="notes"></div>
  <div class="tally" id="tally"></div>
  <div class="limits" id="limits"></div>
  <div class="side-views"><button data-side-view="floors">Floors</button><button data-side-view="stats" title="spend, work and waits, from the logs">Stats</button></div>
  <nav class="floors" id="floors" aria-label="floors"></nav>
  <div class="stats-side" id="stats"></div>
  <div class="side-foot" id="side-foot"></div>
  <div class="side-renderers" id="renderers"></div>
  <div class="rail" id="rail"></div>
</aside>
<main class="main home" id="main">
  <div class="bar">
    <div class="bar-top"><div id="bar-info"></div><div id="bar-actions"></div></div>
    <div class="tab-row" id="bar-line"></div>
  </div>
  <div id="bar-details" popover></div>
  <div id="bar-left" popover></div>
  <div class="ask" id="ask"></div>
  <div class="screen" id="screen"><div class="term" id="c-screen" role="tabpanel" aria-label="Terminal"></div><span id="c-mode"></span>
    <div class="brief" id="brief" role="tabpanel" aria-label="Brief"><iframe id="brief-doc" title="Brief" sandbox="allow-same-origin allow-popups allow-popups-to-escape-sandbox"></iframe></div>
    <div class="shown" id="shown" role="tabpanel" aria-label="Shown"></div>
    <div class="changes" id="changes" role="tabpanel" aria-label="Changes"></div>
    <div class="reviews" id="reviews" role="tabpanel" aria-label="Reviews"></div></div>
  <div class="shelf-view" id="shelf-view"><div class="shelf-head" id="shelf-head"></div><div class="shelf-body" id="shelf-body"></div></div>
  <div class="archive-view" id="archive-view"><div class="shelf-head" id="archive-head"></div><div class="archive" id="archive-list"></div></div>
  <div class="draft-view" id="draft-view"><div class="shelf-head" id="draft-head"></div><div class="draft-note" id="draft-note"></div>
    <textarea id="draft-text" spellcheck="false" placeholder="a prompt for later: the first line names it"></textarea></div>
  <div class="sky" id="sky"></div>
  <div class="dock">
    <div class="grip" id="grip"></div>
    <div class="tabs" id="tabs"></div>
    <div class="shell-pane" id="shell-pane"><div class="term" id="s-screen"></div></div>
  </div>
</main>
<dialog id="spawn" class="spawn" aria-label="New worker"></dialog>
<dialog id="transfer" aria-labelledby="transfer-title">
  <form method="dialog">
    <h2 id="transfer-title">SEND TO A WORKER</h2>
    <div class="targets" id="transfer-targets"></div>
    <div class="actions"><small>the draft is typed into the worker's prompt and submitted</small><button value="">Cancel</button></div>
  </form>
</dialog>
<dialog id="keys" aria-labelledby="keys-title">
  <form method="dialog">
    <h2 id="keys-title">Shortcuts</h2>
    <div class="keys" id="keys-list"></div>
    <h2 class="legend-head">Statuses</h2>
    <div class="keys legend" id="keys-legend"></div>
    <div class="actions"><small>hover a button for what it does</small><button value="">Close</button></div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<div class="sr-only" id="announce" role="status"></div>
<div class="board-error" id="board-error" role="alert"></div>
<script src="/tower.js"></script>
<script src="/xterm.js"></script>
<script src="/addon-fit.js"></script>
<script type="module">
import { documentCss, skyAt, terminalTheme, type } from '/design.js'
import { ATTENTION_MEANS, ATTENTION_NAME, HOST_ATTENTION, HOST_MEANS, HOST_NAME, ON_DUTY_MEANS, WAITING_MEANS, WAITING_NAME, hostState, statusLegendHtml, crewOf, crewFold, crewTree, goneHomeLine, hiresOf, CREWS_UNFOLDED_KEY, loudest, threadCheckoutOf, lampOf, BLOCKED_TEXT, DISMISS_TITLE, DISMISSED_KEY, REMIND_MS, RING_KEY, SOUNDS, dismissing, heededWaits, nextWait, ringing, soundOf, transitions, GIST_MARK, waitsBeganLine, claudeUntestedHtml, claudeFlagHtml, STUCK_TITLE, tidiedLine, tidyLine, tidyRows, LIMITS_STALE_MS, MOVE_KEYS, WORKTREE_STATE_NAME, WORKTREE_VERB_NAME, ago, base, branchLine, branchPlaceholder, can, current, detailsOf, dutyOrder, esc, matchesWords, archiveKey, pastCount, pastOf, rendererUrl, renderersHtml, shelfKind, shelfPage, shelfSource, risky, wordsOf, gistLine, gistOf, goneBases, keptBranchLines, modelName, moveOfKey, neighbours, paceLine, pairLine, plain, resetLine, shownTitle, span, spawnCall, spawnForm, spawnFormHtml, sendTargets, spawnSummaryHtml, statusName, workerIn, weekElapsed, whereLine, worktreeBranch, worktreeRisk, UNRESUMABLE_NAME, UNRESUMABLE_TITLE, KILL_COST, noun, plural, resumesRow, tagOf } from '/cards.js'
import { ICON, SHELF_ICON, originIcon } from '/icons.js'
import { THE_USER, REVIEWS, parseThread, sendText, threadId, unseenBy } from '/reviews.js'
import { anchorOf, anchorSpot, changedFiles, changesHtml, fileKey, isFolded, marksToggled, drawPanel, panelsCss, livePick, pickAnchor, picked, reviewsHtml, spotSelector, viewedCount, STATS_ALL, statsHtml, statsQuery, fileButtonsHtml, fileCall, keepingFocus, threadFiles } from '/panels.js'
import { briefCss, briefHtml, openFolds, shownFrom } from '/brief.js'
import { documentHtml, markdownHtml, safeHref } from '/markdown.js'
import { NATURAL_KEYS, terminalKeys } from '/termkeys.js'
import { alertsSection, settingsCss, settingsHtml, soundSection, themeSection } from '/settings.js'
import { placeOnOpen, watchTips } from '/tips.js'
import { DRAFTS, discard, draftItem, draftPath, draftState, draftTitles, draftsOf, edit, follow, keepsApart, leave, newDraft, openDraft as loadDraft, save, sendable, settle, titleOf } from '/drafts.js'

document.head.append(Object.assign(document.createElement('style'), { textContent: panelsCss + settingsCss }))
watchTips(document)

const onDuty = (c) => c.onDuty
/** The card's gist as HTML: a tool's name in bold, said words after their mark. */
const lineOf = (c) => {
  const gist = gistOf(c)
  if (!gist) return '<i>no prompt yet</i>'
  if (gist.kind === 'asks' || gist.kind === 'runs') return toolHtml(gist.text)
  return `<span class="said">${GIST_MARK[gist.kind]}</span> ${esc(gist.text)}`
}
/** `Bash npm test` → the tool's name in bold, then what it acts on. */
const toolHtml = (tool) => {
  const [name, ...target] = tool.split(' ')
  return `<span class="tool"><b>${esc(name)}</b> ${esc(target.join(' '))}</span>`
}
/** Windows a building shows: its most recent sessions, oldest at the bottom. */
const BUILDING_WINDOWS = 40
const BUILDING_MIN_WINDOWS = 16
const callsign = (id) => findCard(id).callsign
const when = (ms) => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
const $ = (id) => document.getElementById(id)
/** The one value a framed shelf page keeps for itself (`tower.remember`); storage can be unavailable, and then nothing is kept. */
function remembered(key) {
  try { return localStorage.getItem(key) } catch { return null }
}
function remember(key, value) {
  try { localStorage.setItem(key, value) } catch {}
}

/** Why the tower can't build the board, until its next board. */
let boardError
let board = { user: { name: 'user' }, floors: [], waiting: [], rateLimits: [], hostUp: false, hostOutdated: false, claudeUntested: [], shells: [], termsUp: false }
/** The web page of each project directory's origin remote. */
let origins = {}
let selected
/** The sections a viewer unfolded under a floor's workers, by `<section>:<project>`, kept in `tower.store`. */
const unfolded = new Set((await tower.store.get('floors.unfolded')) ?? [])

function toggleSection(key) {
  if (!unfolded.delete(key)) unfolded.add(key)
  tower.store.set('floors.unfolded', [...unfolded])
  render()
}

const cards = () => board.floors.flatMap((f) => f.cards)
/** The project's color as `--p`, for an element's styles to use. */
const paint = (projectId) => {
  const color = board.floors.find((f) => f.id === projectId)?.color
  return color ? `--p:${esc(color)}` : ''
}
/** A card by id: on the board, else in an archive this page has read. */
const findCard = (id) => cards().find((c) => c.id === id) ?? [...archives.values()].flatMap((a) => a.cards ?? []).find((c) => c.id === id)

/** The floors' archives this page has read, by project: the `archiveKey` each was read at, and its cards once read. */
const archives = new Map()

/** Reads a floor's archive, keeping the cards read before until it lands; a read a later one overtook is dropped. */
function readArchive(project) {
  const reading = { key: archiveKey(board, floorOf(project)), cards: archives.get(project)?.cards }
  archives.set(project, reading)
  return tower.archive(project).then(
    (cards) => archives.get(project) === reading && ((reading.cards = cards), render()),
    (err) => toast(`The archive of ${project} can't be read: ${err.message}`),
  )
}

/** Reads again every archive held whose floor's archive moved since. */
const freshArchives = () => {
  for (const [project, { key }] of archives) if (floorOf(project) && key !== archiveKey(board, floorOf(project))) readArchive(project)
}

/** A card by id, reading every floor's archive on a miss: for an id the board may have left out. */
async function lookUp(id) {
  if (!findCard(id)) await Promise.all(board.floors.filter((f) => f.archived && !archives.get(f.id)?.cards).map((f) => readArchive(f.id)))
  return findCard(id)
}
/** The workers waiting on you that you heed, in the order to go to them. */
const waitsOnYou = () => heededWaits(board, heed).map((w) => findCard(w.id))
/** Top floor first, like an elevator panel. */
const floorsTopDown = () => [...board.floors].reverse()
const byStart = (a, b) => a.startedAt - b.startedAt

const sessionHtml = (c) => {
  return `<div class="sess ${lampOf(c)} ${c.waiting ? 'waits' : ''} ${c.id === selected ? 'sel' : ''} ${onDuty(c) ? '' : 'gone'}" data-id="${c.id}" data-hold="${c.id}">
    <div class="top"><span class="lamp"></span><a class="call" href="#${c.id}"${c.id === selected ? ' aria-current="true"' : ''}>${callsign(c.id)}</a><span class="st${c.stuck ? ' stuck' : ''}" title="${c.stuck ? STUCK_TITLE : esc(statusName(c))}">${statusName(c)} · <span data-since="${c.enteredAt}"></span></span></div>
    ${c.worktree ? `<div class="branch" title="worktree ${esc(c.worktree.name)}: ${esc(c.cwd)}">${esc([branchLine(c), pairLine(c)].filter(Boolean).join(' · '))}</div>` : ''}
    <div class="line">${lineOf(c)}</div>
    ${can(c, 'resume') ? `<div class="act"><button data-resume="${esc(JSON.stringify(c.calls.resume))}"><span aria-hidden="true">↻</span> resume</button></div>` : c.unresumable ? `<div class="act">${unresumableHtml(c)}</div>` : ''}
  </div>`
}

/** A worker and everyone under it. */
const wholeCrewHtml = (cards, c) => {
  const hires = hiresOf(cards, c)
  return sessionHtml(c) + (hires.length ? `<div class="crew">${hires.map((h) => wholeCrewHtml(cards, h)).join('')}</div>` : '')
}

/** A worker, the crew under it not gone home, and those gone home on one line that unfolds them (`crewFold`). */
const crewHtml = (cards, c) => {
  const { drawn, home, folded } = crewFold(cards, c)
  const open = crewsUnfolded.has(c.id)
  const fold = home.length
    ? `<button class="gone-home" data-crew-fold="${c.id}" data-hold="fold:${c.id}" aria-expanded="${open}"><span aria-hidden="true">${open ? '▾' : '▸'}</span> ${goneHomeLine(folded)}</button>${open ? home.map((h) => wholeCrewHtml(cards, h)).join('') : ''}`
    : ''
  const under = drawn.map((h) => crewHtml(cards, h)).join('') + fold
  return sessionHtml(c) + (under ? `<div class="crew">${under}</div>` : '')
}

/** The hirers whose gone-home crew this viewer unfolded, by card id, as `tower.store` keeps them. */
let crewsUnfolded = new Set()
async function readCrewFolds() {
  crewsUnfolded = new Set((await tower.store.get(CREWS_UNFOLDED_KEY)) ?? [])
}
function toggleCrewFold(id) {
  if (!crewsUnfolded.delete(id)) crewsUnfolded.add(id)
  crewsUnfolded = new Set([...crewsUnfolded].filter((h) => findCard(h)))
  tower.store.set(CREWS_UNFOLDED_KEY, [...crewsUnfolded])
  render()
}

/** Why a past worker can't be resumed, quietly: it is history, not an alarm. */
const unresumableHtml = (c) => `<span class="unresumable" title="${esc(UNRESUMABLE_TITLE[c.unresumable])}">${UNRESUMABLE_NAME[c.unresumable]}</span>`

const resumeHtml = (c, conv) => can(conv, 'resume')
  ? `<button data-resume="${esc(JSON.stringify(conv.calls.resume))}" aria-label="resume this conversation" title="resume this conversation">↻</button>`
  : can(conv, 'goto') ? `<span class="when">→ ${conv.resumedBy.callsign}</span>` : ''

const pastConversationHtml = (c, conv) =>
  `<div class="conv" title="${esc(conv.prompt ? GIST_MARK.prompt + ' ' + conv.prompt : '')}${conv.answer ? '\n\n' + GIST_MARK.answer + ' ' + esc(conv.answer) : ''}">
    <span class="what">${conv.answer ? `<span class="said">${GIST_MARK.answer}</span> ` + esc(plain(conv.answer)) : conv.prompt ? `<span class="said">${GIST_MARK.prompt}</span> ` + esc(plain(conv.prompt)) : '<i>no prompt</i>'}</span>
    ${resumeHtml(c, conv)}</div>`

/** A past worker and the conversations it held, oldest first. */
const pastHtml = (c) =>
  `<div class="past ${c.attention} ${c.id === selected ? 'sel' : ''}" data-id="${c.id}">
    <div class="head" title="${statusName(c)}"><span class="lamp"></span><a class="call" href="#${c.id}"${c.id === selected ? ' aria-current="true"' : ''}>${callsign(c.id)}</a><span class="when">${c.unresumable ? `${unresumableHtml(c)} · ` : ''}${when(c.startedAt)}</span></div>
    ${c.conversations.map((conv) => pastConversationHtml(c, conv)).join('') || '<div class="conv"><i class="what">no conversation</i></div>'}
  </div>`

const dirHtml = (f, dir, hub) =>
  `<div class="dir"><span class="dname" title="${esc(dir)}">${hub ? '⌂' : '·'} ${esc(base(dir))}</span>
    ${can(f, 'shell') ? `<button data-shell-project="${esc(f.id)}" data-shell-dir="${esc(dir)}" aria-label="new shell in ${esc(base(dir))}" title="new shell in ${esc(dir)}">${ICON.shell}</button>` : ''}
    ${can(f, 'editor') ? `<button data-open="${esc(dir)}" data-open-project="${esc(f.id)}" aria-label="open ${esc(base(dir))} in your editor" title="open ${esc(dir)} in a new window of your editor">${ICON.editor}</button>` : ''}
    ${origins[dir] ? `<a href="${esc(origins[dir])}" target="_blank" rel="noreferrer" aria-label="${esc(base(dir))} on the web" title="${esc(origins[dir])}">${originIcon(origins[dir])}</a>` : ''}
  </div>`

/** What a worktree verb asks before it runs, and what it says once done, by the name of the worktree or kept branch. */
const WORKTREE_ASK = {
  remove: (name) => `Remove the worktree ${name} in every repo?\n\nIts branch is deleted where it is absorbed into its base; refused when work would be lost.`,
  prune: (name) => `Forget the lost worktree ${name}?\n\nIts branch is deleted where it is absorbed into its base.`,
  delete: (name) => `Delete the kept branch ${name} in every repo where it is absorbed into its base?`,
}
const WORKTREE_DONE = { recut: 'recut', prune: 'forgot', remove: 'removed', delete: 'deleted' }

/** A verb on a worktree or kept branch, its call on the button. */
const wtVerbHtml = (thing, verb) => `<button data-wt-call="${esc(JSON.stringify(thing.calls[verb]))}" data-wt-verb="${verb}" data-wt-name="${esc(thing.name)}">${WORKTREE_VERB_NAME[verb]}</button>`

const worktreeHtml = (f, w) => {
  const risk = worktreeRisk(w)
  const where = w.repos[0].path
  const title = [`${w.repos.map((r) => r.path).join('\n')}`, ...risk, ...goneBases(w.repos), w.sessions.length ? `in use by ${w.sessions.join(', ')}` : ''].filter(Boolean).join('\n')
  return `<div class="wt ${w.state}" title="${esc(title)}"><span class="n"><b>${esc(w.name)}</b> ⎇ ${esc(worktreeBranch(w))}</span>
    <span class="st">${WORKTREE_STATE_NAME[w.state]}</span>
    ${w.verbs.map((v) => wtVerbHtml(w, v)).join('')}
    ${w.state !== 'lost' && can(f, 'shell') ? `<button class="ic" data-shell-project="${esc(f.id)}" data-shell-dir="${esc(where)}" aria-label="new shell in ${esc(w.name)}" title="new shell in ${esc(where)}">${ICON.shell}</button>` : ''}
    ${w.state !== 'lost' && can(f, 'editor') ? `<button class="ic" data-open="${esc(where)}" data-open-project="${esc(f.id)}" aria-label="open ${esc(w.name)} in your editor" title="open ${esc(where)} in a new window of your editor">${ICON.editor}</button>` : ''}
  </div>`
}

const keptBranchHtml = (b) =>
  `<div class="wt" title="${esc(keptBranchLines(b).join('\n'))}">
    <span class="n">⎇ ${esc(b.name)}</span><span class="st">${b.absorbed ? 'merged' : 'kept'}</span>${b.verbs.map((v) => wtVerbHtml(b, v)).join('')}</div>`

/** The floor's worktrees and the branches the tower kept. */
const worktreesHtml = (f) => `<div class="worktrees">
    <div class="drafts-head">Worktrees</div>
    ${f.worktrees.map((w) => worktreeHtml(f, w)).join('')}${f.branches.map(keptBranchHtml).join('')}</div>`

/** A floor's review threads, each named by its checkout beside its tag. */
const threadsHtml = (f) => {
  const rows = f.threads.map((t) => {
    const meta = [t.tag, plural(t.messages, 'note'), t.last && `last ${t.last.author}`, t.landed && 'landed'].filter(Boolean).join(' · ')
    return `<div class="draft thread" data-thread="${esc(f.id)}|${esc(t.checkout)}" title="${esc(`${t.id}${t.last ? `\nn${t.last.n} by ${t.last.author}, ${t.last.at}` : ''}`)}"><span class="t">${esc(t.checkout)}</span><span class="meta">${esc(meta)}</span></div>`
  })
  return `<div class="drafts"><div class="drafts-head">Review threads</div>${rows.join('')}</div>`
}

/** Everything the floor's Tidy would do, listed before the press, which applies the list as shown. */
const tidyHtml = (f) => `<div class="worktrees">
    <div class="drafts-head">${esc(tidyLine(f.tidy))}<button class="tidy-all" data-tidy="${f.id}" title="do all of it, as listed">Tidy all</button></div>
    ${tidyRows(f, Date.now()).map(tidyRowHtml).join('')}</div>`

/** One thing Tidy would do, with a button that does only it. */
const tidyRowHtml = (r) => `<div class="wt" title="${esc(r.title)}"><span class="n"><b>${esc(r.what)}</b></span><span class="st">${esc(r.does)}</span>
    <button class="ic" data-tidy-call="${esc(JSON.stringify(r.call))}" data-tidy-ask="${esc(`${r.what}: ${r.does}?\n\n${r.title}`)}" aria-label="${esc(`${r.does}: ${r.what}`)}" title="${esc(`only this: ${r.does}`)}">⌫</button></div>`


const shelfEntryHtml = (f, entry, n) => shelfKind(entry) === 'link'
  ? `<a href="${esc(entry.link)}" target="_blank" rel="noreferrer" title="${esc(entry.link)}">${SHELF_ICON.link} ${esc(entry.label)}</a>`
  : `<button class="${shelfOpen?.project === f.id && shelfOpen.n === n ? 'sel' : ''}" data-shelf="${f.id}" data-n="${n}" title="${esc(shelfSource(entry))}">${SHELF_ICON[shelfKind(entry)]} ${esc(entry.label)}</button>`

const shelfHtml = (f) => !f.shelf?.length ? '' : `<div class="shelf">${f.shelf.map((entry, n) => shelfEntryHtml(f, entry, n)).join('')}</div>`

/** The drafts collection's reads and writes, over the page's routes. */
const draftIo = {
  call: tower.call,
  read: (project, id) => tower.text(draftPath(project, id)),
  failed: (err) => toast(err.message),
}
const { title: draftTitle, prune: pruneDraftTitles } = draftTitles(draftIo.read, () => render())

const draftsHtml = (f) => {
  const drafts = draftsOf(f)
  const rows = drafts.items.map((item) => {
    const open = draftOpen?.project === f.id && draftOpen.id === item.id
    const meta = [item.tag, item.keptBy?.callsign].filter(Boolean).join(' · ')
    return `<div class="draft ${open ? 'sel' : ''}" data-draft="${f.id}" data-item="${esc(item.id)}"><span class="t">${esc(draftTitle(f.id, item))}</span><span class="meta">${esc(meta)}</span></div>`
  })
  return `<div class="drafts"><div class="drafts-head">${esc(drafts.label)}<button data-new-draft="${f.id}" aria-label="new draft" title="new draft">+</button></div>${drafts.description ? `<div class="drafts-about">${esc(drafts.description)}</div>` : ''}${rows.join('') || '<div class="empty">none kept</div>'}</div>`
}

/**
 * What a floor keeps beside its workers, folded to one row of counts so the workers stay in sight: drafts,
 * worktrees, threads and what Tidy would do unfold under it, the archive opens in the main pane. Worktrees that would lose work say so folded.
 */
function traysHtml(f) {
  const drafts = draftsOf(f)
  const trees = f.worktrees.length + f.branches.length
  const atRisk = risky(f)
  const past = pastCount(f)
  const threads = f.threads.length
  const tidy = can(f, 'tidy')
  const tray = (key, label, title) => `<button class="tray ${unfolded.has(`${key}:${f.id}`) ? 'on' : ''}" data-section="${key}:${f.id}" aria-expanded="${unfolded.has(`${key}:${f.id}`)}" title="${title}">${label}</button>`
  const glyph = (g) => `<span aria-hidden="true">${g}</span>`
  const trays = [
    drafts && tray('drafts', `${glyph('✎')} <b>${drafts.items.length}</b> in ${esc(drafts.label.toLowerCase())}`, esc(drafts.description ?? 'prompts kept for later')),
    trees && tray('worktrees', `${glyph('⎇')} <b>${trees}</b> ${noun(trees, 'worktree')}${atRisk ? ` <i>${atRisk} at risk</i>` : ''}`, 'worktrees and the branches the tower kept'),
    threads && tray('threads', `${glyph('◇')} <b>${threads}</b> ${noun(threads, 'thread')}`, 'review threads, one per checkout: notes from you, its workers and reviewers'),
    past && `<button class="tray ${archiveOpen?.project === f.id ? 'on' : ''}" data-archive="${f.id}" aria-pressed="${archiveOpen?.project === f.id}" title="past workers and their conversations, in the main pane">${glyph('▤')} <b>${past}</b> archived</button>`,
    tidy && tray('tidy', `${glyph('⌫')} ${esc(tidyLine(f.tidy))}`, 'what Tidy would do: unfold it to see the list before you press'),
  ].filter(Boolean)
  if (!trays.length) return ''
  return `<div class="trays">${trays.join('')}</div>
    ${drafts && unfolded.has(`drafts:${f.id}`) ? draftsHtml(f) : ''}${trees && unfolded.has(`worktrees:${f.id}`) ? worktreesHtml(f) : ''}${threads && unfolded.has(`threads:${f.id}`) ? threadsHtml(f) : ''}${tidy && unfolded.has(`tidy:${f.id}`) ? tidyHtml(f) : ''}`
}

/** A floor's sign: its number on the project's band, its name in caps. */
const signHtml = (n, name, extra = '') =>
  `<div class="sign"><span class="num">${String(n).padStart(2, '0')}</span><span class="name" role="heading" aria-level="2">${esc(name)}</span>${extra}</div>`

const floorHtml = (f, i, all) => {
  const heads = crewTree(f.cards).filter(({ depth }) => depth === 0).map(({ card }) => card)
  return `<section class="floor" style="${paint(f.id)}" data-hold="floor:${esc(f.id)}">
    ${signHtml(all.length - i, f.name, can(f, 'spawn') ? `<button data-spawn="${f.id}" aria-label="new session on ${esc(f.name)}" title="new session">+</button>` : '')}
    <div class="dirs">${dirHtml(f, f.hub, true)}${f.repos.map((r) => dirHtml(f, r, false)).join('')}</div>
    ${shelfHtml(f)}
    <div class="sessions">${heads.length ? heads.map((c) => crewHtml(f.cards, c)).join('') : '<div class="empty">lights off</div>'}</div>
    ${traysHtml(f)}
  </section>`
}

/** A meter's fill: ink, the working colour past `warm`, needs past `hot`. */
const fillOf = (pct, warm, hot) => (pct > hot ? 'var(--needs)' : pct > warm ? 'var(--working)' : 'var(--ink)')

/** A limit's meter, with a tick where an even pace through the week would be. */
const limitHtml = (r, now) => {
  const pct = r.percentUsed
  const elapsed = weekElapsed(r, now)
  const pace = elapsed === undefined ? '' : `<s style="left:${elapsed}%"></s>`
  return `<div${elapsed === undefined ? '' : ` title="${paceLine(pct, elapsed)}"`}><div class="row">${esc(r.kind.replaceAll('_', ' '))} <b>${pct}%</b>
    <small>${r.resetsAt ? resetLine(r.resetsAt, now) : ''}</small></div>
    <div class="meter" style="--fill:${fillOf(pct, 60, 85)}"><i style="width:${pct}%"></i>${pace}</div></div>`
}

/** The rate limits as of their reading, dimmed once it is old enough to have moved. */
const limitsHtml = (now) => {
  if (!board.rateLimits.length) return '<small>no rate-limit reading yet</small>'
  const age = now - board.rateLimitsAt
  return `${board.rateLimits.map((r) => limitHtml(r, now)).join('')}
    <small class="asof ${age > LIMITS_STALE_MS ? 'stale' : ''}" title="read during a session's turn: it refreshes only while one works">as of ${span(age)} ago</small>`
}

let limitsPainted = ''
function paintLimits() {
  const html = limitsHtml(Date.now())
  if (html !== limitsPainted) $('limits').innerHTML = limitsPainted = html
}

const windowHtml = (c) => {
  const title = `${callsign(c.id)} · ${statusName(c)}${gistLine(c) ? ' · ' + gistLine(c) : ''}`
  return `<a class="w ${onDuty(c) ? 'lit' : 'past'} ${c.attention}" href="#${c.id}" aria-label="${esc(title)}" title="${esc(title)}"></a>`
}

const buildingHtml = (f, i) => {
  const shown = [...f.cards].sort(byStart).slice(-BUILDING_WINDOWS)
  const dark = '<div class="w"></div>'.repeat(Math.max(0, BUILDING_MIN_WINDOWS - shown.length) + (4 - (Math.max(shown.length, BUILDING_MIN_WINDOWS) % 4)) % 4)
  return `<div class="building" style="${paint(f.id)}">${signHtml(i + 1, f.name)}<div class="mast ${loudest(f.cards.filter((c) => c.waiting)) ?? ''} ${f.cards.some((c) => c.waiting) ? 'alarm' : ''}"></div>
    <div class="body">${shown.map(windowHtml).join('')}${dark}</div></div>`
}

/** The skyline's sky follows the viewer's clock, as Tower 3D's does: the sun crosses by day, the moon hangs at night. */
function paintSky() {
  const now = new Date()
  const hours = now.getHours() + now.getMinutes() / 60
  const sky = skyAt(hours)
  const day = Math.min(1, Math.max(0, (hours - 6) / 13))
  for (const [name, value] of Object.entries({ top: sky.top, mid: sky.mid, horizon: sky.horizon })) $('sky').style.setProperty(`--sky-${name}`, value)
  $('sky').style.setProperty('--stars', sky.stars)
  $('sky').style.setProperty('--orb-x', sky.stars > 0.5 ? '86%' : `${36 + day * 56}%`)
  $('sky').style.setProperty('--orb-y', sky.stars > 0.5 ? '14%' : `${46 - Math.sin(day * Math.PI) * 34}%`)
  $('orb')?.classList.toggle('moon', sky.stars > 0.5)
  $('orb')?.classList.toggle('sun', sky.stars <= 0.5)
  if ($('clock')) $('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
}

function skylineHtml() {
  const waiting = heededWaits(board, heed).length
  const working = cards().filter((c) => c.status === 'working').length
  const big = waiting ? `<b>${waiting}</b> waiting on you` : working ? `${working} at work` : 'all quiet'
  return `<div class="stars"></div><div class="orb" id="orb"></div>
    <div class="hello ${loudest(waitsOnYou()) ?? ''}"><div class="big">${big}</div><div class="sub">${waiting ? `press N or ${MOVE_KEYS.waiting.label} to go to the next one` : 'click a window, or + on a floor to start a session'}</div>
      <div class="clock" id="clock"></div></div>
    <div class="city">${board.floors.map(buildingHtml).join('')}</div><div class="street"></div>`
}

/** The selected worker's header: who and where, a glance at its context, cost and leftovers, its views, what it does now, and the workers around it. */
function barHtml(c) {
  const ports = c.resources.flatMap((r) => r.ports.map((p) => `:${p}`)).join(' ')
  const orphan = c.resources.some((r) => r.orphan)
  const ctx = c.context
  repaint($('bar-info'), `<span class="call" role="heading" aria-level="2">${callsign(c.id)}</span>
    <span class="pill ${lampOf(c)}${c.stuck ? ' stuck' : ''}"${c.stuck ? ` title="${STUCK_TITLE}"` : ''}><span class="lamp"></span>${statusName(c)} ·<span data-since="${c.enteredAt}"></span></span>
    <span class="where" title="${esc(c.cwd)}">${esc(whereLine(c, floorOf(c.project)))}</span>
    <span class="stats">
      ${ctx === undefined ? '' : `<span class="meter" title="context window: ${ctx}% · ${esc(modelName(c.model))}" style="--fill:${ctx > 80 ? 'var(--needs)' : 'var(--working)'}"><i style="width:${ctx}%"></i></span><b>${ctx}%</b>`}
      ${c.costUsd != null ? `<b>$${c.costUsd.toFixed(2)}</b>` : ''}
      ${claudeFlagHtml(c) ?? ''}
      ${can(c, 'reap') ? `<button class="ports ${orphan ? 'orphan' : ''}" popovertarget="bar-left" title="processes left running: click to see them and end them">${c.resources.length}▪ ${ports}</button>` : ''}
    </span>`)
  repaint($('bar-actions'), `<button class="info" popovertarget="bar-details" aria-label="details" title="everything else about ${callsign(c.id)}">ⓘ</button>
    ${can(c, 'resume') ? `<button class="primary" data-resume="${esc(JSON.stringify(c.calls.resume))}"><span aria-hidden="true">↻</span> Resume</button>` : ''}
    ${can(c, 'review') ? `<button data-act="review" title="hire a reviewer: it works in a fork of ${esc(c.checkout)} (uncommitted work included), reviews once against ${callsign(c.id)}'s goal and leaves notes on its thread">Review</button>` : ''}
    ${can(c, 'send-home') ? `<button class="danger" data-act="send-home" title="${esc(sendHomeTitle(c))}">Send home</button>` : ''}
    ${can(c, 'kill') ? '<button class="danger" data-act="kill">Kill</button>' : ''}
    <button data-act="home" aria-label="back to the skyline" title="back to the skyline (Esc outside the terminal)">✕</button>`)
  $('bar-details').innerHTML = detailsHtml(c)
  $('bar-left').innerHTML = leftHtml(c)
  $('main').classList.toggle('asking', c.status === 'needs_input' || c.status === 'blocked')
  $('ask').innerHTML = `<span class="what"><span class="call">${callsign(c.id)}</span> ${c.blocked ? esc(BLOCKED_TEXT[c.blocked]) : c.tool ? `asks to ${toolHtml(c.tool)}` : 'needs you'}</span>
    ${can(c, 'drive') ? '<button class="primary" data-act="drive">Open terminal</button>' : ''}`
  repaint($('bar-line'), [
    paneTabsHtml(c, paneOf(c)),
    `<button class="activity" popovertarget="bar-details" title="${esc(gistLine(c))}">${lineOf(c)}</button>`,
    movesHtml(c),
  ].filter(Boolean).join(''))
  renderPane(c)
}

/** The details open over the top of the screen, clear of the header that opened them. */
$('bar-details').addEventListener('beforetoggle', (e) => e.newState === 'open' && ($('bar-details').style.top = `${$('screen').getBoundingClientRect().top + 6}px`))

/** The rest of what is known about a worker, opened from its header: what it does now in full, and every detail. */
/** What the worker left running, each process ended on its own or all at once. */
function leftHtml(c) {
  if (!c.resources.length) return `<h3>${callsign(c.id)} left nothing running</h3>`
  const row = (r) => `<div class="proc"><code>${r.pid}</code><span class="on ${r.orphan ? 'orphan' : ''}">${[...r.ports.map((p) => `:${p}`), r.orphan ? 'orphan' : ''].filter(Boolean).join(' ')}</span>
    <span class="cmd" title="${esc(r.command)}">${esc(r.command)}</span><button data-reap-process="${esc(JSON.stringify(r.calls.reap))}" title="end process ${r.pid}">End</button></div>`
  return `<h3>Left running by ${callsign(c.id)}</h3>${c.resources.map(row).join('')}
    <div class="all"><button class="danger" data-reap="${c.id}">End all ${c.resources.length}</button></div>`
}

function detailsHtml(c) {
  const rows = [
    ['now', gistLine(c)],
    ...detailsOf(c),
    resumesRow(c, when),
    ['started', when(c.startedAt)],
    ['terminal', term && selected === c.id ? `${term.cols}×${term.rows} · ${isOwner() ? 'sized to this view, you type' : 'watching'}` : ''],
  ].filter(([, value]) => value)
  return `<h3>${callsign(c.id)}</h3><dl>${rows.map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`).join('')}</dl>`
}

const MOVE_TITLE = { prev: 'previous on duty', next: 'next on duty', waiting: 'next waiting on you' }

/** The workers each move key goes to from `c`, named before you go, and ✕ for `c`'s own wait while you heed it. */
function movesHtml(c) {
  const to = neighbours(board, c.id, heed)
  const wait = heededWaits(board, heed).find((w) => w.id === c.id)
  const dismiss = wait ? `<button class="move dismiss" data-dismiss="${esc(wait.key)}" aria-label="${DISMISS_TITLE}" title="${DISMISS_TITLE}">✕</button>` : ''
  const move = (m) => {
    const card = to[m]
    if (!card || card.id === c.id) return ''
    return `<button class="move ${m} ${card.attention}" data-move="${m}" aria-label="${MOVE_TITLE[m]}: ${callsign(card.id)}, ${statusName(card)}" title="${MOVE_TITLE[m]} (${MOVE_KEYS[m].label})"><small>${MOVE_KEYS[m].label}</small><span class="lamp ${lampOf(card)}"></span><span class="call">${callsign(card.id)}</span></button>`
  }
  const moves = dismiss + ['prev', 'next', 'waiting'].map(move).join('')
  return moves && `<span class="moves">${moves}</span>`
}

/** The selected session's view in the main pane, as the viewer picked it since selecting the session. */
let paneChoice
/** A running session opens on its terminal, a finished one on its brief; a shown thing closed since falls back. */
const paneOf = (c) =>
  (paneChoice?.startsWith('shown:') && !shownOn(c, paneChoice) ? undefined : paneChoice) ?? (can(c, 'drive') || !can(c, 'brief') ? 'screen' : 'brief')

/** A pane's tab, as the ARIA tabs pattern has it: only the selected one is in the Tab order, arrows move along the row. */
const PANE_PANEL = { screen: 'c-screen', brief: 'brief', changes: 'changes', reviews: 'reviews' }
const paneTabAttrs = (id, on) =>
  `role="tab" aria-selected="${on}" tabindex="${on ? 0 : -1}" aria-controls="${id.startsWith('shown:') ? 'shown' : PANE_PANEL[id]}" data-pane="${esc(id)}"`

const paneTabsHtml = (c, pane) => {
  const shown = visibleShown(c)
  return `<span class="tab-set" role="tablist" aria-label="views of ${callsign(c.id)}"><button class="pane-tab ${pane === 'screen' ? 'on' : ''}" ${paneTabAttrs('screen', pane === 'screen')}>Terminal</button>` +
    (can(c, 'brief') ? `<button class="pane-tab ${pane === 'brief' ? 'on' : ''}" ${paneTabAttrs('brief', pane === 'brief')} title="the last prompts and answers of each conversation, in full">Brief</button>` : '') +
    `<button class="pane-tab ${pane === 'changes' ? 'on' : ''}" ${paneTabAttrs('changes', pane === 'changes')} title="what changed in the worker's repos, as git reads it">Changes${changesTally(c)}</button>` +
    (keepsThreads(c) ? `<button class="pane-tab ${pane === 'reviews' ? 'on' : ''}" ${paneTabAttrs('reviews', pane === 'reviews')} title="the review thread of checkout ${esc(threadCheckoutOf(c))}: notes from you, its workers and reviewers">Reviews${reviewsTally(c)}</button>` : '') +
    shown.map((s) => shownTabHtml(c, s, pane === shownPane(s))).join('') + '</span>'
}

/** What a worker showed, as a tab: a link opens in a browser tab, anything else also opens out of the tower. */
const shownTabHtml = (c, s, on) => {
  const from = shownFrom(c.lineage, s)
  return `<button class="pane-tab shown-tab ${on ? 'on' : ''}" ${paneTabAttrs(shownPane(s), on)} title="${esc(`${callsign(c.id)} showed ${s.target} · ${ago(Date.now() - s.at)} ago${from ? ` · in ${from.label}` : ''}`)}">` +
  `<span class="shown-name">${s.kind === 'link' ? '↗ ' : ''}${esc(shownTitle(s))}</span>${from ? `<small>${from.mark}</small>` : ''}` +
  (on && s.kind !== 'link' ? `<span class="out" data-out="${esc(shownHref(s))}" aria-hidden="true" title="open in a browser tab">↗</span>` : '') +
  (on && s.kind === 'file' ? fileButtonsHtml(s.target) : '') +
  `<span class="unshow" data-unshow="${esc(shownKey(s))}" aria-hidden="true" title="close: it comes back if shown again">×</span></button>`
}

const shownPane = (s) => `shown:${s.target}`
const shownOn = (c, pane) => visibleShown(c).find((s) => shownPane(s) === pane)
/** Each showing has its own key: closing one leaves the next showing of the same target open. */
const shownKey = (s) => `${s.session}|${s.target}|${s.at}`
const shownHref = (s) => (s.kind === 'file' ? `/shown/${s.session}${s.target.split('/').map(encodeURIComponent).join('/')}` : s.target)

/** The showings this viewer closed, by `session|target|at`, kept in `tower.store`. */
const unshown = new Set((await tower.store.get('shown.closed')) ?? [])
const visibleShown = (c) => c.shown.filter((s) => !unshown.has(shownKey(s)))

function unshow(key) {
  unshown.add(key)
  tower.store.set('shown.closed', [...unshown].slice(-200))
  render()
}

/** The selected session and its conversations as the brief last asked for them: it asks again when they change. */
let briefKey

/** The brief and what a worker showed lie over the terminal, which keeps its size: a hidden terminal would refit the PTY to nothing. */
function renderPane(c) {
  const pane = paneOf(c)
  renderShown(c, pane.startsWith('shown:') ? shownOn(c, pane) : undefined)
  const brief = pane === 'brief'
  $('c-screen').inert = pane !== 'screen'
  $('main').classList.toggle('on-brief', brief)
  $('main').classList.toggle('on-changes', pane === 'changes')
  $('main').classList.toggle('on-reviews', pane === 'reviews')
  const reviewing = pane === 'changes' || pane === 'reviews'
  followChanges(reviewing ? c : undefined)
  if (reviewing && keepsThreads(c)) followThread(c)
  if (pane === 'changes') drawChanges()
  if (pane === 'reviews') drawReviews(c)
  const key = brief && `${c.id} ${JSON.stringify(c.conversations)}`
  if (!key || key === briefKey) return
  briefKey = key
  told(tower.conversations(c.id)).then((threads) => threads && briefKey === key && showBrief(c, threads))
}

/** The showing the shown pane last drew: a new showing of the same target draws it again. */
let shownDrawn

function renderShown(c, s) {
  $('main').classList.toggle('on-shown', Boolean(s))
  const key = s && shownKey(s)
  if (key === shownDrawn) return
  shownDrawn = key
  if (!s) return ($('shown').innerHTML = '')
  if (s.kind === 'url') return ($('shown').innerHTML = `<iframe src="${esc(s.target)}" allow="clipboard-read; clipboard-write"></iframe>`)
  if (s.kind === 'link') return ($('shown').innerHTML = `<iframe class="doc" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>`, showLink(c, s))
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(s.target)) return ($('shown').innerHTML = `<img src="${esc(shownHref(s))}" alt="${esc(shownTitle(s))}">`)
  if (/\.(mp4|webm)$/i.test(s.target)) return ($('shown').innerHTML = `<video controls autoplay src="${esc(shownHref(s))}"></video>`)
  if (!s.target.endsWith('.md')) return ($('shown').innerHTML = `<iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" src="${esc(shownHref(s))}"></iframe>`)
  $('shown').innerHTML = `<iframe class="doc" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>`
  told(tower.text(shownHref(s).slice(1))).then((md) => {
    if (md === undefined || shownDrawn !== key) return
    $('shown').firstChild.srcdoc = `<!doctype html><html data-scheme="${scheme()}"><meta charset="utf-8"><base target="_blank"><link rel="stylesheet" href="/design.css"><style>${documentCss}${BRIEF_CSS}</style><article>${documentHtml(md, shownHref(s))}</article>`
  })
}

/**
 * The changes of the selected session, read when its Changes pane opens, every `CHANGES_POLL_MS` while it stays open,
 * and when a turn ends. Claude edits through scripts as often as through its edit tools, so git is read on a timer.
 */
const CHANGES_POLL_MS = 30_000
/** The last read: `viewed` holds each repo's marks, a file's path → the hash of the diff it was viewed at. */
let changes
let changesPoll
/** Files the viewer folded or unfolded against what their viewed mark says, by `fileKey`; this page only. */
const folds = new Set()

/** The marks of a repo are shared by every renderer in this browser, through `tower.store`. */
const viewedKey = (dir) => `viewed:${dir}`
const fileAt = (key) => changedFiles(changes.repos).find(([repo, f]) => fileKey(repo, f) === key)

function followChanges(c) {
  if (changesPoll && changesPoll.id !== c?.id) changesPoll = (clearInterval(changesPoll.timer), undefined)
  if (!c) return
  if (!changesPoll) {
    changesPoll = { id: c.id, status: c.status, timer: setInterval(() => readChanges(c.id), CHANGES_POLL_MS) }
    return readChanges(c.id)
  }
  const turnEnded = changesPoll.status === 'working' && c.status !== 'working'
  changesPoll.status = c.status
  if (turnEnded) readChanges(c.id)
}

async function readChanges(id) {
  const repos = await told(tower.get(`changes/${id}`))
  if (!repos || changesPoll?.id !== id) return
  const marks = await Promise.all(repos.map((repo) => tower.store.get(viewedKey(repo.dir))))
  changes = { id, repos, at: Date.now(), viewed: Object.fromEntries(repos.map((repo, i) => [repo.dir, marks[i] ?? {}])) }
  render()
}

/** Files viewed of files changed, once read. */
const changesTally = (c) => {
  if (changes?.id !== c.id) return ''
  const { viewed, files } = viewedCount(changes)
  return files ? `<small>${viewed}/${files}</small>` : ''
}

function toggleViewed(key) {
  const [repo, f] = fileAt(key)
  changes.viewed[repo.dir] = marksToggled(changes.viewed, repo, f)
  tower.store.set(viewedKey(repo.dir), changes.viewed[repo.dir])
  folds.delete(key)
  render()
}

function toggleFold(key) {
  if (!folds.delete(key)) folds.add(key)
  drawChanges()
}

/** Lines picked in the Changes pane, and the note being written under them; `pickFresh` until the box first takes focus. */
let pick
let pickText = ''
let pickFresh = false
const dropPick = () => ((pick = undefined), (pickText = ''))

function drawChanges() {
  const c = findCard(selected)
  const read = changes?.id === c.id ? changes : undefined
  const live = read && livePick(read, pick)
  if (read && pick && !live) toast('The file changed under your pick: pick its lines again, your note is kept')
  if (read) pick = live
  drawPanel($('changes'), changesHtml({ read, folds, pick, thread: threadOf(c), checkout: threadCheckoutOf(c), user: board.user.name }), { 'pick-text': pickText })
  if (pickFresh) $('changes').querySelector('[data-pick-text]')?.focus()
  pickFresh = false
  if (jump && read) jumpToAnchor()
}

function pickLine(value, extend) {
  pick = picked(changes, pick, value, extend)
  pickFresh = true
  drawChanges()
}

const reviewsOf = (f) => f?.collections.find((col) => col.id === REVIEWS)
const keepsThreads = (c) => Boolean(reviewsOf(floorOf(c.project)))
const threadItem = (c) => reviewsOf(floorOf(c.project))?.items.find((i) => i.id === threadId(threadCheckoutOf(c)))

/** The thread of the selected worker's checkout as last read: read again whenever its file's version moves on the board. */
let review

function followThread(c) {
  const checkout = threadCheckoutOf(c)
  const item = threadItem(c)
  const key = `${c.project}/${checkout}@${item?.modifiedAt ?? 'none'}`
  if (review?.key === key) return
  const same = review?.project === c.project && review.checkout === checkout
  review = { key, project: c.project, checkout, thread: !item ? { checkout, messages: [] } : same ? review.thread : undefined }
  if (!item) return
  told(tower.text(`collection/${c.project}/${REVIEWS}/${encodeURIComponent(item.id)}`)).then((text) => {
    if (text === undefined || review?.key !== key) return
    review.thread = parseThread(text)
    render()
  })
}

const threadOf = (c) => (review?.project === c.project && review.checkout === threadCheckoutOf(c) ? review.thread : undefined)

/** What the worker hasn't seen of its checkout's thread, else how many notes it holds. */
const reviewsTally = (c) => {
  const notes = floorOf(c.project).threads.find((t) => t.checkout === threadCheckoutOf(c))?.messages
  return c.unseen ? `<small class="unseen" title="${plural(c.unseen, 'note')} ${callsign(c.id)} hasn't seen">${c.unseen} new</small>` : notes ? `<small>${notes}</small>` : ''
}

async function addNote(c, fields) {
  const reply = await told(tower.call('review/append', { project: c.project, checkout: threadCheckoutOf(c), author: board.user.name, ...fields }))
  if (reply) toast(`n${reply.n} is on the thread of ${threadCheckoutOf(c)}`)
  return reply
}

async function addPicked() {
  if (!(await addNote(findCard(selected), { anchors: [pickAnchor(changes.repos, pick)], body: pickText }))) return
  dropPick()
  drawChanges()
}

/** The reviews pane's composer: the note being written on each checkout, by `<project>/<checkout>`, and the note it answers. */
const noteDrafts = new Map()
const draftKey = (c) => `${c.project}/${threadCheckoutOf(c)}`
let noteRe

async function addWritten() {
  const c = findCard(selected)
  if (!(await addNote(c, { re: noteRe, body: noteDrafts.get(draftKey(c)) ?? '' }))) return
  noteDrafts.delete(draftKey(c))
  noteRe = undefined
  render()
}

/** The worker the viewer picked to send each checkout's notes to, by `<project>/<checkout>`; this page only. */
const sendPicks = new Map()
const sendTarget = (c) => {
  const targets = sendTargets(floorOf(c.project), threadCheckoutOf(c))
  return targets.find((t) => t.id === sendPicks.get(`${c.project}/${threadCheckoutOf(c)}`)) ?? targets.find((t) => t.checkout === threadCheckoutOf(c))
}

function sendNotes(c) {
  const target = sendTarget(c)
  const thread = threadOf(c)
  const text = sendText(THE_USER, threadCheckoutOf(c), thread ? unseenBy(thread, target.callsign).map((m) => m.n) : [])
  told(tower.run(target.calls.submit, { text })).then((r) => r && toast(`Sent ${target.callsign} to the thread of ${threadCheckoutOf(c)}`))
}

const threadView = (c) => ({
  checkout: threadCheckoutOf(c), tag: threadItem(c)?.tag, thread: threadOf(c), reader: c, changes: changes?.id === c.id ? changes.repos : undefined,
  targets: sendTargets(floorOf(c.project), threadCheckoutOf(c)), target: sendTarget(c), re: noteRe, user: board.user.name,
  files: threadFiles(floorOf(c.project), threadCheckoutOf(c)),
})

const drawReviews = (c) => drawPanel($('reviews'), reviewsHtml(threadView(c)), { 'note-text': noteDrafts.get(draftKey(c)) ?? '' })

function replyTo(n) {
  noteRe = n
  render()
  $('reviews').querySelector('[data-note-text]')?.focus()
}

/** An anchor's lines in the Changes pane: its file unfolded, scrolled to once drawn. */
let jump

function showAnchor(value) {
  jump = anchorOf(threadOf(findCard(selected)), value)
  showPane('changes')
}

function jumpToAnchor() {
  const a = jump
  jump = undefined
  const spot = anchorSpot(changes.repos, a)
  if (!spot) return toast(`${a.repo}:${a.path} has no changes now`)
  if (isFolded(changes, folds, spot.repo, spot.file)) toggleFold(spot.key)
  $('changes').querySelector(spotSelector(spot))?.scrollIntoView({ block: spot.row === -1 ? 'start' : 'center' })
}

/** A thread opened from the sidebar, on the worker most recently in its checkout. */
function openThread(project, checkout) {
  const c = workerIn(floorOf(project), checkout)
  if (!c) return toast(`No worker has worked in ${checkout}`)
  select(c.id)
  showPane('reviews')
}

/** A page that can't be shown in place: one click opens it, since a browser opens no tab by itself. */
function showLink(c, s) {
  $('shown').firstChild.srcdoc = `<!doctype html><html data-scheme="${scheme()}"><meta charset="utf-8"><base target="_blank"><link rel="stylesheet" href="/design.css"><style>${documentCss}${BRIEF_CSS}</style>
    <article><h4>${esc(callsign(c.id))} asks you to open</h4><h2>${esc(shownTitle(s))}</h2><p><code>${esc(s.target)}</code></p>
    <p><a href="${esc(s.target)}" rel="noreferrer"><b>Open ↗</b></a></p></article>`
}

function showPane(pane) {
  paneChoice = pane
  if (pane === 'brief') term?.blur()
  render()
}

const BRIEF_CSS = `article { max-width: 980px; margin: 0; padding: 14px 28px 48px; }`

/**
 * The session's conversations latest first, then each earlier session of its worker folded, and in each conversation
 * its last turns, latest first. Prompts and answers are markdown, rendered with their raw HTML escaped, in a frame where nothing can run; the page
 * reads the frame's document, so a redraw keeps the folds the viewer opened and where they had scrolled.
 */
function showBrief(c, threads) {
  const frame = $('brief-doc')
  const drawn = frame.dataset.worker === c.id ? frame.contentDocument : undefined
  const scrolled = drawn?.scrollingElement?.scrollTop ?? 0
  frame.dataset.worker = c.id
  const promptBy = (id) => c.conversations.find((conv) => conv.id === id)?.promptBy
  frame.addEventListener('load', () => frame.contentDocument.scrollingElement.scrollTo(0, scrolled), { once: true })
  frame.srcdoc = `<!doctype html><html data-scheme="${scheme()}"><meta charset="utf-8"><base target="_blank"><link rel="stylesheet" href="/design.css"><style>${documentCss}${BRIEF_CSS}${briefCss}</style>
    <article>${briefHtml({ briefs: threads, said: markdownHtml, promptBy, open: openFolds(drawn) })}</article>`
}

/**
 * The sidebar shows the floors or the stats, kept in `tower.store`. The stats open on the floor in view (the selected
 * worker's, the open shelf's, archive's or draft's, else the top floor), with every floor's beside it; read again
 * every minute while shown.
 */
let sideView = (await tower.store.get('side.view')) ?? 'floors'
const statsView = { stats: undefined, at: undefined, range: (await tower.store.get('stats.range')) ?? 'week', all: false, reading: 0 }
const STATS_POLL_MS = 60_000
let statsPoll

const floorInView = () =>
  findCard(selected)?.project ?? shelfOpen?.project ?? archiveOpen?.project ?? draftOpen?.project ?? floorsTopDown()[0]?.id

function drawSideView() {
  document.querySelector('.side').classList.toggle('on-stats', sideView === 'stats')
