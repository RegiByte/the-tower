<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tower</title>
<link rel="stylesheet" href="/xterm.css">
<link rel="stylesheet" href="/design.css">
<script src="/tower.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overscroll-behavior: none; }
body { display: grid; grid-template-columns: min(20rem, 38vw) minmax(0, 1fr); background: var(--wall); color: var(--ink); font: var(--fs-l)/1.45 var(--ui);
  -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; font-weight: 700; font-size: var(--fs-m); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: var(--sp-xs) var(--sp-l); cursor: pointer; transition: border-color .15s ease-out, background .15s ease-out; }
button:hover { border-color: var(--deco); }
button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button.danger:hover { border-color: var(--broken); color: var(--broken-text); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); }
.display { font-family: var(--display); font-weight: 800; }
@keyframes beacon { 0%, 60%, 100% { opacity: .2; } 70%, 85% { opacity: 1; } }
kbd { font: 700 var(--fs-xs)/1 var(--mono); padding: var(--sp-2xs) var(--sp-xs); border-radius: var(--radius-s); background: var(--ink); color: var(--panel); }

.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: var(--sp-xs); padding: var(--sp-xl) var(--sp-l) var(--sp-l) var(--sp-xl); white-space: nowrap; }
.brand h1 { margin: 0; font: 900 var(--fs-2xl)/1 var(--display); text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
.brand .host { margin: 0 var(--sp-2xs) 0 auto; display: flex; }
.host-state { display: inline-flex; align-items: center; gap: var(--sp-xs); padding: 1px var(--sp-m) 1px var(--sp-s); border-radius: var(--radius-pill); font-size: var(--fs-xs); font-weight: 700; color: var(--c); }
.host-state.quiet { padding: 1px var(--sp-2xs); font-weight: 400; color: var(--faint); }
.host-state.working, .host-state.broken { background: var(--c); color: var(--on); }
.host-state.working .lamp, .host-state.broken .lamp { background: var(--on); }
.brand .icon-btn:has(+ :popover-open) { color: var(--ink); }
.side-notes { margin-top: calc(-1 * var(--sp-xs)); padding: 0 var(--sp-xl) var(--sp-l); color: var(--muted); font-size: var(--fs-s); overflow-wrap: anywhere; }
.side-notes:empty { display: none; }
.side-notes .untested { white-space: normal; }
.tally { display: flex; gap: var(--sp-s); flex-wrap: wrap; padding: 0 var(--sp-xl) var(--sp-l); }
.limits { display: grid; gap: var(--sp-m); padding: var(--sp-2xs) var(--sp-xl) var(--sp-xl); border-bottom: 1px solid var(--line); font-size: var(--fs-s); color: var(--muted); }
.limits .row { display: flex; gap: var(--sp-s); align-items: baseline; margin-bottom: var(--sp-xs); }
.limits .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
.limits .row small { margin-left: auto; color: var(--faint); font-size: var(--fs-s); }
.limits .asof { color: var(--faint); }
.limits:has(.asof.stale) > div { opacity: .5; }
.limits .asof.stale { color: var(--ink); }
.side-views { display: flex; gap: var(--sp-xs); padding: var(--sp-m) var(--sp-xl); border-bottom: 1px solid var(--line); }
.side-views button { min-height: var(--control); padding: 0 var(--sp-m); border-color: transparent; background: none; color: var(--muted); }
.stats-side { display: none; flex: 1; overflow-y: auto; padding: 0 var(--sp-xl) var(--sp-xl); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.side.on-stats .stats-side { display: block; } .side.on-stats .floors { display: none; }
.floors { flex: 1; overflow-y: auto; padding: var(--sp-l) var(--sp-xl) var(--sp-xl); display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: var(--sp-xl);
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.floor { --pt: color-mix(in oklab, var(--p, var(--ink)) var(--p-text-mix), var(--ink)); --pw: color-mix(in oklab, var(--p, var(--deco)) var(--p-wash-mix), var(--panel)); }
.sign button { margin-left: auto; min-width: var(--control); min-height: var(--control); padding: 0; display: grid; place-items: center; }
.sign button + button { margin-left: var(--sp-xs); }
.sign button.new-draft { color: var(--muted); }
.sign button .icon { width: var(--icon-m); height: var(--icon-m); }
.dirs { padding: var(--sp-s) 0 0; }
.dir { display: flex; align-items: center; gap: var(--sp-xs); padding: 1px var(--sp-s); font-size: var(--fs-s); color: var(--muted); border-radius: var(--radius); }
.dir:hover { background: var(--panel-2); }
.dir .dname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dir .dname .icon { margin-right: var(--sp-2xs); }
.shelf { display: flex; flex-wrap: wrap; gap: var(--sp-xs); padding: var(--sp-s) 0 0; }
.shelf button, .shelf a { padding: var(--sp-2xs) var(--sp-m); font-size: var(--fs-xs); font-weight: 700; border-radius: var(--radius-pill); background: var(--pw); color: var(--pt); border: 1px solid transparent;
  text-decoration: none; line-height: 1.45; }
.shelf button:hover, .shelf a:hover { border-color: color-mix(in oklab, var(--pt) 40%, transparent); }
.shelf button.sel { background: var(--pt); color: var(--panel); }
.drafts { padding: var(--sp-m) 0 0; }
.drafts-head { display: flex; align-items: center; padding: 0 var(--sp-2xs) 0 var(--sp-m); }
.drafts-head button { margin-left: auto; background: none; border: none; padding: 0 var(--sp-s); color: var(--faint); font: 400 var(--fs-xl) var(--ui); }
.drafts-head button:hover { color: var(--ink); }
.drafts-head button.tidy-all { min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); }
.drafts-head button.tidy-all:hover { border-color: var(--faint); }
.drafts-about { padding: var(--sp-2xs) var(--sp-m) var(--sp-xs); color: var(--faint); font-size: var(--fs-xs); line-height: 1.35; }
.draft { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-s); padding: var(--sp-xs) var(--sp-m); border-radius: var(--radius); font-size: var(--fs-s); color: var(--muted); cursor: pointer; white-space: nowrap; }
.draft .t { overflow: hidden; text-overflow: ellipsis; }
.draft .meta { grid-column: 2; overflow: hidden; text-overflow: ellipsis; color: var(--faint); font: var(--fs-xs)/1.4 var(--mono); letter-spacing: .02em; }
.draft:hover, .draft.sel { background: var(--panel-2); color: var(--ink); }
.draft.sel { box-shadow: inset 3px 0 0 var(--p, var(--ink)); }
.draft > .icon { align-self: center; color: var(--muted); }
button.draft { width: 100%; border: none; background: none; font-weight: 400; text-align: left; }
.kept-fold { display: flex; align-items: center; gap: var(--sp-xs); min-height: var(--control); margin: var(--sp-xs) 0 0; padding: 0 var(--sp-m); border: none; background: none; color: var(--faint); font-size: var(--fs-xs); font-weight: 700; letter-spacing: .04em; }
.kept-fold:hover { color: var(--ink); }
:is(.kept-fold, .gone-home)[aria-expanded='false'] .icon { rotate: -90deg; }
.worktrees { padding: var(--sp-m) 0 0; }
.wt { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-s); padding: var(--sp-2xs) var(--sp-xs) var(--sp-2xs) var(--sp-m); border-radius: var(--radius); font-size: var(--fs-s); color: var(--muted); }
.wt .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt .n b { color: var(--ink); font-weight: 700; }
.wt .who-line { flex-basis: 100%; padding-left: var(--sp-l); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wt .who { font-weight: 700; color: var(--ink); text-decoration: none; }
.wt .who:hover { text-decoration: underline; }
.wt .st { flex: none; font-size: var(--fs-xs); letter-spacing: .04em; color: var(--faint); }
.wt.at-risk .st, .wt.lost .st { color: var(--needs-text); }
.wt button { flex: none; min-height: var(--control); }
.wt button:not(.icon-btn) { padding: 0 var(--sp-m); font-size: var(--fs-xs); }
.sess .branch { color: var(--faint); font: var(--fs-xs)/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sessions { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-s); padding: var(--sp-m) 0 0; }
.sess { position: relative; padding: var(--sp-m) var(--sp-l); border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line);
  border-left: 4px solid var(--c); cursor: pointer; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.sess:hover { box-shadow: var(--shadow); }
.sess.waits { border-color: var(--c); background: color-mix(in oklab, var(--c) 8%, var(--panel)); }
:is(.sess.sel, .pane-tab.on, .tab.open, .tray.on, .side-views button.on) { color: var(--ink); border-color: var(--ink); box-shadow: var(--selected); }
.floors .sess.sel { border-left-color: var(--c); }
.sess .top { display: flex; align-items: center; gap: var(--sp-m); }
.sess .call, .past .call { color: inherit; text-decoration: none; }
.sess .call { font: 800 var(--fs-m)/1 var(--display); letter-spacing: .04em; white-space: nowrap; }
.sess .st { margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.sess:is(.needs, .broken, .working, .ready) .st { color: var(--c-text); }
.sess .st.stuck, .pill.stuck { color: var(--needs-text); }
.sess .line { margin-top: var(--sp-xs); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: var(--fs-s); }
.tool { color: var(--ink); } .tool b { font-weight: 700; }
.sess .act { margin-top: var(--sp-s); display: flex; gap: var(--sp-s); }
.crew { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-s); margin-left: var(--sp-l); padding-left: var(--sp-m); border-left: 2px solid var(--line); }
.sess.gone { opacity: .55; }
.gone-home { justify-self: start; display: inline-flex; align-items: center; gap: var(--sp-xs); min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-xs); font-weight: 400; color: var(--muted); background: none; border-color: transparent; }
.gone-home:hover { color: var(--ink); }
.sess.gone:hover, .sess.gone.sel { opacity: 1; }
.sess .act button { min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-s); }
.unresumable { color: var(--faint); font-size: var(--fs-s); white-space: nowrap; }
.empty { color: var(--faint); font-style: italic; font-size: var(--fs-s); padding: var(--sp-2xs) var(--sp-m); }
.trays { display: flex; flex-wrap: wrap; gap: var(--sp-xs); padding: var(--sp-m) 0 0; }
.tray { min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-xs); font-weight: 400; color: var(--muted); background: none; white-space: nowrap; }
.tray b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tray i { font-style: normal; font-weight: 700; color: var(--needs-text); }
.tray:hover { color: var(--ink); }
.archive { display: grid; grid-template-columns: minmax(0, 1fr); grid-auto-rows: max-content; align-content: start; gap: var(--sp-2xs); }
.archive-view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp-m); }
.main:not(.archived) .archive-view, .main.archived .bar, .main.archived .screen { display: none; }
.archive-view .archive { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-m); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.archive-view .past { padding: var(--sp-s) var(--sp-l); font-size: var(--fs-m); }
.archive-view .past .call { font-size: var(--fs-m); }
.archive .crew { gap: var(--sp-2xs); }
#archive-filter { flex: 1; min-width: 120px; max-width: 420px; padding: var(--sp-xs) var(--sp-l); font: var(--fs-m) var(--ui); color: var(--ink); background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: var(--radius); }
#archive-filter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.past { overflow: hidden; padding: var(--sp-xs) var(--sp-m); border-radius: var(--radius); font-size: var(--fs-s); color: var(--muted); cursor: pointer; }
.past:hover, .past.sel { background: var(--panel-2); color: var(--ink); }
.past .head { display: flex; align-items: center; gap: var(--sp-m); }
.past .call { font: 800 var(--fs-s)/1 var(--display); letter-spacing: .04em; color: var(--ink); }
.past .when { color: var(--faint); white-space: nowrap; }
.past .head .when { margin-left: auto; }
.past .conv { display: flex; align-items: center; gap: var(--sp-s); padding-left: var(--sp-xl); }
.past .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.past button:not(.icon-btn) { min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-s); }
.said { color: var(--faint); }
.side-foot { display: flex; align-items: center; gap: var(--sp-s); margin-top: auto; padding: var(--sp-s) var(--sp-xl); border-top: 1px solid var(--line); color: var(--faint); font-size: var(--fs-xs); }
.side-renderers { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-xs) var(--sp-l); padding: 0 var(--sp-xl) var(--sp-m); color: var(--faint); font-size: var(--fs-xs); }
.side-renderers b { color: var(--ink); }
.side-renderers a { color: var(--muted); text-decoration: none; }
.side-renderers a:hover { color: var(--ink); }
.side-foot code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--fs-xs) var(--mono); direction: rtl; text-align: left; }
.main { grid-column: 2; }
.rail { display: none; flex-direction: column; align-items: center; gap: var(--sp-l); padding: var(--sp-l) 0; overflow-y: auto; scrollbar-width: none; }
@media (min-width: 901px) {
  body.collapsed { grid-template-columns: 44px minmax(0, 1fr); }
  body.collapsed .side > :not(.rail) { display: none; }
  body.collapsed .rail { display: flex; }
}
@media (max-width: 900px) {
  body { grid-template-columns: 44px minmax(0, 1fr); }
  body:not(.drawer) .side > :not(.rail) { display: none; }
  body:not(.drawer) .rail { display: flex; }
  body.drawer .side { position: fixed; z-index: 15; inset: 0 auto 0 0; width: min(20rem, calc(100vw - 44px)); box-shadow: var(--shadow-pop); }
}
@media (max-width: 900px), (max-height: 560px) {
  .side { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .side :is(.floors, .stats-side) { flex: none; overflow: visible; }
}
.rail .count { display: grid; place-items: center; min-width: 20px; min-height: 20px; border-radius: var(--radius-pill); background: var(--c); color: var(--on); font-weight: 700; font-size: var(--fs-xs); }
.rail .lamp { width: 11px; height: 11px; cursor: pointer; }
.rail .lamp.sel { outline: 2px solid var(--ink); outline-offset: 3px; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: var(--sp-m) var(--sp-xl); align-items: baseline; color: var(--muted); font-size: var(--fs-m); }
.keys.legend > span:nth-child(odd), .keys > .chords { white-space: nowrap; color: var(--faint); font-size: var(--fs-s); }
.keys > h3 { grid-column: 1 / -1; margin: var(--sp-l) 0 0; }
.keys > h3:first-child { margin-top: 0; }
dialog h2.legend-head { margin-top: var(--sp-2xl); }
.keys.legend > .chip { justify-self: start; color: var(--ink); }
dialog#keys { width: min(620px, 92vw); }
dialog#landing { width: min(960px, 94vw); }

.main { position: relative; display: flex; flex-direction: column; gap: var(--sp-m); min-width: 0; min-height: 0; padding: var(--sp-xl) var(--sp-xl) 0; }
.bar { flex: none; padding: var(--sp-m) var(--sp-xl); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.bar-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-s) var(--sp-l); }
#bar-info { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-xs) var(--sp-l); min-width: 0; flex: 1 1 20rem; white-space: nowrap; color: var(--muted); font-size: var(--fs-s); }
#bar-info .call { flex: none; font: 800 var(--fs-2xl)/1 var(--display); letter-spacing: .04em; color: var(--ink); }
#bar-info .pill { flex: none; }
#bar-info .where { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#bar-info .stats { flex: none; margin-left: auto; display: flex; align-items: center; gap: var(--sp-l); }
.untested { color: var(--muted); font-size: var(--fs-s); text-decoration: underline dotted; cursor: help; white-space: nowrap; }
#bar-info b { color: var(--ink); font-variant-numeric: tabular-nums; }
#bar-info .meter { width: 56px; --fill: var(--working); }
#bar-info .ports { color: var(--ink); cursor: pointer; font-family: var(--mono); font-size: var(--fs-xs); padding: 1px var(--sp-s); border: 0; border-radius: var(--radius); background: var(--panel-2); }
#bar-info .ports.orphan { color: var(--on-broken); background: var(--broken); }
#bar-actions { flex: none; display: flex; gap: var(--sp-s); margin-left: auto; }
#bar-actions .icon-btn { aspect-ratio: 1; }
#c-mode { position: absolute; top: 8px; right: 12px; z-index: 1; padding: var(--sp-2xs) var(--sp-m); border-radius: var(--radius-pill); background: var(--panel); color: var(--muted); font-size: var(--fs-s);
  box-shadow: var(--shadow); pointer-events: none; }
#c-mode:empty, #c-mode.owner, .main.on-brief #c-mode, .main.on-shown #c-mode, .main.on-changes #c-mode, .main.on-reviews #c-mode { display: none; }
#bar-line { gap: var(--sp-s); margin-top: var(--sp-m); color: var(--muted); font-size: var(--fs-m); white-space: nowrap; }
.dismiss { color: var(--needs-text); }
#bar-line .moves { gap: var(--sp-s); }
#bar-line .activity { overflow: hidden; text-overflow: ellipsis; text-align: left; min-height: var(--control); padding: 0 var(--sp-m); margin-left: var(--sp-s); background: none; border-color: transparent;
  color: var(--muted); font: var(--fs-s)/1.6 var(--mono); }
#bar-line .activity:hover { border-color: var(--line); }
#bar-line .activity .tool b { font-family: var(--ui); }
.move { flex: none; display: flex; align-items: center; gap: var(--sp-s); min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-xs); font-weight: 400; color: var(--muted); background: none; }
.move .call { font: 800 var(--fs-xs)/1 var(--display); letter-spacing: .04em; color: var(--ink); }
.move small { font: var(--fs-xs) var(--mono); color: var(--faint); }
.move.waiting { border-color: var(--c); }
#bar-details, #bar-left { margin: 0; inset: 100px 20px auto auto; width: min(620px, 90vw); max-height: 70vh; overflow: auto; padding: var(--sp-l) var(--sp-xl) var(--sp-xl); background: var(--panel); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-pop); }
#bar-details h3, #bar-left h3 { margin: 0 0 var(--sp-l); font: 800 var(--fs-l)/1 var(--display); letter-spacing: .04em; }
#bar-left .proc { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-xs) var(--sp-l); padding: var(--sp-s) 0; border-top: 1px solid var(--line); font-size: var(--fs-s); }
#bar-left .proc code { font-family: var(--mono); }
#bar-left .proc .on { color: var(--muted); font-family: var(--mono); }
#bar-left .proc .on.orphan { color: var(--broken-text); }
#bar-left .proc .cmd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); color: var(--muted); }
#bar-left .all { display: flex; justify-content: flex-end; padding-top: var(--sp-l); border-top: 1px solid var(--line); }
#bar-details dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp-xs) var(--sp-xl); margin: 0; font-size: var(--fs-s); }
#bar-details dt { color: var(--faint); }
#bar-details dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); }
.pane-tab { min-height: var(--control); padding: 0 var(--sp-m); font-size: var(--fs-s); color: var(--muted); background: none; }
.ask { display: none; align-items: center; gap: var(--sp-l); flex: none; padding: var(--sp-m) var(--sp-l) var(--sp-m) var(--sp-xl); border-radius: var(--radius); font-size: var(--fs-l);
  background: color-mix(in oklab, var(--needs) 11%, var(--panel)); border: 1px solid var(--needs); }

const callsign = (id) => findCard(id).callsign
const when = (ms) => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
const $ = (id) => document.getElementById(id)
/** The one value a framed shelf page keeps for itself (`tower.remember`); storage can be unavailable, and then nothing is kept. */
function remembered(key) {
  try { return localStorage.getItem(key) } catch { return null }
}
function remember(key, value) {
  try { localStorage.setItem(key, value) } catch {}
}

/** Why there is no live board, until the next board. */
let boardError
/** When the tower stopped answering, while it doesn't: the page's times stand still there, as its board does. */
let lostAt
const pageNow = () => lostAt ?? Date.now()
let board = { user: { name: 'user' }, keys: DEFAULT_KEYS, floors: [], waiting: [], rateLimits: [], hostUp: false, hostOutdated: false, claudeUntested: [], shells: [], termsUp: false }
/** The web page of each project directory's origin remote. */
let origins = {}
let selected
/** The sections a viewer unfolded under a floor's workers, by `<section>:<project>`, kept in `tower.store`. */
const unfolded = new Set((await tower.store.get('floors.unfolded')) ?? [])

function toggleSection(key) {
  if (!unfolded.delete(key)) unfolded.add(key)
  tower.store.set('floors.unfolded', [...unfolded])
  render()
}

const cards = () => board.floors.flatMap((f) => f.cards)
/** The project's color as `--p`, for an element's styles to use. */
const paint = (projectId) => {
  const color = board.floors.find((f) => f.id === projectId)?.color
  return color ? `--p:${esc(color)}` : ''
}
/** A card by id: on the board, else in an archive this page has read. */
const findCard = (id) => cards().find((c) => c.id === id) ?? [...archives.values()].flatMap((a) => a.cards ?? []).find((c) => c.id === id)

/** The floors' archives this page has read, by project: the `archiveKey` each was read at, and its cards once read. */
const archives = new Map()

/** Reads a floor's archive, keeping the cards read before until it lands; a read a later one overtook is dropped. */
function readArchive(project) {
  const reading = { key: archiveKey(board, floorOf(project)), cards: archives.get(project)?.cards }
  archives.set(project, reading)
  return tower.archive(project).then(
    (cards) => archives.get(project) === reading && ((reading.cards = cards), render()),
    (err) => archives.get(project) === reading && (reading.cards ? toast(`The archive of ${project} can't be read: ${err.message}`) : ((reading.failed = err.message), render())),
  )
}

/** Reads again every archive held whose floor's archive moved since. */
const freshArchives = () => {
  for (const [project, { key }] of archives) if (floorOf(project) && key !== archiveKey(board, floorOf(project))) readArchive(project)
}

/** A card by id, reading every floor's archive on a miss: for an id the board may have left out. */
async function lookUp(id) {
  if (!findCard(id)) await Promise.all(board.floors.filter((f) => f.archived && !archives.get(f.id)?.cards).map((f) => readArchive(f.id)))
  return findCard(id)
}
/** The workers waiting on you that you heed, in the order to go to them. */
const waitsOnYou = () => heededWaits(board, heed).map((w) => findCard(w.id))
/** Top floor first, like an elevator panel. */
const floorsTopDown = () => [...board.floors].reverse()
const byStart = (a, b) => a.startedAt - b.startedAt

const sessionHtml = (c) => {
  return `<div class="sess ${lampOf(c)} ${c.waiting ? 'waits' : ''} ${c.id === selected ? 'sel' : ''} ${onDuty(c) ? '' : 'gone'}" data-id="${c.id}" data-hold="${c.id}">
    <div class="top"><span class="lamp"></span><a class="call" href="#${c.id}"${c.id === selected ? ' aria-current="true"' : ''}>${callsign(c.id)}</a><span class="st${c.stuck ? ' stuck' : ''}" data-tip="${esc(statusTitle(c))}">${statusName(c)} · <span data-since="${c.enteredAt}"></span>${c.stuck ? `<span class="sr-only">: ${esc(statusTitle(c))}</span>` : ''}</span></div>
    ${c.worktree ? `<div class="branch" data-tip="worktree ${esc(c.worktree.name)}: ${esc(c.cwd)}">${withIcons(esc([branchLine(c), pairLine(c)].filter(Boolean).join(' · ')))}</div>` : ''}
    <div class="line">${lineOf(c)}</div>
    ${can(c, 'resume') ? `<div class="act">${heldWhy('resume') ? heldHtml('resume', 'resume', `${ICON.resume} resume`) : `<button data-resume="${esc(JSON.stringify(c.calls.resume))}">${ICON.resume} resume</button>`}${letGoHtml(c, 'let go')}</div>` : c.unresumable ? `<div class="act">${unresumableHtml(c)}</div>` : ''}
  </div>`
}

/** Let a stranded worker go, asked first. */
const letGoHtml = (c, label) => !can(c, 'let-go') ? '' : heldWhy('let-go') ? heldHtml('let-go', label, label) : `<button data-let-go="${c.id}" data-tip="${esc(`let ${callsign(c.id)} go: ${LET_GO_MEANS}`)}">${label}</button>`

/** A worker and everyone under it. */
const wholeCrewHtml = (cards, c) => {
  const hires = hiresOf(cards, c)
  return sessionHtml(c) + (hires.length ? `<div class="crew">${hires.map((h) => wholeCrewHtml(cards, h)).join('')}</div>` : '')
}

/** A worker, the crew under it not gone home, and those gone home on one line that unfolds them (`crewFold`). */
const crewHtml = (cards, c) => {
  const { drawn, home, folded } = crewFold(cards, c)
  const open = crewsUnfolded.has(c.id)
  const fold = home.length
    ? `<button class="gone-home" data-crew-fold="${c.id}" data-hold="fold:${c.id}" aria-expanded="${open}">${ICON.caret} ${goneHomeLine(folded)}</button>${open ? home.map((h) => wholeCrewHtml(cards, h)).join('') : ''}`
    : ''
  const under = drawn.map((h) => crewHtml(cards, h)).join('') + fold
  return sessionHtml(c) + (under ? `<div class="crew">${under}</div>` : '')
}

/** The hirers whose gone-home crew this viewer unfolded, by card id, as `tower.store` keeps them. */
let crewsUnfolded = new Set()
async function readCrewFolds() {
  crewsUnfolded = new Set((await tower.store.get(CREWS_UNFOLDED_KEY)) ?? [])
}
function toggleCrewFold(id) {
  if (!crewsUnfolded.delete(id)) crewsUnfolded.add(id)
  crewsUnfolded = new Set([...crewsUnfolded].filter((h) => findCard(h)))
  tower.store.set(CREWS_UNFOLDED_KEY, [...crewsUnfolded])
  render()
}

/** Why a past worker can't be resumed, quietly: it is history, not an alarm. */
const unresumableHtml = (c) => `<span class="unresumable" data-tip="${esc(UNRESUMABLE_TITLE[c.unresumable])}">${UNRESUMABLE_NAME[c.unresumable]}</span>`

/** Why a daemon verb can't run now: the tower lost (its board is stale), or a daemon it needs down (`whyNot`). */
const heldWhy = (verb) => (lostAt ? HOST_MEANS.unknown : whyNot(board, verb))

/** A verb `heldWhy` holds back: drawn, inert, its tip saying why. */
const heldHtml = (verb, label, inner, cls = '') =>
  `<button class="held ${cls}" aria-disabled="true" aria-label="${esc(label)}" data-tip="${esc(heldWhy(verb))}">${inner}</button>`

const resumeHtml = (c, conv) => can(conv, 'resume')
  ? heldWhy('resume') ? heldHtml('resume', 'resume this conversation', ICON.resume, 'icon-btn') : `<button class="icon-btn" data-resume="${esc(JSON.stringify(conv.calls.resume))}" aria-label="resume this conversation" data-tip="resume this conversation">${ICON.resume}</button>`
  : can(conv, 'goto') ? `<span class="when">→ ${conv.resumedBy.callsign}</span>` : ''

const pastConversationHtml = (c, conv) =>
  `<div class="conv" data-tip="${esc(conv.prompt ? GIST_MARK.prompt + ' ' + conv.prompt : '')}${conv.answer ? '\n\n' + GIST_MARK.answer + ' ' + esc(conv.answer) : ''}">
    <span class="what">${conv.answer ? `<span class="said">${GIST_ICON.answer}</span> ` + esc(plain(conv.answer)) : conv.prompt ? `<span class="said">${GIST_ICON.prompt}</span> ` + esc(plain(conv.prompt)) : '<i>no prompt</i>'}</span>
    ${resumeHtml(c, conv)}</div>`

/** A past worker and the conversations it held, oldest first. */
const pastHtml = (c) =>
  `<div class="past ${c.attention} ${c.id === selected ? 'sel' : ''}" data-id="${c.id}">
    <div class="head" data-tip="${statusName(c)}"><span class="lamp"></span><a class="call" href="#${c.id}"${c.id === selected ? ' aria-current="true"' : ''}>${callsign(c.id)}</a><span class="when">${c.unresumable ? `${unresumableHtml(c)} · ` : ''}${when(c.startedAt)}</span></div>
    ${c.conversations.map((conv) => pastConversationHtml(c, conv)).join('') || '<div class="conv"><i class="what">no conversation</i></div>'}
  </div>`

const dirHtml = (f, dir, hub) =>
  `<div class="dir"><span class="dname" data-tip="${esc(dir)}">${hub ? ICON.hub : ICON.repo} ${esc(base(dir))}</span>
    ${heldWhy('shell') ? heldHtml('shell', `new shell in ${base(dir)}`, ICON.shell, 'icon-btn') : can(f, 'shell') ? `<button class="icon-btn" data-shell-project="${esc(f.id)}" data-shell-dir="${esc(dir)}" aria-label="new shell in ${esc(base(dir))}" data-tip="new shell in ${esc(dir)}">${ICON.shell}</button>` : ''}
    ${can(f, 'editor') ? `<button class="icon-btn" data-open="${esc(dir)}" data-open-project="${esc(f.id)}" aria-label="open ${esc(base(dir))} in your editor" data-tip="open ${esc(dir)} in a new window of your editor">${ICON.editor}</button>` : ''}
    ${origins[dir] ? `<a class="icon-btn" href="${esc(origins[dir])}" target="_blank" rel="noreferrer" aria-label="${esc(base(dir))} on the web" data-tip="${esc(origins[dir])}">${originIcon(origins[dir])}</a>` : ''}
  </div>`


/** A verb on a worktree or kept branch, its call on the button. */
const wtVerbHtml = (thing, verb) => verb === 'discard'
  ? `<button class="danger" data-discard="${esc(JSON.stringify(thing.calls.discard))}" data-wt-name="${esc(thing.name)}" data-tip="throw its work away: each tip is noted on its review thread first">${WORKTREE_VERB_NAME[verb]}</button>`
  : `<button data-wt-call="${esc(JSON.stringify(thing.calls[verb]))}" data-wt-verb="${verb}" data-wt-name="${esc(thing.name)}">${WORKTREE_VERB_NAME[verb]}</button>`

/** A button that opens what landing changed on a carried branch. */
const landingButtonHtml = (landing) =>
  `<button class="icon-btn" data-landing="${esc(JSON.stringify(landing))}" aria-label="what landing changed on ${esc(landing.branch)}" data-tip="what landing changed: git range-diff of each edited commit and its copy">${ICON.diff}</button>`

const worktreeHtml = (f, w) => {
  const risk = worktreeRisk(w)
  const where = w.repos[0].path
  const title = [`${w.repos.map((r) => r.path).join('\n')}`, ...risk, ...goneBases(w.repos), w.state === 'carried' ? carriedLine(w.repos) : '', w.sessions.length ? `in use by ${w.sessions.join(', ')}` : ''].filter(Boolean).join('\n')
  const workers = workersIn(f, w.name)
  const resumable = workers.find((c) => c.calls.resume)
  return `<div class="wt ${w.state}" data-tip="${esc(title)}"><span class="n"><b>${esc(w.name)}</b> ${ICON.branch} ${esc(worktreeBranch(w))}</span>
    <span class="st">${WORKTREE_STATE_NAME[w.state]}</span>
    ${w.state === 'carried' ? landingButtonHtml({ project: f.id, branch: worktreeBranch(w) }) : ''}
    ${!resumable ? '' : heldWhy('resume') ? heldHtml('resume', `resume ${resumable.callsign}`, ICON.resume, 'icon-btn') : `<button class="icon-btn" data-resume="${esc(JSON.stringify(resumable.calls.resume))}" aria-label="resume ${resumable.callsign}" data-tip="resume ${resumable.callsign}, its last worker">${ICON.resume}</button>`}
    ${w.verbs.map((v) => wtVerbHtml(w, v)).join('')}
    ${w.state === 'lost' ? '' : heldWhy('shell') ? heldHtml('shell', `new shell in ${w.name}`, ICON.shell, 'icon-btn') : can(f, 'shell') ? `<button class="icon-btn" data-shell-project="${esc(f.id)}" data-shell-dir="${esc(where)}" aria-label="new shell in ${esc(w.name)}" data-tip="new shell in ${esc(where)}">${ICON.shell}</button>` : ''}
    ${w.state !== 'lost' && can(f, 'editor') ? `<button class="icon-btn" data-open="${esc(where)}" data-open-project="${esc(f.id)}" aria-label="open ${esc(w.name)} in your editor" data-tip="open ${esc(where)} in a new window of your editor">${ICON.editor}</button>` : ''}
    ${workers.length ? `<span class="who-line">${workers.map((c) => `<a class="who" href="#${c.id}" data-tip="${esc(`${c.callsign} · ${statusName(c)}`)}">${c.callsign}</a> <span>${esc(statusName(c))}</span>`).join(' · ')}</span>` : ''}
  </div>`
}

const keptBranchHtml = (b) =>
  `<div class="wt" data-tip="${esc(keptBranchLines(b).join('\n'))}">
    <span class="n">${ICON.branch} ${esc(b.name)}</span><span class="st">${b.absorbed ? 'merged' : b.carried ? 'landed, edited' : 'kept'}</span>${b.carried ? landingButtonHtml({ project: f.id, branch: b.name }) : ''}${b.verbs.map((v) => wtVerbHtml(b, v)).join('')}</div>`

/** The floor's worktrees and the branches the tower kept. */
const worktreesHtml = (f) => `<div class="worktrees">
    <div class="drafts-head eyebrow">Worktrees</div>
    ${f.worktrees.map((w) => worktreeHtml(f, w)).join('')}${f.branches.map(keptBranchHtml).join('')}</div>`

/** A floor's review threads, each named by its checkout beside its tag, and the threads Tidy filed once their work landed, folded. */
const threadsHtml = (f) => {
  const rows = f.threads.map((t) => {
    const meta = [t.tag, plural(t.messages, 'note'), t.last && `last ${t.last.author}`, t.landed && 'landed'].filter(Boolean).join(' · ')
    return `<button class="draft thread" data-thread="${esc(f.id)}|${esc(t.checkout)}" data-tip="${esc(`${t.id}${t.last ? `\nn${t.last.n} by ${t.last.author}, ${t.last.at}` : ''}`)}">${ICON.thread}<span class="t">${esc(t.checkout)}</span><span class="meta">${esc(meta)}</span></button>`
  })
  const landed = landedOf(f)
  const fold = `landed:${f.id}`
  const filed = !landed.length ? '' : `<button class="kept-fold" data-section="${fold}" aria-expanded="${unfolded.has(fold)}" data-tip="threads Tidy filed once their work landed: read them here">${ICON.caret} ${landed.length} landed</button>
    ${unfolded.has(fold) ? landed.map((t) => `<button class="kept-row ${isOpenItem(f.id, REVIEWS, t.id) ? 'sel' : ''}" data-kept="${esc(keptKey(f.id, REVIEWS, t.id))}" data-tip="${esc(t.id)}"><span class="t">${esc(t.checkout)}</span><span class="meta">${esc(`${t.tag} · landed ${t.landed}`)}</span></button>`).join('') : ''}`
  return `<div class="drafts"><div class="drafts-head eyebrow">Review threads</div>${rows.join('') || '<div class="empty">none open</div>'}${filed}</div>`
}

/** The threads Tidy filed in the floor's reviews collection, the one filed last first. */
const landedOf = (f) => landedThreads(f.collections.find((c) => c.id === REVIEWS)?.items ?? [])

/**
 * Everything the floor's Tidy would do, listed before the press, which applies the list as shown; then what landed
 * edited, each removed by its own press only.
 */
const tidyHtml = (f) => `<div class="worktrees">
    ${can(f, 'tidy') ? `<div class="drafts-head eyebrow">${esc(tidyLine(f.tidy))}<button class="tidy-all" data-tidy="${f.id}" data-tip="do all of it, as listed">Tidy all</button></div>
    ${tidyRows(f, Date.now()).map(tidyRowHtml).join('')}` : ''}
    ${editedRows(f).length ? `<div class="drafts-head eyebrow" data-tip="landed as copies, some edited on the way: not in Tidy all, look first and remove each on its own">landed edited</div>${editedRows(f).map(editedRowHtml).join('')}` : ''}</div>`

/** A worktree or kept branch that landed edited: what landing changed, and a press that removes only it. */
const editedRowHtml = (r) => `<div class="wt" data-tip="${esc(r.title)}"><span class="n"><b>${withIcons(esc(r.what))}</b></span><span class="st">${esc(r.does)}</span>
    ${landingButtonHtml(r.landing)}
    <button class="icon-btn" data-wt-call="${esc(JSON.stringify(r.call))}" data-wt-verb="${r.call[0] === 'branch/delete' ? 'delete' : 'remove'}" data-wt-name="${esc(r.what.replace(/^⎇ /, ''))}" aria-label="${esc(`remove ${r.what}`)}" data-tip="remove only this, after looking at what landing changed">${ICON.tidy}</button></div>`

/** One thing Tidy would do, with a button that does only it. */
const tidyRowHtml = (r) => `<div class="wt" data-tip="${esc(r.title)}"><span class="n"><b>${withIcons(esc(r.what))}</b></span><span class="st">${esc(r.does)}</span>
    <button class="icon-btn" data-tidy-call="${esc(JSON.stringify(r.call))}" data-tidy-ask="${esc(tidyRowAsk(r))}" aria-label="${esc(`${r.does}: ${r.what}`)}" data-tip="${esc(`only this: ${r.does}`)}">${ICON.tidy}</button></div>`


const shelfEntryHtml = (f, entry, n) => shelfKind(entry) === 'link'
  ? `<a href="${esc(entry.link)}" target="_blank" rel="noreferrer" data-tip="${esc(entry.link)}">${SHELF_ICON.link} ${esc(entry.label)}</a>`
  : `<button class="${shelfOpen?.project === f.id && shelfOpen.n === n ? 'sel' : ''}" data-shelf="${f.id}" data-n="${n}" data-tip="${esc(shelfSource(entry))}">${SHELF_ICON[shelfKind(entry)]} ${esc(entry.label)}</button>`

const shelfHtml = (f) => !f.shelf?.length ? '' : `<div class="shelf">${f.shelf.map((entry, n) => shelfEntryHtml(f, entry, n)).join('')}</div>`

/** The drafts collection's reads and writes, over the page's routes. */
const draftIo = {
  call: tower.call,
  read: (project, id) => tower.text(draftPath(project, id)),
  failed: (err) => toast(err.message),
}
const { title: draftTitle, prune: pruneDraftTitles } = draftTitles(draftIo.read, () => render())

const draftsHtml = (f) =>
  collectionTrayHtml(f.id, draftsOf(f), (item) => draftTitle(f.id, item), draftOpen?.project === f.id ? draftOpen.id : undefined, Date.now(),
    `<button data-new-draft="${f.id}" aria-label="new draft" data-tip="new draft">${ICON.plus}</button>`)

/** Every other collection's items, titled from their text where their type names itself; a row opens the item in the main pane. */
const { title: keptTitle, prune: pruneKeptTitles } = keptTitles((project, collection, id) => tower.text(itemPath(project, collection, id)), () => render())
const isOpenItem = (project, collection, id) => itemOpen?.project === project && itemOpen.collection === collection && itemOpen.id === id
const keptHtml = (f, c) => collectionTrayHtml(f.id, c, (item) => keptTitle(f.id, c.id, item), itemOpen?.project === f.id && itemOpen.collection === c.id ? itemOpen.id : undefined, Date.now())

/** The collections a floor shows as trays of their own: drafts and review threads have theirs. */
const keptCollections = (f) => f.collections.filter((c) => c.id !== DRAFTS && c.id !== REVIEWS && c.items.length)

/**
 * What a floor keeps beside its workers, folded to one row of counts so the workers stay in sight: drafts,
 * worktrees, threads and what Tidy would do unfold under it, the archive opens in the main pane. Worktrees that would lose work say so folded.
 */
function traysHtml(f) {
  const drafts = draftsOf(f)
  const trees = f.worktrees.length + f.branches.length
  const atRisk = risky(f)
  const past = pastCount(f)
  const threads = f.threads.length
  const landed = landedOf(f).length
  const kept = keptCollections(f)
  const edited = editedRows(f).length
  const tidy = can(f, 'tidy') || edited > 0
  const stranded = strandedOf(f).length
  const tray = (key, label, title) => `<button class="tray ${unfolded.has(`${key}:${f.id}`) ? 'on' : ''}" data-section="${key}:${f.id}" aria-expanded="${unfolded.has(`${key}:${f.id}`)}" data-tip="${title}">${label}</button>`
  const trays = [
    drafts?.items.length && tray('drafts', `${ICON.draft} <b>${drafts.items.length}</b> in ${esc(drafts.label.toLowerCase())}`, esc(drafts.description ?? 'prompts kept for later')),
    trees && tray('worktrees', `${ICON.branch} <b>${trees}</b> ${noun(trees, 'worktree')}${atRisk ? ` <i>${atRisk} at risk</i>` : ''}`, 'worktrees and the branches the tower kept'),
    (threads || landed) && tray('threads', `${ICON.thread} <b>${threads}</b> ${noun(threads, 'thread')}${landed ? `, ${landed} landed` : ''}`, 'review threads, one per checkout: notes from you, its workers and reviewers'),
    ...kept.map((c) => tray(`kept-${c.id}`, `${ICON.collection} <b>${c.items.length}</b> in ${esc(c.label.toLowerCase())}`, esc(c.description ?? `items kept in ${c.label}`))),
    stranded && (heldWhy('resume') ? heldHtml('resume', `resume all ${stranded} stranded`, `${ICON.resume} resume all <b>${stranded}</b> stranded`, 'tray') : `<button class="tray" data-resume-all="${f.id}" data-tip="resume every worker the host stopped or lost: asked first, listing them">${ICON.resume} resume all <b>${stranded}</b> stranded</button>`),
    past && `<button class="tray ${archiveOpen?.project === f.id ? 'on' : ''}" data-archive="${f.id}" aria-pressed="${archiveOpen?.project === f.id}" data-tip="past workers and their conversations, in the main pane">${ICON.archive} <b>${past}</b> archived</button>`,
    tidy && tray('tidy', `${ICON.tidy} ${esc(can(f, 'tidy') ? tidyLine(f.tidy) : 'Tidy')}${edited ? `, ${edited} landed edited` : ''}`, 'what Tidy would do: unfold it to see the list before you press'),
  ].filter(Boolean)
  if (!trays.length) return ''
  return `<div class="trays">${trays.join('')}</div>
    ${drafts?.items.length && unfolded.has(`drafts:${f.id}`) ? draftsHtml(f) : ''}${kept.filter((c) => unfolded.has(`kept-${c.id}:${f.id}`)).map((c) => keptHtml(f, c)).join('')}${trees && unfolded.has(`worktrees:${f.id}`) ? worktreesHtml(f) : ''}${(threads || landed) && unfolded.has(`threads:${f.id}`) ? threadsHtml(f) : ''}${tidy && unfolded.has(`tidy:${f.id}`) ? tidyHtml(f) : ''}`
}

/** A floor's sign: its number on the project's band, its name in caps. */
const signHtml = (n, name, extra = '') =>
  `<div class="sign"><span class="num">${String(n).padStart(2, '0')}</span><span class="name" role="heading" aria-level="2">${esc(name)}</span>${extra}</div>`

const floorHtml = (f, i, all) => {
  const heads = crewTree(f.cards).filter(({ depth }) => depth === 0).map(({ card }) => card)
  return `<section class="floor" style="${paint(f.id)}" data-hold="floor:${esc(f.id)}">
    ${signHtml(all.length - i, f.name, (draftsOf(f) ? `<button class="new-draft" data-new-draft="${f.id}" aria-label="new draft on ${esc(f.name)}" data-tip="new draft: a prompt kept for later">${ICON.draft}</button>` : '') + (heldWhy('spawn') ? heldHtml('spawn', `new session on ${f.name}`, ICON.plus) : can(f, 'spawn') ? `<button data-spawn="${f.id}" aria-label="new session on ${esc(f.name)}" data-tip="new session">${ICON.plus}</button>` : ''))}
    <div class="dirs">${dirHtml(f, f.hub, true)}${f.repos.map((r) => dirHtml(f, r, false)).join('')}</div>
    ${shelfHtml(f)}
    <div class="sessions">${heads.length ? heads.map((c) => crewHtml(f.cards, c)).join('') : '<div class="empty">lights off</div>'}</div>
    ${traysHtml(f)}
  </section>`
}

/** A meter's fill: ink, the working colour past `warm`, needs past `hot`. */
const fillOf = (pct, warm, hot) => (pct > hot ? 'var(--needs)' : pct > warm ? 'var(--working)' : 'var(--ink)')

/** A limit's meter, with a tick where an even pace through the week would be. */
const limitHtml = (r, now) => {
  const pct = r.percentUsed
  const elapsed = weekElapsed(r, now)
  const pace = elapsed === undefined ? '' : `<s style="left:${elapsed}%"></s>`
  return `<div${elapsed === undefined ? '' : ` data-tip="${paceLine(pct, elapsed)}"`}><div class="row">${esc(r.kind.replaceAll('_', ' '))} <b>${pct}%</b>
    <small>${r.resetsAt ? resetLine(r.resetsAt, now) : ''}</small></div>
    <div class="meter" style="--fill:${fillOf(pct, 60, 85)}"><i style="width:${pct}%"></i>${pace}</div></div>`
}

/** The rate limits as of their reading, dimmed once it is old enough to have moved. */
const limitsHtml = (now) => {
  if (!board.rateLimits.length) return '<small>no rate-limit reading yet</small>'
  const age = now - board.rateLimitsAt
  return `${board.rateLimits.map((r) => limitHtml(r, now)).join('')}
    <small class="asof ${age > LIMITS_STALE_MS ? 'stale' : ''}" data-tip="read during a session's turn: it refreshes only while one works">as of ${span(age)} ago</small>`
}

let limitsPainted = ''
function paintLimits() {
  const html = limitsHtml(Date.now())
  if (html !== limitsPainted) $('limits').innerHTML = limitsPainted = html
}

const windowHtml = (c) => {
  const title = `${callsign(c.id)} · ${statusName(c)}${gistLine(c) ? ' · ' + gistLine(c) : ''}`
  return `<a class="w ${onDuty(c) ? 'lit' : 'past'} ${c.attention}" href="#${c.id}" aria-label="${esc(title)}" data-tip="${esc(title)}"></a>`
}

const buildingHtml = (f, i) => {
  const shown = [...f.cards].sort(byStart).slice(-BUILDING_WINDOWS)
  const dark = '<div class="w"></div>'.repeat(Math.max(0, BUILDING_MIN_WINDOWS - shown.length) + (4 - (Math.max(shown.length, BUILDING_MIN_WINDOWS) % 4)) % 4)
  return `<div class="building" style="${paint(f.id)}">${signHtml(i + 1, f.name)}<div class="mast ${loudest(f.cards.filter((c) => c.waiting)) ?? ''} ${f.cards.some((c) => c.waiting) ? 'alarm' : ''}"></div>
    <div class="body">${shown.map(windowHtml).join('')}${dark}</div></div>`
}

/** The skyline's sky follows the viewer's clock, as Tower 3D's does: the sun crosses by day, the moon hangs at night. */
function paintSky() {
  const now = new Date()
  const hours = now.getHours() + now.getMinutes() / 60
  const sky = skyAt(hours)
  const day = Math.min(1, Math.max(0, (hours - 6) / 13))
  for (const [name, value] of Object.entries({ top: sky.top, mid: sky.mid, horizon: sky.horizon })) $('sky').style.setProperty(`--sky-${name}`, value)
  $('sky').style.setProperty('--stars', sky.stars)
  $('sky').style.setProperty('--orb-x', sky.stars > 0.5 ? '86%' : `${36 + day * 56}%`)
  $('sky').style.setProperty('--orb-y', sky.stars > 0.5 ? '14%' : `${46 - Math.sin(day * Math.PI) * 34}%`)
  $('orb')?.classList.toggle('moon', sky.stars > 0.5)
  $('orb')?.classList.toggle('sun', sky.stars <= 0.5)
  if ($('clock')) $('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
}

function skylineHtml() {
  const waiting = heededWaits(board, heed).length
  const working = cards().filter((c) => c.status === 'working').length
  const big = waiting ? `<b>${waiting}</b> waiting on you` : working ? `${working} at work` : 'all quiet'
  return `<div class="stars"></div><div class="orb" id="orb"></div>
    <div class="hello ${loudest(waitsOnYou()) ?? ''}"><div class="big">${big}</div><div class="sub">${waiting && board.keys['next-waiting'].length ? `press ${board.keys['next-waiting'].map(chordLabel).join(' or ')} to go to the next one` : !board.hostUp ? `click a window to read it · ${esc(whyNot(board, 'spawn'))}` : 'click a window, or + on a floor to start a session'}</div>
      <div class="clock" id="clock"></div></div>
    <div class="city">${board.floors.map(buildingHtml).join('')}</div><div class="street"></div>`
}

/** The selected worker's header: who and where, a glance at its context, cost and leftovers, its views, what it does now, and the workers around it. */
function barHtml(c) {
  const ports = c.resources.flatMap((r) => r.ports.map((p) => `:${p}`)).join(' ')
  const orphan = c.resources.some((r) => r.orphan)
  const ctx = c.context
  repaint($('bar-info'), `<span class="call" role="heading" aria-level="2">${callsign(c.id)}</span>
    <span class="pill ${lampOf(c)}${c.stuck ? ' stuck' : ''}"${c.stuck || c.broken ? ` data-tip="${esc(statusTitle(c))}"` : ''}><span class="lamp"></span>${statusName(c)} ·<span data-since="${c.enteredAt}"></span></span>
    <span class="where" data-tip="${esc(c.cwd)}">${withIcons(esc(whereLine(c, floorOf(c.project))))}</span>
    <span class="stats">
      ${ctx === undefined ? '' : `<span class="meter" data-tip="context window: ${ctx}% · ${esc(modelName(c.model))}" style="--fill:${ctx > 80 ? 'var(--needs)' : 'var(--working)'}"><i style="width:${ctx}%"></i><span class="sr-only">context window, ${esc(modelName(c.model))}:</span></span><b>${ctx}%</b>`}
      ${c.costUsd != null ? `<b>$${c.costUsd.toFixed(2)}</b>` : ''}
      ${claudeFlagHtml(c) ?? ''}
      ${can(c, 'reap') ? `<button class="ports ${orphan ? 'orphan' : ''}" popovertarget="bar-left" data-tip="processes left running: click to see them and end them">${c.resources.length}▪ ${ports}</button>` : ''}
    </span>`)
  repaint($('bar-actions'), `<button class="icon-btn" popovertarget="bar-details" aria-label="details" data-tip="everything else about ${callsign(c.id)}">${ICON.info}</button>
    ${!can(c, 'resume') ? '' : heldWhy('resume') ? heldHtml('resume', 'Resume', `${ICON.resume} Resume`, 'primary') : `<button class="primary" data-resume="${esc(JSON.stringify(c.calls.resume))}">${ICON.resume} Resume</button>`}
    ${!can(c, 'review') ? '' : heldWhy('review') ? heldHtml('review', 'Review', 'Review') : `<button data-act="review" data-of="${c.id}" data-tip="hire a reviewer: it works in a fork of ${esc(c.checkout)} (uncommitted work included), reviews once against ${callsign(c.id)}'s goal and leaves notes on its thread">Review</button>`}
    ${letGoHtml(c, 'Let go')}
    ${can(c, 'send-home') ? `<button class="danger" data-act="send-home" data-of="${c.id}" data-tip="${esc(sendHomeTitle(c))}">Send home</button>` : ''}
    ${can(c, 'kill') ? `<button class="danger" data-act="kill" data-of="${c.id}">Kill</button>` : ''}
    <button class="icon-btn" data-act="home" aria-label="back to the skyline" data-tip="back to the skyline (Esc outside the terminal)">${ICON.close}</button>`)
  $('bar-details').innerHTML = detailsHtml(c)
  $('bar-left').innerHTML = leftHtml(c)
  $('main').classList.toggle('asking', c.status === 'needs_input' || c.status === 'blocked')
  $('ask').innerHTML = `<span class="what"><span class="call">${callsign(c.id)}</span> ${c.blocked ? esc(BLOCKED_TEXT[c.blocked]) : c.tool ? `asks to ${toolHtml(c.tool)}` : 'needs you'}</span>
    ${can(c, 'drive') ? '<button class="primary" data-act="drive">Open terminal</button>' : ''}`
  repaint($('bar-line'), [
    paneTabsHtml(c, paneOf(c)),
    `<button class="activity" popovertarget="bar-details" data-tip="${esc(gistLine(c))}">${lineOf(c)}</button>`,
    movesHtml(c),
  ].filter(Boolean).join(''))
  renderPane(c)
}

/** The details open over the top of the screen, clear of the header that opened them. */
$('bar-details').addEventListener('beforetoggle', (e) => e.newState === 'open' && ($('bar-details').style.top = `${$('screen').getBoundingClientRect().top + 6}px`))

/** The rest of what is known about a worker, opened from its header: what it does now in full, and every detail. */
/** What the worker left running, each process ended on its own or all at once. */
function leftHtml(c) {
  if (!c.resources.length) return `<h3>${callsign(c.id)} left nothing running</h3>`
  const row = (r) => `<div class="proc"><code>${r.pid}</code><span class="on ${r.orphan ? 'orphan' : ''}">${[...r.ports.map((p) => `:${p}`), r.orphan ? 'orphan' : ''].filter(Boolean).join(' ')}</span>
    <span class="cmd" data-tip="${esc(r.command)}">${esc(r.command)}</span><button data-reap-process="${esc(JSON.stringify(r.calls.reap))}" data-tip="end process ${r.pid}">End</button></div>`
  return `<h3>Left running by ${callsign(c.id)}</h3>${c.resources.map(row).join('')}
    <div class="all"><button class="danger" data-reap="${c.id}">End all ${c.resources.length}</button></div>`
}

function detailsHtml(c) {
  const rows = [
    ['now', gistLine(c)],
    ...detailsOf(c),
    resumesRow(c, when),
    ['started', when(c.startedAt)],
    ['terminal', term && selected === c.id ? `${term.cols}×${term.rows} · ${isOwner() ? 'sized to this view, you type' : 'watching'}` : ''],
  ].filter(([, value]) => value)
  return `<h3>${callsign(c.id)}</h3><dl>${rows.map(([label, value]) => `<dt>${label}</dt><dd>${esc(value)}</dd>`).join('')}</dl>`
}

const MOVE_TITLE = { prev: 'previous on duty', next: 'next on duty', waiting: 'next waiting on you' }

/** The keymap's command for each move (src/shared/keymap.ts). */
const MOVE_COMMAND = { prev: 'prev-worker', next: 'next-worker', waiting: 'next-waiting' }

/** What a control does with the chords of the command it shares, when it has any: `hide the sidebar (⌘B)`. */
/** The close of a view in the main pane: back to the skyline. */
const CLOSE_HOME = `<button class="icon-btn" data-act="home" aria-label="back to the skyline" data-tip="back to the skyline">${ICON.close}</button>`

const withKeys = (what, id) => (keysLabel(board.keys, id) ? `${what} (${keysLabel(board.keys, id)})` : what)

/** The workers each move key goes to from `c`, named before you go, and ✕ for `c`'s own wait while you heed it. */
function movesHtml(c) {
  const to = neighbours(board, c.id, heed)
  const wait = heededWaits(board, heed).find((w) => w.id === c.id)
  const dismiss = wait ? `<button class="icon-btn dismiss" data-dismiss="${esc(wait.key)}" aria-label="${DISMISS_TITLE}" data-tip="${DISMISS_TITLE}">${ICON.close}</button>` : ''
  const move = (m) => {
    const card = to[m]
    if (!card || card.id === c.id) return ''
    return `<button class="move ${m} ${card.attention}" data-move="${m}" aria-label="${MOVE_TITLE[m]}: ${callsign(card.id)}, ${statusName(card)}" data-tip="${withKeys(MOVE_TITLE[m], MOVE_COMMAND[m])}" aria-keyshortcuts="${keyshortcuts(board.keys, MOVE_COMMAND[m])}"><small>${board.keys[MOVE_COMMAND[m]].length ? chordLabel(board.keys[MOVE_COMMAND[m]][0]) : ""}</small><span class="lamp ${lampOf(card)}"></span><span class="call">${callsign(card.id)}</span></button>`
  }
  const moves = dismiss + ['prev', 'next', 'waiting'].map(move).join('')
  return moves && `<span class="moves">${moves}</span>`
}

/** The selected session's view in the main pane, as the viewer picked it since selecting the session. */
let paneChoice
/** A running session opens on its terminal, a finished one on its brief; a shown thing closed since falls back. */
const paneOf = (c) =>
  (paneChoice?.startsWith('shown:') && !shownOn(c, paneChoice) ? undefined : paneChoice) ?? (can(c, 'drive') || !can(c, 'brief') ? 'screen' : 'brief')

const PANE_PANEL = { screen: 'c-screen', brief: 'brief', changes: 'changes', reviews: 'reviews' }

/** The keymap's command for each pane of the selected worker. */
const PANE_COMMAND = { 'pane-terminal': 'screen', 'pane-brief': 'brief', 'pane-changes': 'changes', 'pane-reviews': 'reviews' }

/** A pane tab's chords as `aria-keyshortcuts`, for the panes the keymap names. */
const paneKeys = (pane) => {
  const id = Object.keys(PANE_COMMAND).find((c) => PANE_COMMAND[c] === pane)
  return id && board.keys[id].length ? ` aria-keyshortcuts="${keyshortcuts(board.keys, id)}"` : ''
}

/** A pane's tab, as the ARIA tabs pattern has it: only the selected one is in the Tab order, arrows move along the row. */
const paneTabAttrs = (id, on) =>
  `role="tab" aria-selected="${on}" tabindex="${on ? 0 : -1}" aria-controls="${id.startsWith('shown:') ? 'shown' : PANE_PANEL[id]}"${paneKeys(id)} data-pane="${esc(id)}"`

const paneTabsHtml = (c, pane) => {
  const shown = visibleShown(c)
  return `<span class="tab-set" role="tablist" aria-label="views of ${callsign(c.id)}"><button class="pane-tab ${pane === 'screen' ? 'on' : ''}" ${paneTabAttrs('screen', pane === 'screen')}>Terminal</button>` +
    (can(c, 'brief') ? `<button class="pane-tab ${pane === 'brief' ? 'on' : ''}" ${paneTabAttrs('brief', pane === 'brief')} data-tip="the last prompts and answers of each conversation, in full">Brief</button>` : '') +
    `<button class="pane-tab ${pane === 'changes' ? 'on' : ''}" ${paneTabAttrs('changes', pane === 'changes')} data-tip="what changed in the worker's repos, as git reads it">Changes${changesTally(c)}</button>` +
    (keepsThreads(c) ? `<button class="pane-tab ${pane === 'reviews' ? 'on' : ''}" ${paneTabAttrs('reviews', pane === 'reviews')} data-tip="the review thread of checkout ${esc(threadCheckoutOf(c))}: notes from you, its workers and reviewers">Reviews${reviewsTally(c)}</button>` : '') +
    shown.map((s) => shownTabHtml(c, s, pane === shownPane(s))).join('') + '</span>'
}

/** What a worker showed, as a tab: a link opens in a browser tab, anything else also opens out of the tower. */
const shownTabHtml = (c, s, on) => {
  const from = shownFrom(c.lineage, s)
  return `<button class="pane-tab shown-tab ${on ? 'on' : ''}" ${paneTabAttrs(shownPane(s), on)} data-tip="${esc(`${callsign(c.id)} showed ${s.target} · ${ago(Date.now() - s.at)} ago${from ? ` · in ${from.label}` : ''}`)}">` +
  `<span class="shown-name">${s.kind === 'link' ? `${ICON.remote} ` : ''}${esc(shownTitle(s))}</span>${from ? `<small>${from.mark}</small>` : ''}` +
  (on && s.kind !== 'link' ? `<span class="icon-btn" data-out="${esc(shownHref(s))}" aria-hidden="true" data-tip="open in a browser tab">${ICON.remote}</span>` : '') +
  (on && s.kind === 'file' ? fileSpansHtml(s.target) : '') +
  `<span class="icon-btn" data-unshow="${esc(shownKey(s))}" aria-hidden="true" data-tip="close: it comes back if shown again">${ICON.close}</span></button>`
}

const shownPane = (s) => `shown:${s.target}`
const shownOn = (c, pane) => visibleShown(c).find((s) => shownPane(s) === pane)
/** Each showing has its own key: closing one leaves the next showing of the same target open. */
const shownKey = (s) => `${s.session}|${s.target}|${s.at}`
const shownHref = (s) => (s.kind === 'file' ? `/shown/${s.session}${s.target.split('/').map(encodeURIComponent).join('/')}` : s.target)

/** The showings this viewer closed, by `session|target|at`, kept in `tower.store`. */
const unshown = new Set((await tower.store.get('shown.closed')) ?? [])
const visibleShown = (c) => c.shown.filter((s) => !unshown.has(shownKey(s)))

function unshow(key) {
  unshown.add(key)
  tower.store.set('shown.closed', [...unshown].slice(-200))
  render()
}

/** The selected session, whether it works, and its conversations as the brief last drew them: it asks again when they change. */
let briefKey

/** The brief and what a worker showed lie over the terminal, which keeps its size: a hidden terminal would refit the PTY to nothing. */
function renderPane(c) {
  const pane = paneOf(c)
  renderShown(c, pane.startsWith('shown:') ? shownOn(c, pane) : undefined)
  const brief = pane === 'brief'
  $('c-screen').inert = pane !== 'screen'
  $('main').classList.toggle('on-brief', brief)
  $('main').classList.toggle('on-changes', pane === 'changes')
  $('main').classList.toggle('on-reviews', pane === 'reviews')
  const reviewing = pane === 'changes' || pane === 'reviews'
  followChanges(reviewing ? c : undefined)
  if (reviewing && keepsThreads(c)) followThread(c)
  if (pane === 'changes') drawChanges()
  if (pane === 'reviews') drawReviews(c)
  const key = brief && `${c.id} ${c.status === 'working'} ${JSON.stringify(c.conversations)}`
  if (!key || key === briefKey) return
  briefKey = key
  told(tower.conversations(c.id)).then((threads) => threads && briefKey === key && showBrief(c, threads))
}

/** The showing the shown pane last drew: a new showing of the same target draws it again. */
let shownDrawn

function renderShown(c, s) {
  $('main').classList.toggle('on-shown', Boolean(s))
  const key = s && shownKey(s)
  if (key === shownDrawn) return
  shownDrawn = key
  if (!s) return ($('shown').innerHTML = '')
  if (s.kind === 'url') return ($('shown').innerHTML = `<iframe src="${esc(s.target)}" allow="clipboard-read; clipboard-write"></iframe>`)
  if (s.kind === 'link') return ($('shown').innerHTML = `<iframe class="doc" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>`, showLink(c, s))
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(s.target)) return ($('shown').innerHTML = `<img src="${esc(shownHref(s))}" alt="${esc(shownTitle(s))}">`)
  if (/\.(mp4|webm)$/i.test(s.target)) return ($('shown').innerHTML = `<video controls autoplay src="${esc(shownHref(s))}"></video>`)
  if (!s.target.endsWith('.md')) return ($('shown').innerHTML = `<iframe sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write" src="${esc(shownHref(s))}"></iframe>`)
  $('shown').innerHTML = `<iframe class="doc" sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>`
  told(tower.text(shownHref(s).slice(1))).then((md) => {
    if (md === undefined || shownDrawn !== key) return
    $('shown').firstChild.srcdoc = `<!doctype html><html ${tower.prefs.attributes()}><meta charset="utf-8"><base target="_blank"><link rel="stylesheet" href="/design.css"><style>${documentCss}${DOC_CSS}</style><article>${documentHtml(md, shownHref(s))}</article>`
  })
}

/**
 * The changes of the selected session, read when its Changes pane opens, every `CHANGES_POLL_MS` while it stays open,
 * and when a turn ends. Claude edits through scripts as often as through its edit tools, so git is read on a timer.
 */
const CHANGES_POLL_MS = 30_000
/** The last read: `viewed` holds each repo's marks, a file's path → the hash of the diff it was viewed at. */
let changes
let changesPoll
/** Files the viewer folded or unfolded against what their viewed mark says, by `fileKey`; this page only. */
const folds = new Set()

/** The marks of a repo are shared by every renderer in this browser, through `tower.store`. */
const viewedKey = (dir) => `viewed:${dir}`
const fileAt = (key) => changedFiles(changes.repos).find(([repo, f]) => fileKey(repo, f) === key)

function followChanges(c) {
  if (changesPoll && changesPoll.id !== c?.id) changesPoll = (clearInterval(changesPoll.timer), undefined)
  if (!c) return
  if (!changesPoll) {
    changesPoll = { id: c.id, status: c.status, timer: setInterval(() => readChanges(c.id), CHANGES_POLL_MS) }
    return readChanges(c.id)
  }
  const turnEnded = changesPoll.status === 'working' && c.status !== 'working'
  changesPoll.status = c.status
  if (turnEnded) readChanges(c.id)
}

/** Why the last read of a worker's Changes failed, by its id, while none is held. */
let changesFailed

async function readChanges(id) {
  const repos = await tower.get(`changes/${id}`).catch((err) => {
    if (changes?.id === id) return void (lostAt || toast(err.message))
    changesFailed = { id, message: err.message }
    render()
  })
  if (!repos || changesPoll?.id !== id) return
  changesFailed = undefined
  const marks = await Promise.all(repos.map((repo) => tower.store.get(viewedKey(repo.dir))))
  changes = { id, repos, at: Date.now(), viewed: Object.fromEntries(repos.map((repo, i) => [repo.dir, marks[i] ?? {}])) }
  render()
}

/** Files viewed of files changed, once read. */
const changesTally = (c) => {
  if (changes?.id !== c.id) return ''
  const { viewed, files } = viewedCount(changes)
  return files ? `<small>${viewed}/${files}</small>` : ''
}

function toggleViewed(key) {
  const [repo, f] = fileAt(key)
  changes.viewed[repo.dir] = marksToggled(changes.viewed, repo, f)
  tower.store.set(viewedKey(repo.dir), changes.viewed[repo.dir])
  folds.delete(key)
  keepingFileTop($('changes'), key, render)
}

function toggleFold(key) {
  if (!folds.delete(key)) folds.add(key)
  keepingFileTop($('changes'), key, drawChanges)
}

/**
 * Lines picked in the Changes pane (`picking` while they are dragged across), and the note being written under them;
 * `pickFresh` until the box first takes focus.
 */
let pick
let picking = false
let pickText = ''
let pickFresh = false
const dropPick = () => ((pick = undefined), (pickText = ''))
/** How the Changes pane draws a diff, unified or split, kept in `tower.store` for every renderer. */
let diffLayout = (await tower.store.get(DIFF_LAYOUT_KEY)) ?? 'unified'

function drawChanges() {
  const c = findCard(selected)
  const read = changes?.id === c.id ? changes : undefined
  const live = read && livePick(read, pick)
  if (read && pick && !live) toast('The file changed under your pick: pick its lines again, your note is kept')
  if (read) pick = live
  const failed = read || changesFailed?.id !== c.id ? undefined : changesFailed.message
  drawPanel($('changes'), changesHtml({ read, failed, folds, pick, picking, thread: threadOf(c), checkout: threadCheckoutOf(c), user: board.user.name, state: c.checkoutState, noting: can(c, 'note'), layout: diffLayout }), { 'pick-text': pickText })
  if (pickFresh) $('changes').querySelector('[data-pick-text]')?.focus()
  pickFresh = false
  if (jump && read) jumpToAnchor()
}

function pickLine(value, extend) {
  pick = picked(changes, pick, value, extend)
  pickFresh = true
  drawChanges()
}

watchPickDrag($('changes'), {
  drag: (from, to) => ((pick = spanned(changes, from, to)), (picking = true), drawChanges()),
  drop: () => ((picking = false), (pickFresh = true), drawChanges()),
})

const reviewsOf = (f) => f?.collections.find((col) => col.id === REVIEWS)
const keepsThreads = (c) => Boolean(reviewsOf(floorOf(c.project)))
/** The thread the worker's Reviews show: the one Tidy filed once its work landed, else its checkout's. */
const threadItem = (c) => reviewsOf(floorOf(c.project))?.items.find((i) => i.id === (c.threadState.filed?.id ?? threadId(threadCheckoutOf(c))))

/** The thread of the selected worker's checkout as last read: read again whenever its file's version moves on the board. */
let review

function followThread(c) {
  const checkout = threadCheckoutOf(c)
  const item = threadItem(c)
  const key = `${c.project}/${item?.id ?? checkout}@${item?.modifiedAt ?? 'none'}`
  if (review?.key === key) return
  const same = review?.project === c.project && review.checkout === checkout && review.item === item?.id
  review = { key, project: c.project, checkout, item: item?.id, thread: !item ? { checkout, messages: [] } : same ? review.thread : undefined }
  if (!item) return
  tower.text(`collection/${c.project}/${REVIEWS}/${encodeURIComponent(item.id)}`).then(
    (text) => review?.key === key && ((review.thread = parseThread(text)), (review.failed = undefined), render()),
    (err) => review?.key === key && (review.thread ? toast(err.message) : ((review.failed = err.message), render())),
  )
}

/** The `[data-hold]` row at a scrolled list's top edge, the last to start at or above it, and its offset from the edge. */
const topAnchorOf = (list) => {

  const row = [...list.querySelectorAll('[data-hold]')].findLast((el) => el.getBoundingClientRect().top <= top) ?? list.querySelector('[data-hold]')
  return row && { key: row.dataset.hold, offset: row.getBoundingClientRect().top - top }
}

/**
 * Replaces a scrolled list's content with what stays at its top kept where it was: a browser's scroll anchoring holds
 * a list still while rows above change height, and loses its anchor when the rows are replaced.
 */
function redrawHeld(list, html) {
  const anchor = topAnchorOf(list)
  list.innerHTML = html
  const row = anchor && list.querySelector(`[data-hold="${CSS.escape(anchor.key)}"]`)

}

/** Writes `html` into `el` only when it changed, so a focused or hovered control in it survives a render. */

const paintOnce = (el, html) => painted.get(el) === html || (painted.set(el, html), (el.innerHTML = html))
/** `paintOnce`, the control that had focus in `el` keeping it. */
const repaint = (el, html) => keepingFocus(el, () => paintOnce(el, html))

  const host = lostAt ? 'unknown' : hostState(board)

/**
 * What this viewer did about the waits (`Heed` in cards.ts): dismissed, kept in `tower.store` for every renderer of
 * theirs, and visited by N this round. `ring`: how often a wait rings, kept there too; `rungAt`: when one last rang.
 */
let heed = { dismissed: new Set(), visited: new Set() }
let ring = 'once'
let rungAt = Date.now()
/** The board the last transitions were read against: none until the first, which is silent. */
let attended

/** The worker you are looking at: its waits notify and ring for nobody. */
const watching = (id) => document.hasFocus() && selected === id

/**
 * One notification per wait that begins, none for the waits already on the board when the page opened, for those
 * dismissed or for the worker being watched; each closes once its wait is over. The first of them rings.
 */
const alerts = new Map()
function attend(next) {
  const { began, ended } = transitions(attended, next)
  attended = next
  for (const w of ended) (alerts.get(w.key)?.close(), alerts.delete(w.key))
  const said = waitsBeganLine(began.filter((w) => !heed.dismissed.has(w.key)), callsign)
  if (said) announce(said)
  const fresh = began.filter((w) => !heed.dismissed.has(w.key) && !watching(w.id))
  if (Notification.permission === 'granted') for (const w of fresh) alerts.set(w.key, showAlert(findCard(w.id), w))
  ringFor(fresh)
}

/** Rings the first of `waits` not of the worker being watched, unless rings are off. */
function ringFor(waits) {
  const wait = ring === 'off' ? undefined : ringing(waits, document.hasFocus() ? selected : undefined)
  if (!wait) return
  rungAt = Date.now()
  playSound(SOUNDS[soundOf(wait)])
}

let audio
function playSound({ notes, wave, step }) {
  audio ??= new AudioContext()
  const now = audio.currentTime
  notes.forEach((freq, i) => {
    const osc = audio.createOscillator()
    const gain = audio.createGain()
    osc.type = wave
    osc.frequency.value = freq
    gain.gain.setValueAtTime(0, now + i * step)
    gain.gain.linearRampToValueAtTime(0.12, now + i * step + 0.02)
    gain.gain.exponentialRampToValueAtTime(0.0001, now + i * step + 0.9)
    osc.connect(gain).connect(audio.destination)
    osc.start(now + i * step)
    osc.stop(now + i * step + 1)
  })
}

/** The viewer's dismissals and ring setting as `tower.store` keeps them: another renderer of theirs may have changed them. */
async function readHeed() {
  const [dismissed, stored] = await Promise.all([tower.store.get(DISMISSED_KEY), tower.store.get(RING_KEY)])
  heed = { ...heed, dismissed: new Set(dismissed ?? []) }
  ring = stored ?? 'once'
}

function dismissWait(key) {
  const dismissed = dismissing(board, heed.dismissed, key)
  heed = { ...heed, dismissed: new Set(dismissed) }
  tower.store.set(DISMISSED_KEY, dismissed)
  alerts.get(key)?.close()
  render()
}

function chooseRing(next) {
  ring = next
  tower.store.set(RING_KEY, ring)

}

/** Every showing the page has seen: a new one opens its tab on the selected session, and alerts when you aren't looking at it. */
const seenShown = new Set()
let shownPrimed = false

function noticeShown(all) {
  for (const c of all) for (const s of visibleShown(c)) {
    const key = shownKey(s)
    if (seenShown.has(key)) continue
    seenShown.add(key)
    if (!shownPrimed) continue
    if (selected === c.id) showPane(shownPane(s))
    if (!(document.hasFocus() && selected === c.id) && Notification.permission === 'granted') showShownAlert(c, s)
  }
  shownPrimed = true
}

function showShownAlert(c, s) {
  const n = new Notification(`${callsign(c.id)} ${s.kind === 'link' ? 'asks you to open' : 'shows you'} ${shownTitle(s)}`, { body: `${c.project}: ${s.target}`, tag: shownKey(s) })
  n.onclick = () => (window.focus(), select(c.id), showPane(shownPane(s)), n.close())
}

function showAlert(c, w) {
  const n = new Notification(`${callsign(c.id)} · ${statusName(c)}`, {
    body: `${c.project}: ${gistLine(c)}`, tag: c.id, requireInteraction: w.reason === 'blocked' || w.reason === 'asks',
  })
  n.onclick = () => (window.focus(), select(c.id), n.close())

}

/** To the worker a move key names, in the order every renderer moves in (src/shared/cards.ts). */

/** Says `msg` to a screen reader, through the polite live region: a new node each time, so the same words are said again. */
const announce = (msg) => $('announce').replaceChildren(Object.assign(document.createElement('p'), { textContent: msg }))

/** Tells what just happened, with an action that follows it up when given (`/toasts.js`, a live region of its own). */
const toast = toaster($('toasts'))

/** A request whose failure is told in a toast, answering `undefined`. */
const told = (request) => request.catch((err) => (toast(err.message), undefined))

const floorOf = (project) => board.floors.find((f) => f.id === project)

let term, fit, stopScreen
const REFIT_DEBOUNCE_MS = 120

/**
 * The PTY has one size: whoever types owns it. Opening the terminal claims it when no other terminal is open on the
 * session, fitting the PTY to this pane; a resize from anyone else hands it back, and the view follows the PTY at a
 * font scaled to fit.
 */
let claimed

/** The terminals' face and the size the viewer drives at, from their appearance. */
const termFont = () => terminalFont(tower.prefs.get())
const fitFont = (cols, rows) => fitSize($('c-screen'), cols, rows, termFont())

const leaveHint = () => (keysLabel(board.keys, 'leave-terminal') ? ` · ${keysLabel(board.keys, 'leave-terminal')} leaves` : '')

function showMode(text = isOwner() ? `in control · ${term.cols}×${term.rows}` : `watching · type to take control${leaveHint()}`) {
  $('c-mode').className = isOwner() ? 'owner' : ''
  $('c-mode').textContent = text
}

function claim() {
  term.options.fontSize = termFont().size
  fit.fit()
  claimed = { cols: term.cols, rows: term.rows }
  told(tower.call('resize', { id: selected, ...claimed }))
  showMode()
}

const isOwner = () => Boolean(claimed && term && claimed.cols === term.cols && claimed.rows === term.rows)

const sendKeys = tower.keys
const sendShellKeys = tower.shellKeys

function followPty(cols, rows) {
  if (term.cols === cols && term.rows === rows) return
  term.resize(cols, rows)
  if (!isOwner()) term.options.fontSize = fitFont(cols, rows)
  showMode()
}

const typed = (data) => {
  if (document.activeElement !== term.textarea) return
  if (!isOwner()) claim()
  sendKeys(selected, data)
}

function openTerminal({ cols, rows, data, exited, terminals }) {
  term?.dispose()
  term = new Terminal({ cols, rows, fontSize: fitFont(cols, rows), fontFamily: termFont().family, cursorBlink: false, scrollback: 0, theme: terminalTheme(scheme()) })
  fit = new FitAddon.FitAddon()
  term.loadAddon(fit)
  term.open($('c-screen'))
  term.write(data)
  if (exited) return (term.attachCustomKeyEventHandler(terminalKeymap(() => board.keys, run, () => {})), showMode(`past session · read-only${leaveHint()}`))
  term.attachCustomKeyEventHandler(terminalKeymap(() => board.keys, run, typed))
  term.onData(typed)
  reportWheel(term, typed)
  if (terminals === 0) claim()
  else showMode()
  term.focus()
}

function closeTerminal() {
  claimed = undefined
  stopScreen?.()
  term?.dispose()
  term = undefined
  $('c-screen').innerHTML = ''
  $('c-mode').textContent = ''
}

/** The selected session is kept in the URL hash, so a reload reopens it. */
function select(id) {
  closeDrawer()
  leaveItem()
  leaveShelf()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  arriving = undefined
  selected = id
  paneChoice = undefined
  dropPick()
  noteRe = undefined
  history.replaceState(null, '', `#${id}`)
  $('main').classList.remove('home')
  render()
  stopScreen = tower.watch(`terminal/${id}`, (msg) => {
    if (msg.t === 'snapshot') openTerminal(msg)
    if (msg.t === 'o') term.write(msg.data)
    if (msg.t === 'r') followPty(...msg.size.split('x').map(Number))
    if (msg.t === 'x') select(id)
  })
}

function goHome() {
  closeDrawer()
  followChanges(undefined)
  leaveItem()
  leaveShelf()
  leaveDraft()
  leaveArchive()
  closeTerminal()
  arriving = undefined
  selected = undefined
  history.replaceState(null, '', location.pathname)
  $('main').classList.add('home')
  render()
}

let refitTimer
new ResizeObserver(() => {
  clearTimeout(refitTimer)
  refitTimer = setTimeout(() => {
    if (!term) return
