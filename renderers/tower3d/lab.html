<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Lab</title>
<link rel="stylesheet" href="/design.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--enamel); color: var(--ink); font: 13px/1.45 var(--ui); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#panel { position: fixed; top: 14px; left: 14px; bottom: 14px; width: 300px; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
h1 { margin: 0; font: 900 17px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; }
h3 { margin: 6px 0 2px; font: 800 11px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
#models { display: flex; flex-wrap: wrap; gap: 4px; }
#models button { font: 700 11px/1 var(--ui); padding: 4px 8px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; }
#models button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.row b { font-variant-numeric: tabular-nums; }
.good { color: var(--muted); }
.bad { color: var(--broken); font-weight: 700; }
.names { display: flex; flex-wrap: wrap; gap: 3px; }
.names code { font: 11px/1.4 var(--mono); padding: 0 5px; border-radius: 3px; background: var(--sunk); color: var(--muted); }
.names code.kept { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="panel"><h1>Model lab</h1><div id="models"></div><div id="facts"></div></div>
<script src="lab.js"></script>
</body>
</html>
