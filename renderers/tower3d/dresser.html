<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dresser</title>
<link rel="stylesheet" href="/design.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--enamel); color: var(--ink); font: 13px/1.45 var(--ui); }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.panel { position: fixed; top: 12px; bottom: 76px; width: 288px; padding: 10px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
#look { left: 12px; }
#fit { right: 12px; }
#bar { position: fixed; left: 12px; right: 12px; bottom: 12px; height: 54px; padding: 8px 12px; display: flex; align-items: center; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
h1 { margin: 0; font: 900 16px/1 var(--display); text-transform: uppercase; letter-spacing: .06em; }
h3 { margin: 6px 0 0; font: 800 10px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); }
label.row, .row { display: flex; align-items: center; gap: 6px; }
label.row > span:first-child { width: 58px; flex: none; color: var(--muted); font-size: 12px; }
select, input[type=text], input[type=number] { flex: 1; min-width: 0; font: 12px/1 var(--ui); padding: 4px 6px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }
input[type=number] { width: 58px; flex: none; font-family: var(--mono); font-size: 11px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--ink); }
button { font: 700 11px/1 var(--ui); padding: 5px 8px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; white-space: nowrap; }
button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
.group { display: flex; flex-wrap: wrap; gap: 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; }
.swatches i { width: 15px; height: 15px; border-radius: 3px; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .2); }
.swatches i.on { box-shadow: 0 0 0 2px var(--ink); }
.worn { display: flex; flex-direction: column; gap: 2px; }
.worn button { text-align: left; display: flex; justify-content: space-between; font-weight: 600; }
.worn button small { font-weight: 400; color: inherit; opacity: .7; }
.axes { display: grid; grid-template-columns: 40px repeat(3, 1fr); gap: 3px; align-items: center; }
.axes input { width: 100%; }
.axes b { font: 700 11px/1 var(--ui); color: var(--muted); }
.from { font: 11px/1.3 var(--mono); color: var(--muted); }
.warn { color: var(--broken); font-size: 12px; }
.muted { color: var(--muted); font-size: 12px; }
#bar .group { flex-wrap: nowrap; }
#clock { width: 52px; font: 11px/1 var(--mono); color: var(--muted); text-align: right; }
button.die { padding: 3px 4px; line-height: 0; flex: none; }
.big svg { vertical-align: -2px; margin-right: 4px; }
.bodies { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.bodies button { padding: 6px 2px; }
.big { padding: 7px 10px; font-size: 12px; }
details summary { cursor: pointer; color: var(--faint); font: 800 10px/1 var(--display); text-transform: uppercase; letter-spacing: .1em; margin-top: 6px; }
details[open] summary { margin-bottom: 6px; }
.outfits { display: flex; flex-direction: column; gap: 3px; }
.outfits .row button.name { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; }
.cost { font: 11px/1.4 var(--mono); color: var(--muted); }
.cost b { color: var(--ink); }
.state { font-size: 12px; padding: 5px 7px; border-radius: var(--radius); background: var(--sunk); }
.state b { color: var(--ink); }
.keys { font-size: 11px; color: var(--faint); }
kbd { font: 10px/1 var(--mono); padding: 1px 4px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.confirm { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid var(--ink); border-radius: var(--radius); }
.confirm ul { margin: 0; padding-left: 16px; font-size: 12px; }
#tags { position: fixed; inset: 0; pointer-events: none; }
.tag { position: absolute; transform: translate(-50%, 4px); padding: 3px 6px; border-radius: var(--radius); font: 700 11px/1.2 var(--ui); white-space: nowrap;
  background: var(--panel); color: var(--muted); border: 1px solid var(--line); text-align: center; }
.tag.fitted { color: var(--ink); border-color: var(--ink); }
.tag.active { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tag small { display: block; font-weight: 400; opacity: .8; }
textarea { width: 100%; height: 140px; font: 10px/1.3 var(--mono); background: var(--sunk); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="look" class="panel"></div>
<div id="fit" class="panel"></div>
<div id="bar"></div>
<div id="tags"></div>
<script src="dresser.js"></script>
</body>
</html>
