# Every pull request, and main, gets the checks a release gets (release.yml), then proves they left the tree as committed
# and the knowledge base consistent. If main moves between a PR's event and its run, kb verify says HEAD does not contain
# origin/main: re-run once GitHub has recomputed the merge.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run tower3d
      - name: Tower.app's Swift sources compile
        run: xcrun swiftc -typecheck -swift-version 5 apps/macos/Sources/*.swift
      - name: Tests and builds added and rewrote no file
        run: test -z "$(git status --porcelain)" || { git status; git diff; exit 1; }
      - name: The knowledge base verifies
        run: node .claude/skills/kb/tool/kb.mjs verify
